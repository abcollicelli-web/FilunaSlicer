<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelos 3D</title>
<link rel="stylesheet" href="base.css">
<style>
/* mesma tela dos Paramétricos e Ferramentas (modelo aprovado modelos-parametricos.html / modelos-3d.html) */
.wrap{padding:30px 34px}
.wrap h1{font-size:30px;font-weight:800;margin:0}
.sub{color:var(--ink2);font-size:15px;margin-top:8px}
.chips{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid var(--line);border-radius:11px;font-size:14.5px;font-weight:500;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:#C2185B;color:#fff;border-color:#C2185B;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.m{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;font-family:inherit;padding:0;color:var(--ink)}
.m:hover{border-color:#F6C6D8;box-shadow:0 10px 24px rgba(60,50,40,.08)}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;background:#FCFAF7;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.b{display:flex;align-items:center;padding:12px 16px;border-top:1px solid var(--line);gap:8px}
.n{font-size:15.5px;font-weight:700}
.s{font-size:12.5px;color:var(--ink2);margin-top:3px}
.pontos{margin-left:auto;display:flex;gap:4px}.pontos i{width:12px;height:12px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.12)}
.vazio{padding:40px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Modelos 3D</h1><div class="sub">Modelos do catálogo Filuna, com tempo, filamento e preço de venda medidos. Abra um modelo para ver em 3D e imprimir.</div>
  <div class="chips" id="c"></div>
  <div class="grid" id="g"><div class="vazio">Carregando os modelos…</div></div>
</div>
<script src="ponte.js"></script>
<script>
var E = Filuna.esc, itens = [], cat = "Todos";
function tempo(s) { s = +s || 0; var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + " h " : "") + m + " min"; }
function desenhar() {
	var cats = ["Todos"];
	itens.forEach(function (i) { if (i.categoria && cats.indexOf(i.categoria) < 0) cats.push(i.categoria); });
	document.getElementById("c").innerHTML = cats.map(function (c) { return '<button class="chip' + (c == cat ? " on" : "") + '" data-c="' + E(c) + '">' + E(c) + "</button>"; }).join("");
	document.querySelectorAll("[data-c]").forEach(function (b) { b.onclick = function () { cat = b.dataset.c; desenhar(); }; });
	var l = itens.filter(function (i) { return cat == "Todos" || i.categoria == cat; });
	document.getElementById("g").innerHTML = l.length ? l.map(function (m) {
		return '<button class="m" data-slug="' + E(m.slug) + '"><div class="thumb"><img src="' + E(m.capa) + '" alt="" loading="lazy"></div><div class="b"><div><div class="n">' + E(m.titulo) + '</div><div class="s">' + E(m.categoria || "Modelo") +
			(m.tempo_s ? " · " + tempo(m.tempo_s) : "") + (m.gramas ? " · " + m.gramas + " g" : "") + '</div></div><span class="pontos">' + (m.cores || []).slice(0, 5).map(function (c) { return '<i style="--c:' + E(c.hex) + '"></i>'; }).join("") + "</span></div></button>";
	}).join("") : '<div class="vazio">Nenhum modelo nesta categoria.</div>';
	document.querySelectorAll("[data-slug]").forEach(function (b) { b.onclick = function () { location.href = "modelo-3d.html?slug=" + encodeURIComponent(b.dataset.slug); }; });
}
fetch("https://filuna3d.com/api/slicer/v1/modelos3d").then(function (r) { return r.json(); }).then(function (d) { itens = d.modelos || []; desenhar(); })
	.catch(function () { document.getElementById("g").innerHTML = '<div class="vazio">Sem conexão: os modelos do catálogo aparecem quando o computador estiver na internet.</div>'; });
Filuna.iniciar();
</script>
</body>
</html>
