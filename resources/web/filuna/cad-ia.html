<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
/* Filuna CAD · Modelar com IA (pedido do dono, 24/11/2026): o Claude ou o ChatGPT do próprio cliente, pela assinatura
   dele (sem chave, sem crédito), modela no Design conversando. Ela lê o Design e pede passos pelo conector Filuna;
   esta tela busca os passos e roda no programa (CAD/DesignPanelFiluna.cpp), cada um com Desfazer. */
html,body{background:#fff;height:100%;overflow:hidden}
body{display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:none}
.top .t{font-size:16px;font-weight:800}.top .s{font-size:12px;color:var(--ink2)}
.top .x{margin-left:auto;border:0;background:none;font-size:20px;color:var(--muted);padding:2px 8px}
.navb{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--side);border-bottom:1px solid var(--line);flex:none}
.navb button{border:0;background:none;font-size:15px;color:var(--ink2);padding:2px 6px}
.navb .vt{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--magenta-deep)}
.navb .st{flex:1;min-width:0;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc{padding:14px 16px;flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto}
.pc h3{font-size:14.5px;font-weight:800;margin-top:4px}
.txt{font-size:13.5px;color:var(--ink2);line-height:1.5}
.it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;font-size:13.5px;line-height:1.4}
.it .ic{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:12.5px;background:var(--pill)}
.it.ok .ic{background:var(--good-bg);color:var(--good)}.it.av .ic{background:var(--warn-bg);color:var(--warn)}
.it.ia{background:#F7F3FF;border-color:#E2D8FF}.it.ia .ic{background:var(--violeta);color:#fff}
.it b{font-weight:800}.it small{display:block;color:var(--ink2);font-size:12px;margin-top:2px}
.it .cx{flex:1;min-width:0}
.ac{margin-left:auto;flex:none;align-self:center;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--magenta);background:#fff;color:var(--magenta-deep);font-weight:700;font-size:12.5px}
.ac.cinza{border-color:var(--line);color:var(--ink2)}
.pedir textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;font-size:13.5px;resize:vertical;min-height:70px}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips button{font-size:12px;padding:5px 10px;border-radius:999px;background:var(--rose);color:var(--magenta-deep);font-weight:700;border:0}
.pf{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex:none}
.bp{flex:1;height:42px;border:0;border-radius:12px;background:var(--magenta);color:#fff;font-weight:800;font-size:14.5px}
.bp:disabled{opacity:.5}
.bs{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-weight:700;font-size:13.5px;color:var(--ink)}
.prog{height:6px;border-radius:3px;background:var(--pill);overflow:hidden;position:relative}
.prog div{position:absolute;height:100%;width:35%;background:var(--magenta);border-radius:3px;animation:vai 1.2s ease-in-out infinite}
@keyframes vai{0%{left:-35%}100%{left:100%}}
.erro{color:var(--warn);font-size:13px}
.ok-verde{color:var(--good);font-weight:800;font-size:12.5px}
</style>
</head>
<body>
<div id="topo"></div>
<div id="corpo" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>
<script src="ponte.js"></script>
<script>
var E = Filuna.esc;
var IAS = {
	claude: { nome: "Claude", cor: "#B5552F", fundo: "#F4E9E1", letra: "C", inicio: "https://claude.ai/new", conectores: "https://claude.ai/settings/connectors",
		pergunta: function (q) { return "https://claude.ai/new?q=" + encodeURIComponent(q); }, nota: "Sua assinatura do Claude (inclusive a grátis)" },
	chatgpt: { nome: "ChatGPT", cor: "#10845F", fundo: "#E3F1EC", letra: "G", inicio: "https://chatgpt.com/", conectores: "https://chatgpt.com/#settings/Connectors",
		pergunta: function (q) { return "https://chatgpt.com/?q=" + encodeURIComponent(q); }, nota: "Sua assinatura do ChatGPT" }
};
var EXEMPLOS = ["Caixa 80×50×30 mm com tampa de encaixe", "Suporte de celular para mesa", "Placa 60×40×4 mm com 4 furos M3 nos cantos",
	"Porca sextavada M8", "Vaso redondo de 10 cm de altura", "Gancho de parede com 2 furos de parafuso"];
var st = { ia: "", iaAberta: false, conectadas: [], endereco: "https://filuna3d.com/api/ia/mcp", log: [], ocupado: "", erro: "", pedido: "",
	vistos: {}, comandosEnviados: false };

function nat(a, d) { return Filuna.nativo(a, d); }
function on(id, f) { var b = document.getElementById(id); if (b) b.onclick = f; }
function item(cls, ic, titulo, texto, botao, id) {
	return '<div class="it ' + cls + '"><div class="ic">' + ic + '</div><div class="cx"><b>' + E(titulo) + "</b>" + (texto ? "<small>" + E(texto) + "</small>" : "") + "</div>" +
		(botao ? '<button class="ac' + (botao.cinza ? " cinza" : "") + '" id="' + id + '">' + E(botao.t) + "</button>" : "") + "</div>";
}
function falha(e) { st.ocupado = ""; st.erro = (e && (e.erro || e.message)) || "Não deu certo. Tente de novo."; desenhar(); }
function conectada(k) { var n = IAS[k].nome.toLowerCase(); return st.conectadas.some(function (c) { return String(c).toLowerCase().indexOf(n) >= 0 || (k == "chatgpt" && /openai/i.test(c)); }); }

// ------------------------------------------------ o que a IA lê (filuna_cad) e os passos que ela pede (filuna_cad_fazer)
var ultimoEnvio = "";
function publicar() {
	if (!Filuna.temToken()) return Promise.resolve();
	var levarComandos = !st.comandosEnviados;
	return nat("cad.estado", { com_comandos: levarComandos }).then(function (e) {
		if (!e || !e.aberto) return;
		var comandos = e.comandos; delete e.comandos;
		var t = JSON.stringify(e);
		if (t == ultimoEnvio && !levarComandos) return;
		var corpo = { estado: e }; if (levarComandos && comandos) corpo.ferramentas = comandos;
		return Filuna.api("POST", "/ia/cad", corpo).then(function () { ultimoEnvio = t; if (levarComandos) st.comandosEnviados = true; });
	}).catch(function () { ultimoEnvio = ""; });
}
function buscar() {
	if (!Filuna.temToken() || st.ocupado) return Promise.resolve();
	return Filuna.api("GET", "/ia/cad/pedidos").then(function (r) {
		st.conectadas = r.conectadas || []; if (r.endereco) st.endereco = r.endereco;
		var novos = (r.pedidos || []).filter(function (p) { return !st.vistos[p.id]; });
		if (novos.length) return executar(novos[0]);
	}).catch(function () {});
}
function executar(p) {
	st.vistos[p.id] = 1;
	st.ocupado = "Sua " + (p.ia || "IA") + " está modelando: " + p.texto; st.erro = ""; desenhar();
	return nat("cad.executar", { comandos: p.comandos }).then(function (r) {
		var feitos = (r.passos || []).filter(function (x) { return x.ok; }).length;
		var ruim = (r.passos || []).filter(function (x) { return !x.ok; })[0];
		st.log.unshift({ ia: p.ia, texto: p.texto, ok: r.ok, feitos: feitos, total: p.comandos.length, erro: ruim ? ruim.metodo + ": " + ruim.erro : "" });
		return Filuna.api("POST", "/ia/cad/pedidos/" + p.id, { estado: r.ok ? "feito" : "erro", resultado: r.passos });
	}, function (e) {
		var msg = (e && (e.erro || e.message)) || "erro";
		st.log.unshift({ ia: p.ia, texto: p.texto, ok: false, feitos: 0, total: p.comandos.length, erro: msg });
		return Filuna.api("POST", "/ia/cad/pedidos/" + p.id, { estado: "erro", resultado: [{ ok: false, erro: msg }] });
	}).catch(function () {}).then(function () { st.ocupado = ""; desenhar(); return publicar(); });
}
function desfazerUltimo() {
	var u = st.log[0]; if (!u || !u.feitos) return;
	var passos = []; for (var i = 0; i < u.feitos; i++) passos.push({ metodo: "desfazer" });
	st.ocupado = "Desfazendo o que a IA fez…"; desenhar();
	nat("cad.executar", { comandos: passos }).then(function () { u.desfeito = true; st.ocupado = ""; desenhar(); publicar(); }, falha);
}

// ------------------------------------------------ a IA do cliente
function guardarIA(k) { st.ia = k; nat("armazem.gravar", { chave: "cadia.ia", valor: k }).catch(function () {}); }
function abrirIA(url) { return nat("cadia.abrir", { url: url }).then(function () { st.iaAberta = true; desenhar(); }, falha); }
function comecar() {
	var k = st.ia || "claude", ia = IAS[k];
	var q = "Use o conector Filuna. Vamos modelar uma peça no meu Filuna CAD (aba Design do Filuna Slicer). Leia filuna_cad para ver o " +
		"que já existe e a lista completa de comandos; depois modele em passos com filuna_cad_fazer e confira cada um com filuna_cad_resposta. " +
		"Faça tudo direto no Filuna CAD: não gere OpenSCAD, STL, STEP, código nem arquivo. " +
		"Medidas em milímetros, peça para impressão 3D. Se faltar alguma medida, me pergunte antes." +
		(st.pedido ? " O que eu quero: " + st.pedido : " Pergunte o que eu quero modelar.");
	publicar();
	if (!st.ia) guardarIA(k);
	abrirIA(ia.pergunta(q));
}

// ------------------------------------------------ telas
function desenhar() {
	var topo = document.getElementById("topo"), c = document.getElementById("corpo");
	topo.innerHTML = '<div class="top"><div><div class="t">✦ Modelar com IA</div><div class="s">Seu Claude ou ChatGPT desenha no Filuna CAD, conversando</div></div>' +
		'<button class="x" id="fechar" title="Fechar">×</button></div>' +
		(st.iaAberta ? '<div class="navb"><button id="nv" title="Voltar">←</button><button id="nr" title="Recarregar">⟳</button><button id="nn" title="Abrir no navegador">↗</button>' +
			'<span class="st">' + E(st.ocupado || (st.log[0] ? (st.log[0].ok ? "✓ " : "! ") + st.log[0].texto : "Converse com a sua IA: ela modela aqui ao lado")) + "</span>" +
			'<button class="vt" id="painel">Painel</button></div>' + (st.ocupado ? '<div class="prog"><div></div></div>' : "") : "");
	on("fechar", function () { nat("cadia.painel", { mostrar: false }); });
	on("nv", function () { nat("cadia.comando", { comando: "voltar" }); });
	on("nr", function () { nat("cadia.comando", { comando: "recarregar" }); });
	on("nn", function () { nat("cadia.comando", { comando: "navegador" }); });
	on("painel", function () { nat("cadia.fechar_ia").then(function () { st.iaAberta = false; desenhar(); }); });
	if (st.iaAberta) { c.innerHTML = ""; return; }

	if (!Filuna.temToken()) {
		c.innerHTML = '<div class="pc"><div class="txt">Entre na sua conta Filuna: é por ela que a sua IA vê o Design e modela nele. ' +
			"A Filuna não cobra nada: a IA trabalha pela assinatura que você já tem.</div></div>" +
			'<div class="pf"><button class="bp" id="ent">Entrar na conta Filuna</button></div>';
		on("ent", function () { Filuna.telaLogin ? Filuna.telaLogin() : nat("aba.abrir", { aba: "home" }); });
		return;
	}
	var esc = st.ia, h = '<div class="pc">';
	if (st.ocupado) h += '<div class="prog"><div></div></div><div class="txt" style="font-size:12.5px">' + E(st.ocupado) + "</div>";
	h += '<div class="pedir"><h3>O que você quer modelar?</h3><textarea id="pedido" placeholder="Ex.: uma caixa de 80×50×30 mm com tampa de encaixe e cantos arredondados">' +
		E(st.pedido) + '</textarea></div><div class="chips">' + EXEMPLOS.map(function (x, i) { return '<button data-ex="' + i + '">' + E(x) + "</button>"; }).join("") + "</div>";
	h += "<h3>Sua IA</h3>";
	Object.keys(IAS).forEach(function (k) {
		var ia = IAS[k], lig = conectada(k);
		h += '<div class="it' + (esc == k ? " ok" : "") + '"><div class="ic" style="background:' + ia.fundo + ";color:" + ia.cor + '">' + ia.letra + '</div><div class="cx"><b>' + ia.nome +
			(lig ? ' <span class="ok-verde">· Filuna ligada</span>' : "") + "</b><small>" + ia.nota + '</small></div><button class="ac" data-ia="' + k + '">' + (esc == k ? "Abrir" : "Usar") + "</button></div>";
	});
	if (esc && !conectada(esc))
		h += "<h3>Ligar a Filuna no " + IAS[esc].nome + " (só na primeira vez)</h3>" +
			item("", "1", "Entrar na sua conta", "Abre o " + IAS[esc].nome + " aqui no painel. A Filuna não vê a sua senha.", { t: "Entrar" }, "p1") +
			item("", "2", "Adicionar o conector da Filuna", "Copio o endereço; na tela de conectores, adicione um conector personalizado e cole: " + st.endereco, { t: "Copiar e abrir" }, "p2") +
			item("", "3", "Permitir na tela da Filuna", "Marque 'Preparar e imprimir'. Depois volte aqui.", { t: "Conferir" }, "p3");
	if (st.log.length) {
		h += "<h3>O que a IA fez</h3>";
		st.log.slice(0, 8).forEach(function (l, i) {
			h += item(l.ok ? "ok" : "av", l.ok ? "✓" : "!", l.texto, (l.desfeito ? "Desfeito · " : "") + l.feitos + " de " + l.total + " passo(s)" + (l.erro ? " · " + l.erro : ""),
				i == 0 && l.feitos && !l.desfeito ? { t: "Desfazer", cinza: 1 } : null, "desf");
		});
	}
	h += item("ok", "✓", "Sem chave, sem crédito", "A IA trabalha pela sua assinatura de sempre. Tudo o que ela faz tem Desfazer (Ctrl+Z).");
	if (st.erro) h += '<div class="erro">' + E(st.erro) + "</div>";
	c.innerHTML = h + '</div><div class="pf"><button class="bp" id="go"' + (st.ocupado ? " disabled" : "") + ">Começar com o " + IAS[esc || "claude"].nome + "</button></div>";

	var ta = document.getElementById("pedido");
	if (ta) ta.oninput = function () { st.pedido = ta.value; };
	document.querySelectorAll("[data-ex]").forEach(function (b) { b.onclick = function () { st.pedido = EXEMPLOS[+b.dataset.ex]; desenhar(); }; });
	// "Abrir" já leva a instrução: sem ela a IA não sabe que deve modelar no Filuna CAD e escreve código (OpenSCAD).
	document.querySelectorAll("[data-ia]").forEach(function (b) { b.onclick = function () { var k = b.dataset.ia; if (st.ia == k) comecar(); else { guardarIA(k); st.erro = ""; desenhar(); } }; });
	on("p1", function () { abrirIA(IAS[esc].inicio); });
	on("p2", function () { nat("texto.copiar", { texto: st.endereco }).catch(function () {}); abrirIA(IAS[esc].conectores); });
	on("p3", function () { buscar().then(desenhar); });
	on("desf", desfazerUltimo);
	on("go", comecar);
}

Filuna.iniciar().then(function () {
	return nat("armazem.ler", { chave: "cadia.ia" }).then(function (r) { if (r && r.valor && IAS[r.valor]) st.ia = r.valor; }).catch(function () {});
}).then(function () { desenhar(); publicar(); buscar().then(desenhar); });
Filuna.ouvir("conta", function () { st.comandosEnviados = false; ultimoEnvio = ""; desenhar(); publicar(); });
// Com o painel aberto: manda o Design para a IA e busca os passos que ela pediu.
setInterval(function () {
	nat("cadia.estado").then(function (e) {
		if (!e || !e.aberto) return;
		if (e.ia_aberta != st.iaAberta) { st.iaAberta = e.ia_aberta; desenhar(); }
		publicar().then(buscar);
	}).catch(function () {});
}, 3000);
</script>
</body>
</html>
