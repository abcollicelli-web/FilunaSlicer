<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
/* Barra inferior da Preparação (referência 01-preparacao.png): sugestão de venda, peso, custo, tempo, aviso, IA Filuna e Autoajuda. */
html,body{background:#fff;overflow:hidden;height:100%}
.r{height:100%;display:flex;align-items:center;gap:28px;padding:0 24px;border-top:1px solid var(--line)}
.bl span{display:block;font-size:12.5px;color:var(--ink2)}.bl b{display:block;font-size:17px;font-weight:800;margin-top:2px;white-space:nowrap}
.venda{cursor:pointer;min-width:150px}.venda b{color:var(--magenta-deep)}
.num{min-width:78px}
.div{width:1px;align-self:stretch;margin:12px 0;background:var(--line)}
#dica{flex:1;min-width:0;font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dica b{color:var(--ink)}
.dir{display:flex;align-items:center;gap:22px;flex:none}
.dir label{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600}
</style>
</head>
<body>
<div class="r">
	<div class="bl venda" id="venda" title=""><span id="lucro">Sugestão de venda</span><b id="preco">Preço após fatiar</b></div>
	<div class="bl num"><span>Peso</span><b id="peso">—</b></div>
	<div class="bl num"><span>Custo</span><b id="custo">—</b></div>
	<div class="bl num"><span>Tempo</span><b id="tempo">—</b></div>
	<div class="div"></div>
	<div id="dica"></div>
	<div id="detalhe" hidden></div>
	<div class="dir"><a id="ia">IA Filuna</a><label><span id="autoTxt">Autoajuda ligada</span><span class="chave"><input type="checkbox" id="auto" checked><span></span></span></label></div>
</div>
<script src="ponte.js"></script>
<script>
var ultimo = "", autoajuda = true, prefsLidas = false;
var DICAS = {
	vazio: "<b>Comece aqui:</b> arraste um modelo para a mesa ou use Importar. A Sugestão de venda aparece quando você fatiar.",
	pronto: "<b>Próximo passo:</b> clique em Fatiar mesa. O Filuna calcula peso, tempo e preço com a mesma conta da calculadora do site.",
	fatiado: "<b>Pronto para enviar.</b> Confira a Visualização camada por camada e use Exportar ou envie para a impressora.",
	semconta: "<b>Dica:</b> entre na sua conta Filuna para a sugestão de venda usar seus custos (energia, mão de obra, margem)."
};
function dica(k) {
	document.getElementById("dica").innerHTML = autoajuda ? DICAS[k] : "Custos definidos por você. " + (k == "fatiado" ? "Estimativa do último fatiamento." : "Nenhuma estimativa calculada.");
	document.getElementById("autoTxt").textContent = autoajuda ? "Autoajuda ligada" : "Autoajuda desligada";
}
function tempoCurto(s) { s = Math.round(s || 0); var h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? h + "h" + (m < 10 ? "0" : "") + m : m + "min"; }

function ler() {
	if (!prefsLidas) {
		prefsLidas = true;
		Filuna.prefs().then(function (v) { autoajuda = v["interface.autoajuda"] !== false; document.getElementById("auto").checked = autoajuda; ultimo = ""; ler(); }).catch(function () {});
	}
	Filuna.nativo("fatiamento.resumo").then(function (r) {
		if (!r.fatiado) {
			ultimo = ""; ["peso", "custo", "tempo"].forEach(function (i) { document.getElementById(i).textContent = "—"; });
			document.getElementById("preco").textContent = "Preço após fatiar";
			document.getElementById("lucro").textContent = "Sugestão de venda"; document.getElementById("venda").title = "";
			dica(r.objetos ? "pronto" : "vazio"); return;
		}
		document.getElementById("tempo").textContent = tempoCurto(r.tempo_s);
		var chave = JSON.stringify([r.tempo_s, r.volumes, r.material]);
		if (chave == ultimo) return;
		ultimo = chave;
		dica(Filuna.temToken() ? "fatiado" : "semconta");
		if (!Filuna.temToken()) { document.getElementById("peso").textContent = Filuna.gramas(r.gramas_estimadas); document.getElementById("preco").textContent = "Entre na conta"; document.getElementById("lucro").textContent = "Sugestão de venda"; return; }
		Filuna.api("POST", "/preco", { material: r.material, placas: [{ tempo_s: r.tempo_s, camadas: r.camadas || 0, volumes: r.volumes }] }).then(function (p) {
			document.getElementById("preco").textContent = Filuna.reais(p.preco_sugerido);
			document.getElementById("custo").textContent = Filuna.reais(p.custo_total);
			var g = p.gramas || {}; document.getElementById("peso").textContent = Filuna.gramas(typeof g == "object" ? (g.total != null ? g.total : Object.values(g).reduce(function (a, b) { return a + (+b || 0); }, 0)) : g);
			document.getElementById("lucro").textContent = "Sugestão de venda · lucro " + Filuna.reais(p.lucro);
			var c = p.custos || {};
			document.getElementById("venda").title = Object.keys(c).map(function (k) { return k.replace(/_/g, " ") + ": " + Filuna.reais(c[k]); }).join("\n");
		}, function (e) { document.getElementById("lucro").textContent = e.erro; if (e.status == 401) Filuna.sair(); });
	}).catch(function () {});
}
var E = Filuna.esc;
document.getElementById("venda").onclick = function () { Filuna.nativo("aba.abrir", { aba: "filuna.espaco", secao: "config" }); };
document.getElementById("ia").onclick = function () { Filuna.nativo("aba.abrir", { aba: "filuna.espaco", secao: "ia" }); };
document.getElementById("auto").onchange = function () {
	autoajuda = this.checked; ultimo = ""; ler();
	// Mesma chave das Configurações (engrenagem › Filuna › Autoajuda); a conta recebe uma cópia.
	Filuna.nativo("config.gravar", { chave: "filuna_pref_interface_autoajuda", valor: autoajuda ? "true" : "false" }).then(Filuna.enviarPrefs).catch(function () {});
};
Filuna.ouvir("fatiado", function () { ultimo = ""; ler(); });
Filuna.ouvir("preferencias", function (d) { if (d.valores) { autoajuda = d.valores["interface.autoajuda"] !== false; document.getElementById("auto").checked = autoajuda; ultimo = ""; ler(); } });
Filuna.iniciar().then(ler);
setInterval(ler, 3000);
Filuna.ouvir("preferencias", function () { prefsLidas = false; ler(); });
</script>
</body>
</html>
