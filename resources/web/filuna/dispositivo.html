<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dispositivo</title>
<link rel="stylesheet" href="base.css">
<style>
.head{display:flex;align-items:flex-start;padding:8px 32px 18px;gap:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hr{margin-left:auto;display:flex;align-items:center;gap:12px;padding-top:6px;flex-wrap:wrap}
.hri{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px}
.lista{width:250px;border-right:1px solid var(--line);background:var(--side);padding:16px 12px;flex:none;overflow:auto}
.imp{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;margin-bottom:4px}
.imp:hover{background:#F4F0EA}.imp.on{background:var(--rose)}
.imp .n{font-weight:700;font-size:14px}.imp .s{font-size:12px;color:var(--muted)}
.estado{width:10px;height:10px;border-radius:50%;flex:none;background:#CFC8BE}
.e-imprimindo{background:var(--magenta-deep)}.e-livre{background:var(--good)}.e-limpar_mesa{background:var(--violeta)}.e-pausada{background:var(--orange)}.e-erro,.e-falhou{background:var(--warn)}
.body{flex:1;display:flex;gap:28px;padding:24px 32px;min-height:0;flex-wrap:wrap}
.view{flex:1.5;min-width:340px;min-height:380px;background:var(--scene);border-radius:16px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cena{position:absolute;inset:0;background:radial-gradient(120% 80% at 55% 30%,#39352f,#1b1a19)}
.cena .gantry{position:absolute;top:70px;left:8%;right:8%;height:24px;background:linear-gradient(#4a453e,#2e2a25);border-radius:4px}
.cena .rail{position:absolute;top:118px;left:14%;width:72%;height:10px;background:linear-gradient(90deg,#8a847c,#c9c3ba,#8a847c);border-radius:6px}
.cena .cab{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:66px;height:66px;background:linear-gradient(#534e46,#34302a);border-radius:6px}
.cena .mesa{position:absolute;bottom:60px;left:50%;transform:translate(-50%,0) perspective(900px) rotateX(60deg) rotateZ(-28deg);width:440px;height:210px;background:linear-gradient(145deg,#2a2824,#201e1b);border-radius:6px}
.cena .peca{position:absolute;bottom:120px;left:50%;transform:translate(-50%,0);width:140px;border-radius:50%/22%;background:linear-gradient(90deg,#a83557,#d87d98 55%,#a83557);transition:height .5s}
.vtag{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.1);color:#e2ded8;font-size:13px;padding:8px 14px;border-radius:10px;z-index:2}
.vbase{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;padding:20px;margin-top:auto;gap:12px;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.vk{color:#cfcac3;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.vv{color:#fff;font-size:21px;font-weight:700;margin-top:6px}
.vbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px}
.direita{flex:1;min-width:320px;display:flex;flex-direction:column}
.titulo{font-size:25px;font-weight:800;margin-top:8px}.arq{color:var(--ink2);font-size:14px;margin-top:4px}
.pctrow{display:flex;align-items:flex-end;gap:36px;margin-top:16px}
.pct{font-size:50px;font-weight:800;line-height:1}.pct small{font-size:21px;margin-left:4px}
.eta{font-size:21px;font-weight:700}.eta .s{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.barrow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:8px}
.passos{display:flex;justify-content:space-between;margin-top:18px}
.passo{text-align:center;flex:1;font-size:13px;color:var(--ink2)}.passo .d{width:11px;height:11px;border-radius:50%;background:var(--magenta-deep);margin:0 auto 8px}
.passo.off .d{background:#D9D4CD}.passo.off{color:var(--muted)}
.ctl{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.ctl h4{font-size:16px}.ctl p{color:var(--ink2);font-size:13.5px;margin-top:4px}
.ctl .btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ctl .btns .btn{flex:1;height:46px}
.conf{margin-top:12px;padding:12px;border-radius:12px;background:var(--warn-bg);font-size:13.5px}
.mats{display:flex;align-items:center;gap:32px;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.mat{display:flex;align-items:center;gap:10px}.mat .n{font-size:14px;font-weight:600}.mat .s{font-size:12.5px;color:var(--muted)}
.rodape{min-height:50px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:24px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.rodape a{color:var(--ink2);font-weight:500}.rodape .r{margin-left:auto;color:var(--muted)}
.aviso{margin:14px 24px 0;padding:12px 14px;border-radius:12px;background:#F3EEFF;color:#4b2fb0;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.hri svg,.head .btn svg{width:18px;height:18px}
.temps{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.temps .v{font-size:44px;font-weight:800;line-height:1.05;margin-top:6px}.temps .a{font-size:13px;color:var(--ink2);margin-top:4px}
.trava{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink2)}
.diag{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
.perfil-aviso{margin-top:6px;font-size:13px;color:var(--warn)}.perfil-aviso a{margin-left:6px}
/* Configuração (sem impressora) e galeria de unidades — pranchas DEV-01 e DEV-02 da Direção Visual C */
.pg{padding:28px 32px}.pg .topo{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.cfg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:36px}
@media(max-width:1000px){.cfg{grid-template-columns:1fr}}
.cfg .cena2{background:#1C2024;border-radius:18px;min-height:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#EDEAE6;font-size:21px}
.passos2 .p{padding:22px 0;border-bottom:1px solid var(--line)}.passos2 .p b{font-size:18px;display:block}.passos2 .p span{color:var(--ink2);font-size:14px;margin-top:6px;display:block}
.passos2 .btn{width:100%;height:46px;margin-top:28px}
.filtros{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.filtros .campo{margin:0;width:min(520px,100%)}
.chip{border:none;border-radius:20px;padding:8px 26px;background:#ECE9E4;color:var(--ink2);font-weight:700;font-size:13px}.chip.on{background:var(--rose);color:var(--magenta-deep)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.un{background:#F1EEEA;border-radius:18px;padding:22px 22px 24px;display:flex;flex-direction:column}
.un .ilu{display:flex;justify-content:center;margin-bottom:18px}
.un .n{font-size:24px;font-weight:800}.un .st{margin:12px 0 24px;font-size:14.5px;color:var(--ink2)}.un .st.ok{color:var(--good)}
.un .btn{margin-top:auto;justify-content:flex-start;height:46px;padding:0 18px}
.nota{margin-top:26px;color:var(--ink2);font-size:14px}
.voltar{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600;font-size:13.5px;margin-bottom:8px;cursor:pointer}
</style>
</head>
<body>
<div class="tela"><div class="app" id="app"><div class="carregando">Carregando…</div></div></div>
<script src="ponte.js"></script>
<script>
// Fluxo do Dispositivo: sem impressora → configuração (DEV-01); com impressoras → galeria de unidades (DEV-02);
// ao abrir uma unidade → a tela aprovada (02-dispositivo). As impressoras cadastradas neste computador aparecem
// mesmo sem internet; a leitura da Farm (estado, trabalho, slots) entra quando a conta está conectada.
var estado = { vista: "lista", filtro: "todas", busca: "", unidades: [], imps: [], bobinas: [], locais: [], sel: null, local: null, confirmar: null };
var NOMES = { livre: "Livre", imprimindo: "Imprimindo", pausada: "Pausada", limpar_mesa: "Limpar a mesa", erro: "Com erro", offline: "Desconectada", falhou: "Falhou" };
var TONS = { livre: "ok", imprimindo: "rosa", limpar_mesa: "rosa", pausada: "alerta", erro: "alerta", falhou: "alerta" };
var E = Filuna.esc;

function carregar() {
	var pedidos = [
		Filuna.nativo("impressora.atual").then(function (r) { estado.local = r; }).catch(function () {}),
		Filuna.nativo("impressoras.registradas").then(function (r) { estado.locais = r.impressoras || []; }).catch(function () { estado.locais = []; })
	];
	if (Filuna.temToken()) pedidos.push(Promise.all([Filuna.api("GET", "/impressoras"), Filuna.api("GET", "/estoque").catch(function () { return { bobinas: [] }; })]).then(function (r) {
		estado.imps = r[0].impressoras || []; estado.bobinas = r[1].bobinas || []; estado.semLeitura = !!r[0]._offline; estado.erro = "";
	}, function (e) { if (e.status == 401) Filuna.sair(); estado.erro = e.erro; }));
	Promise.all(pedidos).then(function () { juntar(); aplicarPedido(); desenhar(); });
}

// Uma unidade por nome: cadastro deste computador e/ou impressora da Farm.
// Pedido de outra tela (Início › Farm › cartão da impressora): "unidade:<nome>" abre essa unidade.
function abrirPedido(secao) {
	if (!secao || secao.indexOf("unidade:") != 0) return;
	estado.pedido = secao.slice(8).trim().toLowerCase();
}
function aplicarPedido() {
	if (estado.pedido == null) return;
	var u = estado.unidades.filter(function (x) { return x.nome.trim().toLowerCase() == estado.pedido; })[0];
	estado.pedido = null;
	if (u) { estado.sel = u.id; estado.vista = "unidade"; }
}

function juntar() {
	var por = {}, lista = [];
	function chave(n) { return String(n || "").trim().toLowerCase(); }
	estado.imps.forEach(function (i) { var u = { id: "f:" + i.id, nome: i.nome, modelo: i.modelo || "", farm: i }; por[chave(i.nome)] = u; lista.push(u); });
	estado.locais.forEach(function (l) {
		var u = por[chave(l.nome)];
		if (u) { u.local = l; return; }
		lista.push({ id: "l:" + l.nome, nome: l.nome, modelo: (l.perfis && l.perfis[0]) || "", local: l });
	});
	estado.unidades = lista;
}

function leitura(u) {
	var i = u.farm;
	if (!i || estado.semLeitura || i.estado == "offline") return { txt: i && i.estado == "offline" ? "Offline · última leitura expirada" : "Sem leitura · cadastrada neste computador", ok: false, livre: false };
	if (i.estado == "imprimindo" && i.trabalho) return { txt: "Imprimindo · " + Math.round((i.trabalho.progresso || 0) * (i.trabalho.progresso <= 1 ? 100 : 1)) + " %", ok: true, livre: false };
	if (i.estado == "livre") return { txt: "Pronta · leitura atual", ok: true, livre: true };
	return { txt: (NOMES[i.estado] || i.estado) + " · leitura atual", ok: true, livre: false };
}

function ilustracao(w) {
	return '<svg viewBox="0 0 260 216" width="' + w + '" style="stroke:none"><rect x="8" y="8" width="244" height="180" rx="20" fill="#353B43"/><rect x="26" y="22" width="208" height="134" rx="12" fill="#11161B"/>' +
		'<rect x="45" y="36" width="170" height="3" fill="#7E8791"/><rect x="128" y="38" width="3" height="30" fill="#7E8791"/><rect x="111" y="66" width="37" height="28" rx="5" fill="#A3ABB4"/>' +
		'<path d="M55 130 L185 118 L215 145 L80 158 Z" fill="#4A535C"/><path d="M118 108 l15-9 15 9v18l-15 9-15-9z M118 108l15 9 15-9 M133 117v18" fill="none" stroke="#E4769C" stroke-width="3" stroke-linejoin="round"/>' +
		'<rect x="40" y="160" width="180" height="7" rx="3" fill="#7E8791"/><circle cx="226" cy="170" r="3.5" fill="#1F8F5F"/><rect x="22" y="188" width="216" height="22" rx="10" fill="#1C2024"/></svg>';
}

function configurar(app) {
	app.innerHTML = '<div class="pg"><div class="topo"><div class="h1">Sua primeira impressora</div><div class="sub">Cadastre a impressora uma vez; ela fica salva neste computador e funciona sem internet.</div></div>' +
		'<div class="cfg"><div class="cena2">' + ilustracao(300) + '<div>Seu espaço de impressão começa aqui</div></div><div class="passos2">' +
		'<div class="p"><b>Identificar</b><span>Descobrir a impressora na rede local ou informar o endereço autorizado.</span></div>' +
		'<div class="p"><b>Cadastrar</b><span>Associar a unidade, o modelo e o perfil, sem confundir cadastro com conexão.</span></div>' +
		'<div class="p"><b>Parear</b><span>Acesso local do titular; a autorização de comandos é separada.</span></div>' +
		'<div class="p"><b>Verificar</b><span>As capacidades são observadas antes de liberar comandos.</span></div>' +
		'<button class="btn primario" id="adicionar">+ Adicionar impressora</button></div></div></div>';
	app.querySelector("#adicionar").onclick = function () { Filuna.nativo("impressora.adicionar"); };
}

function galeria(app) {
	var f = estado.filtro, q = estado.busca.toLowerCase();
	var vis = estado.unidades.filter(function (u) {
		var l = leitura(u);
		if (f == "disp" && !l.livre) return false;
		if (f == "sem" && l.ok) return false;
		return !q || (u.nome + " " + u.modelo).toLowerCase().indexOf(q) >= 0;
	});
	app.innerHTML = '<div class="pg"><div class="topo entre"><div><div class="h1">Lista de unidades</div><div class="sub">' + estado.unidades.length +
		(estado.unidades.length == 1 ? " impressora cadastrada" : " impressoras cadastradas") + (estado.semLeitura ? " · sem conexão, mostrando o último estado guardado" : "") + '</div></div>' +
		'<button class="btn" id="adicionar">+ Adicionar impressora</button></div>' +
		'<div class="filtros"><div class="campo"><label>Buscar unidade</label><input type="text" id="busca" placeholder="Nome, modelo ou identificador" value="' + E(estado.busca) + '"></div>' +
		[["todas", "Todas"], ["disp", "Disponíveis"], ["sem", "Sem conexão"]].map(function (c) { return '<button class="chip' + (c[0] == f ? " on" : "") + '" data-f="' + c[0] + '">' + c[1] + "</button>"; }).join("") + "</div>" +
		(vis.length ? '<div class="galeria">' + vis.map(function (u, k) {
			var l = leitura(u);
			return '<div class="un"><div class="ilu">' + ilustracao(240) + '</div><div class="n">' + E(u.nome) + '</div><div class="st' + (l.ok ? " ok" : "") + '">' + E(l.txt) + "</div>" +
				'<button class="btn' + (k == 0 ? " primario" : "") + '" data-u="' + E(u.id) + '">› &nbsp;Abrir unidade</button></div>';
		}).join("") + "</div>" : '<div class="vazio">Nenhuma unidade neste filtro.</div>') +
		'<div class="nota">Cadastro não é presença. Estado desconhecido não é apresentado como online.</div>' + (estado.erro ? '<div class="erro">' + E(estado.erro) + "</div>" : "") + "</div>";
	app.querySelector("#adicionar").onclick = function () { Filuna.nativo("impressora.adicionar"); };
	var b = app.querySelector("#busca"); b.oninput = function () { estado.busca = b.value; var pos = b.selectionStart; galeria(app); var nb = app.querySelector("#busca"); nb.focus(); nb.setSelectionRange(pos, pos); };
	app.querySelectorAll("[data-f]").forEach(function (x) { x.onclick = function () { estado.filtro = x.dataset.f; galeria(app); }; });
	app.querySelectorAll("[data-u]").forEach(function (x) { x.onclick = function () { estado.sel = x.dataset.u; estado.vista = "unidade"; estado.confirmar = null; estado.msg = ""; desenhar(); }; });
}

function desenhar() {
	var app = document.getElementById("app");
	if (!estado.unidades.length) { estado.vista = "lista"; configurar(app); return; }
	var u = estado.unidades.filter(function (x) { return x.id == estado.sel; })[0];
	if (estado.vista != "unidade" || !u) { estado.vista = "lista"; galeria(app); return; }
	unidade(app, u);
}

function unidade(app, u) {
	var local = estado.local || {}, lista = "";
	// Unidade só cadastrada neste computador (ou sem conexão): mesma tela, sem leitura da Farm.
	var i = u.farm || { id: "", nome: u.nome, modelo: u.modelo, estado: "offline", slots: [], na_fila: 0 };
	var t = i.trabalho, prog = t ? Math.round((t.progresso || 0) * (t.progresso <= 1 ? 100 : 1)) : 0;
	var foto = i.camera_em ? '<img id="cam" alt="">' : '<div class="cena"><div class="gantry"></div><div class="rail"></div><div class="cab"></div><div class="mesa"></div><div class="peca" style="height:' + (20 + prog) + 'px;background:' + (t && t.cor ? E(t.cor) : "#a83557") + '"></div></div>';
	var passos = ["Preparado", "Enviado", "Imprimindo", "Concluído"], nivel = !t ? -1 : ({ aguardando: 0, bloqueado: 0, enviado: 1, imprimindo: 2, concluido: 3 }[t.estado] || 0);
	var html = '<div style="padding:16px 32px 0"><a class="voltar" id="voltar">‹ Unidades</a></div>' + cabecalho(i.nome, i.estado, i.modelo || "", local) +
		(i.estado == "limpar_mesa" ? '<div class="aviso"><span><b>Impressão concluída.</b> Retire as peças e limpe a mesa para liberar a próxima da fila.</span><button class="btn primario peq" id="mesaLimpa">Mesa limpa, pode seguir</button></div>' : "") +
		'<div class="corpo">' + lista + '<div style="flex:1;display:flex;flex-direction:column;min-width:0"><div class="body">' +
		'<div class="view">' + foto + '<div class="vtag">' + (i.camera_em ? "Câmera · última imagem" : "Ilustração · sem câmera ligada") + "</div>" +
		'<div class="vbase"><div><div class="vk">Vista da impressão</div><div class="vv">' + (t ? "Mesa " + E(t.mesa || 1) + " de " + E(t.mesas || 1) : "Sem impressão agora") + "</div></div>" +
		'<button class="vbtn" data-aba="monitor">' + (i.camera_em ? "Abrir câmera local" : "Abrir painel da impressora") + "</button></div></div>" +
		'<div class="direita"><div class="lbl">Trabalho atual</div>' +
		(t ? '<div class="titulo">' + E(t.descricao || "Pedido " + (t.pedido || "")) + '</div><div class="arq">' + E(t.arquivo || "") + (t.quantidade ? " · " + t.quantidade + " peça(s)" : "") + "</div>" +
			'<div class="pctrow"><div class="pct">' + prog + '<small>%</small></div><div class="eta">' + Filuna.tempo(t.resta_s) + '<div class="s">restante</div></div></div>' +
			'<div class="bar" style="margin-top:14px"><i style="width:' + prog + '%"></i></div>' +
			'<div class="barrow"><span><span class="dot" style="width:10px;height:10px;background:' + E(t.cor || "#ccc") + '"></span> ' + E((t.material || "") + " " + (t.cor_nome || "")) + "</span><span>" + Filuna.tempo(t.tempo_s) + " total</span></div>"
			: '<div class="titulo" style="color:var(--muted)">Nada imprimindo</div><div class="arq">' + (i.na_fila ? i.na_fila + " mesa(s) esperando na fila · " + Filuna.tempo(i.carga_s) : "Fila vazia") + "</div>") +
		'<div class="passos">' + passos.map(function (p, k) { return '<div class="passo' + (k > nivel ? " off" : "") + '"><div class="d"></div>' + p + "</div>"; }).join("") + "</div>" +
		// A Farm ainda não recebe as temperaturas da impressora: mostra "sem dado" em vez de inventar números.
		'<div class="temps"><div><div class="lbl">Bico</div><div class="v">—</div><div class="a">sem dado da impressora</div></div>' +
		'<div><div class="lbl">Mesa</div><div class="v">—</div><div class="a">sem dado da impressora</div></div></div>' +
		'<div class="ctl"><h4>Controle local</h4><p>O pedido vai pela sua conta até a impressora. Nada é feito sem você confirmar.</p><div class="btns">' +
		(i.estado == "pausada" ? '<button class="btn" data-cmd="retomar">Revisar retomada</button>' : '<button class="btn" data-cmd="pausar"' + (i.estado != "imprimindo" ? " disabled" : "") + ">Revisar pausa</button>") +
		'<button class="btn" data-cmd="cancelar"' + (["imprimindo", "pausada"].indexOf(i.estado) < 0 ? " disabled" : "") + ">Revisar cancelamento</button></div>" +
		'<div class="trava"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>Ação específica só após confirmação do titular.</div>' +
		(estado.confirmar ? '<div class="conf">Confirmar <b>' + E(estado.confirmar) + '</b> em ' + E(i.nome) + '? <button class="btn primario peq" id="sim">Confirmar</button> <button class="btn peq" id="nao">Voltar</button></div>' : "") +
		(estado.msg ? '<div class="okmsg">' + E(estado.msg) + "</div>" : "") +
		'<div class="diag" data-aba="monitor"><span>Diagnóstico e permissões</span><span>›</span></div>' + "</div></div></div>" +
		'<div class="mats"><div class="lbl">Materiais</div>' + materiais(i) + "</div></div></div>" + rodape();
	app.innerHTML = html;
	if (i.camera_em) camera(i.id);
	app.querySelector("#voltar").onclick = function () { estado.vista = "lista"; desenhar(); };
	app.querySelectorAll("[data-cmd]").forEach(function (b) { if (!u.farm) b.disabled = true; b.onclick = function () { estado.confirmar = b.dataset.cmd; estado.msg = ""; desenhar(); }; });
	var sim = app.querySelector("#sim"); if (sim) sim.onclick = function () {
		var c = estado.confirmar; estado.confirmar = null;
		Filuna.api("POST", "/impressoras/" + encodeURIComponent(i.id) + "/comando", { comando: c }).then(function () { estado.msg = "Pedido de " + c + " enviado. A impressora recebe em segundos."; desenhar(); },
			function (e) { estado.msg = e.erro; desenhar(); });
	};
	var nao = app.querySelector("#nao"); if (nao) nao.onclick = function () { estado.confirmar = null; desenhar(); };
	var ml = app.querySelector("#mesaLimpa"); if (ml) ml.onclick = function () {
		ml.disabled = true; Filuna.api("POST", "/impressoras/" + encodeURIComponent(i.id) + "/mesa-limpa", {}).then(carregar, function (e) { estado.msg = e.erro; desenhar(); });
	};
	ligarComuns(app);
}

// O perfil da Preparação é desta impressora? Compara o modelo da impressora com o modelo do perfil (sem acentos e espaços).
function mesmoModelo(a, b) {
	var n = function (x) { return String(x || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, ""); };
	a = n(a); b = n(b);
	return !a || !b || a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}

function cabecalho(nome, est, modelo, local) {
	var perfil = local.impressora || "", confere = mesmoModelo(modelo, local.modelo || perfil);
	var ic = function (d) { return '<svg viewBox="0 0 24 24">' + d + "</svg>"; };
	return '<div class="head"><div><div class="lbl">Dispositivo local</div><div class="h1">' + E(nome) +
		(est ? ' <span class="pill ' + (TONS[est] || "") + '">' + E(NOMES[est] || est) + "</span>" : "") + "</div>" +
		'<div class="sub">' + E(modelo) + (perfil ? " · Perfil " + E(perfil) : "") + "</div>" +
		(perfil && modelo && !confere ? '<div class="perfil-aviso">O perfil na Preparação não é desta impressora.<a data-aba="prepare">Escolher o perfil certo</a></div>' : "") + "</div>" +
		'<div class="hr"><span class="hri">' + ic('<path d="M3.5 9.5a12 12 0 0 1 17 0M6.5 12.5a7.5 7.5 0 0 1 11 0M9.5 15.5a3 3 0 0 1 5 0"/><circle cx="12" cy="18.5" r=".8"/>') + "LAN local</span>" +
		'<span class="hri">' + ic('<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>') + (Filuna.temToken() ? "Sessão do titular" : "Sem conta Filuna") + "</span>" +
		'<button class="btn" data-aba="monitor">' + ic('<path d="M12 3.5 19 6v5.5c0 4.2-3 7.6-7 9-4-1.4-7-4.8-7-9V6z"/><path d="m9 12 2 2 4-4"/>') + "Capacidades e saúde</button>" +
		'<button class="btn" data-aba="prepare">Revisar envio</button><button class="btn" data-aba="monitor">Configurar unidade</button></div></div>';
}

function materiais(i) {
	var slots = (i.slots || []).filter(function (x) { return x.material || x.cor; });
	if (slots.length) return slots.map(function (x) {
		return '<div class="mat"><span class="dot" style="width:18px;height:18px;background:' + E(x.cor || "#ccc") + '"></span><div><div class="n">' + E((x.material || "") + (x.cor_nome ? " · " + x.cor_nome : "")) +
			'</div><div class="s">Slot ' + E(x.posicao) + (x.bobina_restante_g != null ? " · restam " + Filuna.gramas(x.bobina_restante_g) : "") + "</div></div></div>";
	}).join("") + (i.mesa && i.mesa.w ? '<div class="mat"><div><div class="n">Mesa</div><div class="s">' + E(i.mesa.w + " × " + i.mesa.d + " mm") + "</div></div></div>" : "");
	var b = estado.bobinas.filter(function (x) { return x.na_impressora && x.na_impressora == i.nome; });
	if (!b.length) return '<span class="ajuda">Nenhuma bobina associada a esta impressora no estoque.</span>';
	return b.map(function (x) {
		return '<div class="mat"><span class="dot" style="width:16px;height:16px;background:' + E(x.cor) + '"></span><div><div class="n">' + E(x.material + " · " + x.cor_nome) +
			'</div><div class="s">Bobina nº ' + E(x.numero) + " · restam " + Filuna.gramas(x.restante_g) + (x.insuficiente ? " · <b style='color:var(--warn)'>não basta para a fila</b>" : "") + "</div></div></div>";
	}).join("");
}

function rodape() {
	return '<div class="rodape"><a style="color:var(--magenta-deep);font-weight:700" id="unidades">Impressoras</a><a data-aba="filuna.espaco" data-secao="estoque">Filamentos</a><a data-aba="filuna.espaco" data-secao="fila">Fila e histórico</a>' +
		'<span class="r">Envio, fila e agenda não iniciam impressão.</span></div>';
}

function ligarComuns(app) {
	var un = app.querySelector("#unidades"); if (un) un.onclick = function () { estado.vista = "lista"; desenhar(); };
	app.querySelectorAll("[data-aba]").forEach(function (b) { b.onclick = function () { Filuna.nativo("aba.abrir", { aba: b.dataset.aba, secao: b.dataset.secao || "" }); }; });
}

function camera(iid) {
	Filuna.nativo("config.ler", { chave: "filuna_token" }).then(function (r) {
		return fetch("https://filuna3d.com/api/slicer/v1/impressoras/" + encodeURIComponent(iid) + "/camera.jpg?" + Date.now(), { headers: { Authorization: "Bearer " + r.valor } });
	}).then(function (r) { return r.ok ? r.blob() : null; }).then(function (b) {
		var img = document.getElementById("cam"); if (b && img) img.src = URL.createObjectURL(b);
	}).catch(function () {});
}

Filuna.ouvir("mostrar", carregar);
Filuna.ouvir("impressoras", carregar);   // cadastrada agora em "Adicionar impressora"
Filuna.ouvir("secao", function (d) { Filuna.nativo("secao.pendente").catch(function () {}); abrirPedido(d.secao); carregar(); });
Filuna.iniciar().then(function () { return Filuna.nativo("secao.pendente").then(function (r) { abrirPedido(r.secao); }).catch(function () {}); }).then(carregar);
setInterval(function () { if (!document.hidden && !estado.confirmar && document.activeElement.id != "busca") carregar(); }, 15000);
</script>
