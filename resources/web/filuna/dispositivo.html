<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Dispositivo</title>
<link rel="stylesheet" href="base.css">
<style>
.head{display:flex;align-items:flex-start;padding:8px 32px 18px;gap:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hr{margin-left:auto;display:flex;align-items:center;gap:12px;padding-top:6px;flex-wrap:wrap}
.hri{display:flex;align-items:center;gap:8px;color:var(--ink2);font-size:14px}
.lista{width:250px;border-right:1px solid var(--line);background:var(--side);padding:16px 12px;flex:none;overflow:auto}
.imp{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;cursor:pointer;margin-bottom:4px}
.imp:hover{background:#F4F0EA}.imp.on{background:var(--rose)}
.imp .n{font-weight:700;font-size:14px}.imp .s{font-size:12px;color:var(--muted)}
.estado{width:10px;height:10px;border-radius:50%;flex:none;background:#CFC8BE}
.e-imprimindo{background:var(--magenta-deep)}.e-livre{background:var(--good)}.e-limpar_mesa{background:var(--violeta)}.e-pausada{background:var(--orange)}.e-erro,.e-falhou{background:var(--warn)}
.body{flex:1;display:flex;gap:28px;padding:24px 32px;min-height:0;flex-wrap:wrap}
.view{flex:1.5;min-width:340px;min-height:380px;align-self:flex-start;height:clamp(380px,48vh,540px);background:var(--scene);border-radius:16px;position:relative;overflow:hidden;display:flex;flex-direction:column}
.view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cena{position:absolute;inset:0;background:radial-gradient(120% 80% at 55% 30%,#39352f,#1b1a19)}
.cena .gantry{position:absolute;top:70px;left:8%;right:8%;height:24px;background:linear-gradient(#4a453e,#2e2a25);border-radius:4px}
.cena .rail{position:absolute;top:118px;left:14%;width:72%;height:10px;background:linear-gradient(90deg,#8a847c,#c9c3ba,#8a847c);border-radius:6px}
.cena .cab{position:absolute;top:92px;left:50%;transform:translateX(-50%);width:66px;height:66px;background:linear-gradient(#534e46,#34302a);border-radius:6px}
.cena .mesa{position:absolute;bottom:60px;left:50%;transform:translate(-50%,0) perspective(900px) rotateX(60deg) rotateZ(-28deg);width:440px;height:210px;background:linear-gradient(145deg,#2a2824,#201e1b);border-radius:6px}
.cena .peca{position:absolute;bottom:120px;left:50%;transform:translate(-50%,0);width:140px;border-radius:50%/22%;background:linear-gradient(90deg,#a83557,#d87d98 55%,#a83557);transition:height .5s}
.vtag{position:absolute;top:16px;left:16px;background:rgba(255,255,255,.1);color:#e2ded8;font-size:13px;padding:8px 14px;border-radius:10px;z-index:2}
.vbase{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;padding:20px;margin-top:auto;gap:12px;flex-wrap:wrap;background:linear-gradient(transparent,rgba(0,0,0,.45))}
.vk{color:#cfcac3;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.vv{color:#fff;font-size:21px;font-weight:700;margin-top:6px}
.vbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.18);height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px}
.direita{flex:1;min-width:320px;display:flex;flex-direction:column}
.titulo{font-size:25px;font-weight:800;margin-top:8px}.arq{color:var(--ink2);font-size:14px;margin-top:4px}
.pctrow{display:flex;align-items:flex-end;gap:36px;margin-top:16px}
.pct{font-size:50px;font-weight:800;line-height:1}.pct small{font-size:21px;margin-left:4px}
.eta{font-size:21px;font-weight:700}.eta .s{font-size:13px;color:var(--muted);font-weight:500;margin-top:4px}
.barrow{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:8px}
.passos{display:flex;justify-content:space-between;margin-top:18px}
.passo{text-align:center;flex:1;font-size:13px;color:var(--ink2)}.passo .d{width:11px;height:11px;border-radius:50%;background:var(--magenta-deep);margin:0 auto 8px}
.passo.off .d{background:#D9D4CD}.passo.off{color:var(--muted)}
.ctl{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.ctl h4{font-size:16px}.ctl p{color:var(--ink2);font-size:13.5px;margin-top:4px}
.ctl .btns{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.ctl .btns .btn{flex:1;height:46px}
.conf{margin-top:12px;padding:12px;border-radius:12px;background:var(--warn-bg);font-size:13.5px}
.mats{display:flex;align-items:center;gap:32px;padding:14px 24px;border-top:1px solid var(--line);flex-wrap:wrap}
.mat{display:flex;align-items:center;gap:10px}.mat .n{font-size:14px;font-weight:600}.mat .s{font-size:12.5px;color:var(--muted)}
.rodape{min-height:50px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:24px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.rodape a{color:var(--ink2);font-weight:500}.rodape .r{margin-left:auto;color:var(--muted)}
.aviso{margin:14px 24px 0;padding:12px 14px;border-radius:12px;background:#F3EEFF;color:#4b2fb0;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.hri svg,.head .btn svg{width:18px;height:18px}
.temps{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.temps .v{font-size:44px;font-weight:800;line-height:1.05;margin-top:6px}.temps .a{font-size:13px;color:var(--ink2);margin-top:4px}
.trava{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--ink2)}
.diag{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-weight:600;cursor:pointer}
.perfil-aviso{margin-top:6px;font-size:13px;color:var(--warn)}.perfil-aviso a{margin-left:6px}
/* Configuração (sem impressora) e galeria de unidades — pranchas DEV-01 e DEV-02 da Direção Visual C */
.pg{padding:28px 32px}.pg .topo{padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px}
.cfg{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:36px}
@media(max-width:1000px){.cfg{grid-template-columns:1fr}}
.cfg .cena2{background:#1C2024;border-radius:18px;min-height:460px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;color:#EDEAE6;font-size:21px}
.passos2 .p{padding:22px 0;border-bottom:1px solid var(--line)}.passos2 .p b{font-size:18px;display:block}.passos2 .p span{color:var(--ink2);font-size:14px;margin-top:6px;display:block}
.passos2 .btn{width:100%;height:46px;margin-top:28px}
.filtros{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.filtros .campo{margin:0;width:min(520px,100%)}
.chip{border:none;border-radius:20px;padding:8px 26px;background:#ECE9E4;color:var(--ink2);font-weight:700;font-size:13px}.chip.on{background:var(--rose);color:var(--magenta-deep)}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px}
.un{background:#F1EEEA;border-radius:18px;padding:22px 22px 24px;display:flex;flex-direction:column}
.un .ilu{display:flex;justify-content:center;margin-bottom:18px}
.un .n{font-size:24px;font-weight:800}.un .st{margin:12px 0 24px;font-size:14.5px;color:var(--ink2)}.un .st.ok{color:var(--good)}
.un .btn{margin-top:auto;justify-content:flex-start;height:46px;padding:0 18px}
.nota{margin-top:26px;color:var(--ink2);font-size:14px}
.voltar{display:inline-flex;align-items:center;gap:6px;color:var(--ink2);font-weight:600;font-size:13.5px;margin-bottom:8px;cursor:pointer}
/* Assistente de nova impressora (regra V2 §6): logos → modelos → complemento → LAN → card */
.marcas{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.marca{background:#F1EEEA;border-radius:18px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;border:2px solid transparent;min-height:150px;justify-content:center}
.marca:hover{border-color:var(--magenta-deep)}.marca img{max-width:150px;max-height:54px;object-fit:contain}.marca .nm{font-weight:800;font-size:17px}.marca .ct{font-size:12.5px;color:var(--ink2)}
.marca.off{opacity:.55;cursor:not-allowed}
.modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.modelo{background:#F1EEEA;border-radius:18px;padding:16px;cursor:pointer;border:2px solid transparent;display:flex;flex-direction:column;gap:10px}
.modelo:hover{border-color:var(--magenta-deep)}.modelo.off{opacity:.5;cursor:not-allowed}
.modelo .ft{height:150px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.modelo .ft img{max-width:100%;max-height:100%;object-fit:contain}
.modelo .nm{font-weight:800;font-size:16px}.modelo .ms{font-size:12.5px;color:var(--warn)}
.fotoGrande{width:min(420px,100%);height:280px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:0 auto}.fotoGrande img{max-width:100%;max-height:100%;object-fit:contain}
.caixa{background:#F1EEEA;border-radius:18px;padding:24px;max-width:720px;margin:0 auto}
.caixa h3{font-size:22px;font-weight:800}.caixa p{color:var(--ink2);font-size:14.5px;margin-top:8px}.caixa ul{margin:12px 0 0 18px;color:var(--ink2);font-size:14px}
.caixa .acoes{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap}.caixa .acoes .btn{height:46px;padding:0 22px}
.progresso{margin-top:18px}.progresso .bar{height:10px}.progresso .et{font-size:13.5px;color:var(--ink2);margin-top:8px}
.achadas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:18px}
.achada{background:#fff;border-radius:14px;padding:16px;border:2px solid transparent;cursor:pointer}.achada:hover{border-color:var(--magenta-deep)}
.achada .nm{font-weight:800}.achada .ip{font-size:13px;color:var(--ink2)}
.passosLan{margin-top:14px}.passosLan li{margin:8px 0 8px 18px;font-size:14.5px}
.spin{width:22px;height:22px;border:3px solid #ddd;border-top-color:var(--magenta-deep);border-radius:50%;animation:gira 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}
@keyframes gira{to{transform:rotate(360deg)}}
.ctlvivo .ctlon{font-size:12.5px;color:#1B7F4B;font-weight:600}.ctlvivo{margin:14px 0 4px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08)}.ctlvivo h4{margin:0 0 6px}.ctlvivo .lin{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}.ctlvivo label{min-width:138px;font-size:13px;color:#5e5752}.ctlvivo input,.ctlvivo select{width:78px;padding:6px 8px;border:1px solid rgba(0,0,0,.18);border-radius:8px;font:inherit;background:#fff}
.un .cores{display:flex;gap:6px;flex-wrap:wrap;margin:-12px 0 16px}.un .cores .dot{width:16px;height:16px;border:1px solid rgba(0,0,0,.15)}
.un .ft{height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:14px}.un .ft img{max-height:150px;max-width:100%;object-fit:contain}
.pillv{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;background:#E6E2DC;color:var(--ink2);margin-left:8px}.pillv.on{background:#DFF3E7;color:var(--good)}.pillv.imp{background:var(--rose);color:var(--magenta-deep)}
</style>
</head>
<body>
<div class="tela"><div class="app" id="app"><div class="carregando">Carregando…</div></div></div>
<script src="ponte.js"></script>
<script>
// Fluxo do Dispositivo: sem impressora → configuração (DEV-01); com impressoras → galeria de unidades (DEV-02);
// ao abrir uma unidade → a tela aprovada (02-dispositivo). As impressoras cadastradas neste computador aparecem
// mesmo sem internet; a leitura da Farm (estado, trabalho, slots) entra quando a conta está conectada.
var estado = { vista: "lista", filtro: "todas", busca: "", unidades: [], imps: [], bobinas: [], locais: [], sel: null, local: null, confirmar: null, vivas: [], assist: null };
var NOMES = { livre: "Livre", imprimindo: "Imprimindo", pausada: "Pausada", limpar_mesa: "Limpar a mesa", erro: "Com erro", offline: "Desconectada", falhou: "Falhou" };
var TONS = { livre: "ok", imprimindo: "rosa", limpar_mesa: "rosa", pausada: "alerta", erro: "alerta", falhou: "alerta" };
var E = Filuna.esc;

function carregar() {
	var pedidos = [
		Filuna.nativo("dispositivos.estado").then(function (e) { estado.vivas = (e.impressoras || []).map(function (v) { v.foto = v.foto || fotoDoModelo(v.modelo_nome || v.modelo); return v; }); }).catch(function () {}),
		Filuna.nativo("impressora.atual").then(function (r) { estado.local = r; }).catch(function () {}),
		Filuna.nativo("impressoras.registradas").then(function (r) { estado.locais = r.impressoras || []; }).catch(function () { estado.locais = []; })
	];
	if (Filuna.temToken()) pedidos.push(Promise.all([Filuna.api("GET", "/impressoras"), Filuna.api("GET", "/estoque").catch(function () { return { bobinas: [] }; })]).then(function (r) {
		estado.imps = r[0].impressoras || []; estado.bobinas = r[1].bobinas || []; estado.semLeitura = !!r[0]._offline; estado.erro = "";
	}, function (e) { if (e.status == 401) Filuna.sair(); estado.erro = e.erro; }));
	Promise.all(pedidos).then(function () { juntar(); aplicarPedido(); desenhar(); });
}

// Uma unidade por nome: cadastro deste computador e/ou impressora da Farm.
// Pedido de outra tela (Início › Farm › cartão da impressora): "unidade:<nome>" abre essa unidade.
function abrirPedido(secao) {
	if (!secao || secao.indexOf("unidade:") != 0) return;
	estado.pedido = secao.slice(8).trim().toLowerCase();
}
function aplicarPedido() {
	if (estado.pedido == null) return;
	var u = estado.unidades.filter(function (x) { return x.nome.trim().toLowerCase() == estado.pedido; })[0];
	estado.pedido = null;
	if (u) { estado.sel = u.id; estado.vista = "unidade"; }
}

function juntar() {
	var por = {}, lista = [];
	function chave(n) { return String(n || "").trim().toLowerCase(); }
	estado.imps.forEach(function (i) { var u = { id: "f:" + i.id, nome: i.nome, modelo: i.modelo || "", farm: i }; por[chave(i.nome)] = u; lista.push(u); });
	estado.locais.forEach(function (l) {
		var u = por[chave(l.nome)];
		if (u) { u.local = l; return; }
		lista.push({ id: "l:" + l.nome, nome: l.nome, modelo: (l.perfis && l.perfis[0]) || "", local: l });
	});
	// impressoras conectadas/cadastradas pelo assistente (banco local + rede ao vivo)
	estado.vivas.forEach(function (v) {
		var u = por[chave(v.nome)];
		if (u) { u.viva = v; u.foto = u.foto || v.foto; return; }
		var nu = { id: "v:" + (v.cadastro_id || v.dev_id), nome: v.nome, modelo: v.modelo_nome || v.modelo || "", viva: v, foto: v.foto };
		por[chave(v.nome)] = nu; lista.push(nu);
	});
	estado.unidades = lista;
}

function leitura(u) {
	var i = u.farm;
	if (!i || estado.semLeitura || i.estado == "offline") return { txt: i && i.estado == "offline" ? "Offline · última leitura expirada" : "Sem leitura · cadastrada neste computador", ok: false, livre: false };
	if (i.estado == "imprimindo" && i.trabalho) return { txt: "Imprimindo · " + Math.round((i.trabalho.progresso || 0) * (i.trabalho.progresso <= 1 ? 100 : 1)) + " %", ok: true, livre: false };
	if (i.estado == "livre") return { txt: "Pronta · leitura atual", ok: true, livre: true };
	return { txt: (NOMES[i.estado] || i.estado) + " · leitura atual", ok: true, livre: false };
}

function ilustracao(w) {
	return '<svg viewBox="0 0 260 216" width="' + w + '" style="stroke:none"><rect x="8" y="8" width="244" height="180" rx="20" fill="#353B43"/><rect x="26" y="22" width="208" height="134" rx="12" fill="#11161B"/>' +
		'<rect x="45" y="36" width="170" height="3" fill="#7E8791"/><rect x="128" y="38" width="3" height="30" fill="#7E8791"/><rect x="111" y="66" width="37" height="28" rx="5" fill="#A3ABB4"/>' +
		'<path d="M55 130 L185 118 L215 145 L80 158 Z" fill="#4A535C"/><path d="M118 108 l15-9 15 9v18l-15 9-15-9z M118 108l15 9 15-9 M133 117v18" fill="none" stroke="#E4769C" stroke-width="3" stroke-linejoin="round"/>' +
		'<rect x="40" y="160" width="180" height="7" rx="3" fill="#7E8791"/><circle cx="226" cy="170" r="3.5" fill="#1F8F5F"/><rect x="22" y="188" width="216" height="22" rx="10" fill="#1C2024"/></svg>';
}

function configurar(app) {
	app.innerHTML = '<div class="pg"><div class="topo"><div class="h1">Sua primeira impressora</div><div class="sub">Cadastre a impressora uma vez; ela fica salva neste computador e funciona sem internet.</div></div>' +
		'<div class="cfg"><div class="cena2">' + ilustracao(300) + '<div>Seu espaço de impressão começa aqui</div></div><div class="passos2">' +
		'<div class="p"><b>Identificar</b><span>Descobrir a impressora na rede local ou informar o endereço autorizado.</span></div>' +
		'<div class="p"><b>Cadastrar</b><span>Associar a unidade, o modelo e o perfil, sem confundir cadastro com conexão.</span></div>' +
		'<div class="p"><b>Parear</b><span>Acesso local do titular; a autorização de comandos é separada.</span></div>' +
		'<div class="p"><b>Verificar</b><span>As capacidades são observadas antes de liberar comandos.</span></div>' +
		'<button class="btn primario" id="adicionar">+ Conectar nova impressora</button></div></div></div>';
	app.querySelector("#adicionar").onclick = abrirAssistente;
}

function galeria(app) {
	var f = estado.filtro, q = estado.busca.toLowerCase();
	var vis = estado.unidades.filter(function (u) {
		var l = leitura(u);
		if (f == "disp" && !l.livre) return false;
		if (f == "sem" && l.ok) return false;
		return !q || (u.nome + " " + u.modelo).toLowerCase().indexOf(q) >= 0;
	});
	app.innerHTML = '<div class="pg"><div class="topo entre"><div><div class="h1">Lista de unidades</div><div class="sub">' + estado.unidades.length +
		(estado.unidades.length == 1 ? " impressora cadastrada" : " impressoras cadastradas") + (estado.semLeitura ? " · sem conexão, mostrando o último estado guardado" : "") + '</div></div>' +
		'<button class="btn primario" id="adicionar">+ Conectar nova impressora</button></div>' +
		'<div class="filtros"><div class="campo"><label>Buscar unidade</label><input type="text" id="busca" placeholder="Nome, modelo ou identificador" value="' + E(estado.busca) + '"></div>' +
		[["todas", "Todas"], ["disp", "Disponíveis"], ["sem", "Sem conexão"]].map(function (c) { return '<button class="chip' + (c[0] == f ? " on" : "") + '" data-f="' + c[0] + '">' + c[1] + "</button>"; }).join("") + "</div>" +
		(vis.length ? '<div class="galeria">' + vis.map(function (u, k) {
			var l = leitura(u), v = viva(u);
			var st = v ? (v.estado == "imprimindo" ? "Imprimindo · " + (v.progresso || 0) + "%" + (v.restante_s ? " · " + Filuna.tempo(v.restante_s) + " restante" : "")
				: v.estado == "pausada" ? "Pausada" : v.estado == "concluida" ? "Concluída · retire a peça" : v.ligada ? "Ligada · livre" : "Desligada ou fora da rede") : l.txt;
			var pill = v ? '<span class="pillv' + (v.estado == "imprimindo" ? " imp" : v.ligada ? " on" : "") + '">' + (v.ligada ? (v.estado == "imprimindo" ? "imprimindo" : "ligada") : "desligada") + "</span>" : "";
			var cores = v && v.cores && v.cores.length ? '<div class="cores">' + v.cores.map(function (c) { return '<span class="dot" title="' + E((c.material || "") + " " + (c.unidade || "") + "/" + (c.slot || "")) + '" style="background:' + corCss(c.cor) + '"></span>'; }).join("") + "</div>" : "";
			var foto = u.foto ? '<div class="ft"><img src="' + E(u.foto) + '" alt=""></div>' : '<div class="ilu">' + ilustracao(240) + '</div>';
			return '<div class="un">' + foto + '<div class="n">' + E(u.nome) + pill + '</div><div class="st' + (v && v.ligada ? " ok" : l.ok ? " ok" : "") + '">' + E(st) + "</div>" + cores +
				'<button class="btn' + (k == 0 ? " primario" : "") + '" data-u="' + E(u.id) + '">› &nbsp;Abrir unidade</button></div>';
		}).join("") + "</div>" : '<div class="vazio">Nenhuma unidade neste filtro.</div>') +
		'<div class="nota">Cadastro não é presença. Estado desconhecido não é apresentado como online.</div>' + (estado.erro ? '<div class="erro">' + E(estado.erro) + "</div>" : "") + "</div>";
	app.querySelector("#adicionar").onclick = abrirAssistente;
	var b = app.querySelector("#busca"); b.oninput = function () { estado.busca = b.value; var pos = b.selectionStart; galeria(app); var nb = app.querySelector("#busca"); nb.focus(); nb.setSelectionRange(pos, pos); };

function desenhar() {
	var app = document.getElementById("app");
	if (estado.vista == "assistente") { assistente(app); return; }
	if (!estado.unidades.length) { estado.vista = "lista"; configurar(app); return; }
	var u = estado.unidades.filter(function (x) { return x.id == estado.sel; })[0];
	if (estado.vista != "unidade" || !u) { estado.vista = "lista"; galeria(app); return; }
	unidade(app, u);
}

// O perfil da Preparação é desta impressora? Compara o modelo da impressora com o modelo do perfil (sem acentos e espaços).
// Último comando enviado a cada impressora (marca o que está ligado). Fica só neste computador.
function lerCtl() { try { return JSON.parse(localStorage.getItem("fl.ctl") || "{}") || {}; } catch (e) { return {}; } }
function guardarCtl(o) { try { localStorage.setItem("fl.ctl", JSON.stringify(o)); } catch (e) {} }
// O programa entrega a cor como "RRGGBBAA" (sem #): vira cor de tela.
function corCss(c) { c = String(c || "").replace(/^#/, ""); return /^[0-9a-fA-F]{6,8}$/.test(c) ? "#" + c.slice(0, 6) : "#eeeeee"; }
function mesmoModelo(a, b) {
	var n = function (x) { return String(x || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, ""); };
	a = n(a); b = n(b);
	return !a || !b || a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}

function cabecalho(nome, est, modelo, local) {
	var perfil = local.impressora || "", confere = mesmoModelo(modelo, local.modelo || perfil);
	var ic = function (d) { return '<svg viewBox="0 0 24 24">' + d + "</svg>"; };
	return '<div class="head"><div><div class="lbl">Dispositivo local</div><div class="h1">' + E(nome) +
		(est ? ' <span class="pill ' + (TONS[est] || "") + '">' + E(NOMES[est] || est) + "</span>" : "") + "</div>" +
		'<div class="sub">' + E(modelo) + (perfil ? " · Perfil " + E(perfil) : "") + "</div>" +
		(perfil && modelo && !confere ? '<div class="perfil-aviso">O perfil na Preparação não é desta impressora.<a data-aba="prepare">Escolher o perfil certo</a></div>' : "") + "</div>" +
		'<div class="hr"><span class="hri">' + ic('<path d="M3.5 9.5a12 12 0 0 1 17 0M6.5 12.5a7.5 7.5 0 0 1 11 0M9.5 15.5a3 3 0 0 1 5 0"/><circle cx="12" cy="18.5" r=".8"/>') + "LAN local</span>" +
		'<span class="hri">' + ic('<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>') + (Filuna.temToken() ? "Sessão do titular" : "Sem conta Filuna") + "</span>" +
		'<button class="btn" data-aba="monitor">' + ic('<path d="M12 3.5 19 6v5.5c0 4.2-3 7.6-7 9-4-1.4-7-4.8-7-9V6z"/><path d="m9 12 2 2 4-4"/>') + "Capacidades e saúde</button>" +
		'<button class="btn" data-aba="prepare">Revisar envio</button><button class="btn" data-aba="monitor">Configurar unidade</button></div></div>';
}

function materiais(i) {
	var slots = (i.slots || []).filter(function (x) { return x.material || x.cor; });
	if (slots.length) return slots.map(function (x) {
		return '<div class="mat"><span class="dot" style="width:18px;height:18px;background:' + E(x.cor || "#ccc") + '"></span><div><div class="n">' + E((x.material || "") + (x.cor_nome ? " · " + x.cor_nome : "")) +
			'</div><div class="s">Slot ' + E(x.posicao) + (x.bobina_restante_g != null ? " · restam " + Filuna.gramas(x.bobina_restante_g) : "") + "</div></div></div>";
	}).join("") + (i.mesa && i.mesa.w ? '<div class="mat"><div><div class="n">Mesa</div><div class="s">' + E(i.mesa.w + " × " + i.mesa.d + " mm") + "</div></div></div>" : "");
	var b = estado.bobinas.filter(function (x) { return x.na_impressora && x.na_impressora == i.nome; });
	if (!b.length) return '<span class="ajuda">Nenhuma bobina associada a esta impressora no estoque.</span>';
	return b.map(function (x) {
		return '<div class="mat"><span class="dot" style="width:16px;height:16px;background:' + E(x.cor) + '"></span><div><div class="n">' + E(x.material + " · " + x.cor_nome) +
			'</div><div class="s">Bobina nº ' + E(x.numero) + " · restam " + Filuna.gramas(x.restante_g) + (x.insuficiente ? " · <b style='color:var(--warn)'>não basta para a fila</b>" : "") + "</div></div></div>";
	}).join("");
}


// ---------- Estado ao vivo (cards) ----------
function viva(u) { return u.viva || null; }
Filuna.ouvir("dispositivos.estado", function (e) {
	estado.vivas = (e.impressoras || []).map(function (v) { v.foto = v.foto || fotoDoModelo(v.modelo_nome || v.modelo); return v; });
	juntar();
	if (estado.vista == "lista" && !estado.confirmar && document.activeElement.id != "busca") desenhar();

});
var fotos = {};
function fotoDoModelo(nome) { if (!nome) return ""; var k = Object.keys(fotos).filter(function (n) { return nome.indexOf(n) == 0 || n.indexOf(nome) == 0; })[0]; return k ? fotos[k] : ""; }

// ---------- Assistente: conectar nova impressora ----------
function abrirAssistente() { estado.assist = { passo: "marcas", marcas: [], marca: null, modelos: [], modelo: null, comp: null, prog: null, achadas: [], tentativas: 0, erro: "", ip: "", codigo: "", nome: "" }; estado.vista = "assistente"; desenhar(); }
function assistente(app) {
	var a = estado.assist, html = '<div class="pg"><div class="topo"><a class="voltar" id="voltarA">‹ ' + (a.passo == "marcas" ? "Impressoras" : "Voltar") + '</a>';

		if (!a.marcas.length) { html += '<div class="carregando"><span class="spin"></span>Lendo o catálogo…</div>'; Filuna.nativo("dispositivos.fabricantes").then(function (r) { a.marcas = r.fabricantes || []; a.conta = r.conta; desenhar(); }).catch(function (e) { a.erro = e.message; desenhar(); }); }
		else if (!a.marcas.length) html += '<div class="vazio">Nenhum fabricante no catálogo desta conta.</div>';
		else html += '<div class="marcas">' + a.marcas.map(function (m) {
			return '<div class="marca' + (m.modelos_disponiveis ? "" : " off") + '" data-m="' + E(m.id) + '"><img src="' + E(m.logo) + '" alt="" onerror="this.style.display=\'none\'"><div class="nm">' + E(m.nome) + '</div><div class="ct">' + m.modelos_disponiveis + ' modelo(s) homologado(s)' + (m.modo_motor == "ORCA_NATIVO" ? " · motor Orca" : "") + '</div></div>';
		}).join("") + "</div>" + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "");
	} else if (a.passo == "modelos") {
		html += '<div class="h1">' + E(a.marca.nome) + '</div><div class="sub">Modelos homologados internamente pelo Filuna. Os demais aparecem como não disponíveis.</div></div>';
		if (!a.modelos.length) { html += '<div class="carregando"><span class="spin"></span>Carregando modelos…</div>'; Filuna.nativo("dispositivos.modelos", { fabricante: a.marca.id }).then(function (r) { a.modelos = r.modelos || []; a.modelos.forEach(function (m) { if (m.foto) fotos[m.nome] = m.foto; }); desenhar(); }).catch(function (e) { a.erro = e.message; desenhar(); }); }
		else html += '<div class="modelos">' + a.modelos.map(function (m) {
			return '<div class="modelo' + (m.disponivel ? "" : " off") + '" data-md="' + E(m.nome) + '"><div class="ft">' + (m.foto ? '<img src="' + E(m.foto) + '" alt="">' : ilustracao(160)) + '</div><div class="nm">' + E(m.nome) + '</div>' + (m.disponivel ? '<div class="ct" style="font-size:12.5px;color:var(--ink2)">Bicos: ' + E((m.bicos || []).join(", ")) + '</div>' : '<div class="ms">' + E(m.mensagem) + '</div>') + '</div>';
		}).join("") + "</div>" + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "");
	} else if (a.passo == "complemento") {
		var c = a.comp, mb = c ? (c.bytes / 1048576).toFixed(1) : "";
		html += '<div class="h1">' + E(a.modelo.nome) + '</div></div><div class="fotoGrande">' + (a.modelo.foto ? '<img src="' + E(a.modelo.foto) + '" alt="">' : ilustracao(260)) + '</div>';
		if (!c) { html += '<div class="carregando"><span class="spin"></span>Verificando o complemento…</div>'; Filuna.nativo("dispositivos.complemento", { fabricante: a.marca.id }).then(function (r) { a.comp = r; if (r.instalado) { a.passo = "procurar"; preparar(); } desenhar(); }).catch(function (e) { a.erro = e.message; desenhar(); }); }
		else if (a.prog) {
			html += '<div class="caixa"><h3><span class="spin"></span>Baixando complemento ' + E(a.marca.nome) + '</h3><p>Não feche o Filuna. Estamos atualizando a base para a sua impressora.</p>' +
				'<div class="progresso"><div class="bar"><i style="width:' + Math.round(100 * (a.prog.feito || 0) / Math.max(1, a.prog.total || 1)) + '%"></i></div><div class="et">' + E(a.prog.etapa || "") + '</div></div>' + (a.erro ? '<div class="erro">' + E(a.erro) + '</div><div class="acoes"><button class="btn" id="denovo">Tentar de novo</button></div>' : "") + "</div>";
		} else {
			html += '<div class="caixa" style="margin-top:22px"><h3>Baixar complemento</h3><p>Para a <b>' + E(a.modelo.nome) + '</b>, o Filuna precisa do complemento <b>' + E(a.marca.nome) + ' ' + E(c.versao || "") + '</b>' + (mb ? ' (' + mb + ' MB)' : '') + '. Depois disso o Filuna passa a ser nativo nesta impressora.</p>' +
				'<ul>' + (c.libera || []).map(function (x) { return "<li>" + E(x) + "</li>"; }).join("") + '</ul>' +
				'<div class="acoes"><button class="btn primario" id="baixar">Baixar e liberar</button><button class="btn" id="depois">Agora não</button></div>' + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "") + "</div>";
		}
	} else if (a.passo == "procurar") {
		html += '<div class="h1">' + E(a.modelo.nome) + '</div><div class="sub">' + (a.achadas.length ? "Escolha a sua impressora." : "Procurando na sua rede local…") + '</div></div>';
		html += '<div class="caixa"><h3>' + (a.achadas.length ? "Impressoras encontradas" : '<span class="spin"></span>Verificando a rede LAN') + '</h3><p>A impressora precisa estar ligada, na mesma rede e com o modo LAN ativo.</p>' +
			(a.achadas.length ? '<div class="achadas">' + a.achadas.map(function (d) { return '<div class="achada" data-d="' + E(d.dev_id) + '"><div class="nm">' + E(d.nome) + '</div><div class="ip">' + E((d.modelo_nome || d.modelo || "") + " · " + d.ip) + (d.precisa_codigo && a.marca && a.marca.id == "bambu" ? " · pede código de acesso" : "") + '</div></div>'; }).join("") + "</div>" : "") +
			(a.pedirCodigo ? '<div class="campo" style="margin-top:14px"><label>Código de acesso (está na tela da impressora)</label><input type="text" id="codigo" value="' + E(a.codigo) + '"></div><div class="acoes"><button class="btn primario" id="conectarCod">Conectar</button></div>' : "") +
			'<div class="acoes">' + (a.tentativas >= 8 || a.achadas.length ? '<button class="btn" id="outros">Não achei · outros meios</button>' : "") + '<button class="btn" id="procurar">Procurar de novo</button></div>' + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "") + "</div>";
	} else if (a.passo == "ip") {
		html += '<div class="h1">Outros meios de conexão</div><div class="sub">Se a busca automática não achou, informe o endereço da impressora.</div></div>';
		html += '<div class="caixa"><h3>Conectar pelo endereço IP</h3><p>O IP aparece na tela da impressora em Configurações › Rede.</p>' +
			'<div class="campo" style="margin-top:14px"><label>Endereço IP</label><input type="text" id="ip" placeholder="192.168.0.50" value="' + E(a.ip) + '"></div>' +
			'<div class="campo"><label>Código de acesso (se a impressora mostrar um)</label><input type="text" id="codigo" value="' + E(a.codigo) + '"></div>' +
			'<div class="campo"><label>Nome da impressora no Filuna</label><input type="text" id="nome" placeholder="' + E(a.modelo.nome) + '" value="' + E(a.nome) + '"></div>' +
			'<div class="acoes"><button class="btn primario" id="conectarIp">Conectar</button><button class="btn" id="ponte">Não conecta · me ensine a ligar o modo LAN</button></div>' + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "") + "</div>";
	} else if (a.passo == "ponte") {
		var pt = a.ponte || { titulo: "", passos: [] };
		html += '<div class="h1">Ponte pela rede LAN</div><div class="sub">Passo a passo na sua ' + E(a.modelo.nome) + '.</div></div>';
		html += '<div class="caixa"><h3>' + E(pt.titulo) + '</h3><ol class="passosLan">' + (pt.passos || []).map(function (x) { return "<li>" + E(x) + "</li>"; }).join("") + '</ol>' + (pt.nota ? '<p>' + E(pt.nota) + '</p>' : "") +
			'<div class="acoes"><button class="btn primario" id="procurarP">Pronto, procurar de novo</button><button class="btn" id="irIp">Informar o IP</button></div></div>';
	} else if (a.passo == "pronto") {
		var v = a.conectada || {};
		html += '<div class="h1">' + E(v.nome || a.modelo.nome) + ' conectada</div><div class="sub">O Filuna agora é nativo nesta impressora. Ela já aparece em Preparar.</div></div>';
		html += '<div class="fotoGrande">' + (a.modelo.foto ? '<img src="' + E(a.modelo.foto) + '" alt="">' : ilustracao(260)) + '</div><div class="caixa" style="margin-top:22px"><h3>Tudo liberado</h3><ul><li>Rede: ' + E(v.ip || "") + '</li><li>Estado: ' + E(v.estado || "") + '</li><li>Cores: ' + ((v.cores || []).length || "sem sistema de cores detectado") + '</li><li>Câmera: ' + (v.camera ? "disponível" : "não detectada") + '</li></ul>' +
			'<div class="acoes"><button class="btn primario" id="fim">Ir para as impressoras</button><button class="btn" data-aba="prepare">Abrir Preparar</button></div></div>';
	}
	html += "</div>";
	app.innerHTML = html;
	app.querySelector("#voltarA").onclick = function () {
		if (a.passo == "marcas") { estado.vista = "lista"; desenhar(); return; }
		a.erro = "";
		a.passo = a.passo == "modelos" ? "marcas" : a.passo == "complemento" ? "modelos" : a.passo == "procurar" ? (a.comp && a.comp.instalado ? "modelos" : "complemento") : a.passo == "ip" ? "procurar" : a.passo == "ponte" ? "ip" : "marcas";
		if (a.passo == "complemento") a.prog = null;
		desenhar();
	};
	app.querySelectorAll("[data-m]").forEach(function (x) { x.onclick = function () { var m = a.marcas.filter(function (y) { return y.id == x.dataset.m; })[0]; if (!m || !m.modelos_disponiveis) return; a.marca = m; a.modelos = []; a.erro = ""; a.passo = "modelos"; desenhar(); }; });
	app.querySelectorAll("[data-md]").forEach(function (x) { x.onclick = function () { var m = a.modelos.filter(function (y) { return y.nome == x.dataset.md; })[0]; if (!m) return; if (!m.disponivel) { a.erro = m.mensagem; desenhar(); return; } a.modelo = m; a.comp = null; a.prog = null; a.erro = ""; a.passo = "complemento"; desenhar(); }; });
	var b;
	if ((b = app.querySelector("#baixar"))) b.onclick = function () { a.erro = ""; a.prog = { etapa: "Iniciando…", feito: 0, total: 1 }; desenhar(); Filuna.nativo("dispositivos.complemento.baixar", { fabricante: a.marca.id }).catch(function (e) { a.erro = e.message; desenhar(); }); };
	if ((b = app.querySelector("#denovo"))) b.onclick = function () { a.prog = null; a.erro = ""; desenhar(); };
	if ((b = app.querySelector("#depois"))) b.onclick = function () { estado.vista = "lista"; desenhar(); };
	if ((b = app.querySelector("#procurar"))) b.onclick = function () { a.erro = ""; a.tentativas = 0; preparar(); desenhar(); };
	if ((b = app.querySelector("#procurarP"))) b.onclick = function () { a.erro = ""; a.tentativas = 0; a.passo = "procurar"; preparar(); desenhar(); };
	if ((b = app.querySelector("#outros"))) b.onclick = function () { a.passo = "ip"; a.erro = ""; desenhar(); };
	if ((b = app.querySelector("#irIp"))) b.onclick = function () { a.passo = "ip"; a.erro = ""; desenhar(); };
	if ((b = app.querySelector("#ponte"))) b.onclick = function () { Filuna.nativo("dispositivos.ponte", { fabricante: a.marca.id }).then(function (r) { a.ponte = r; a.passo = "ponte"; desenhar(); }); };
	if ((b = app.querySelector("#conectarIp"))) b.onclick = function () {
		a.ip = app.querySelector("#ip").value.trim(); a.codigo = app.querySelector("#codigo").value.trim(); a.nome = app.querySelector("#nome").value.trim(); a.erro = "";
		Filuna.nativo("dispositivos.conectar_ip", { fabricante: a.marca.id, modelo: a.modelo.nome, ip: a.ip, codigo: a.codigo, nome: a.nome }).then(function (r) { if (r.erro) { a.erro = r.erro; desenhar(); return; } concluir(r.impressora); }).catch(function (e) { a.erro = e.message; desenhar(); });
	};
	app.querySelectorAll("[data-d]").forEach(function (x) { x.onclick = function () {
		var d = a.achadas.filter(function (y) { return y.dev_id == x.dataset.d; })[0]; if (!d) return;
		a.escolhida = d; a.erro = "";
		// Só a Bambu exige código antes de conectar. Elegoo, Creality e as demais conectam direto, como no fatiador
		// oficial; o código só é pedido se a impressora recusar (quem definiu um PIN nela).
		if (d.precisa_codigo && !a.codigo && a.marca && a.marca.id == "bambu") { a.pedirCodigo = true; desenhar(); return; }
		conectar(d.dev_id, a.codigo || codigoPadrao(a));
	}; });
	if ((b = app.querySelector("#conectarCod"))) b.onclick = function () { a.codigo = app.querySelector("#codigo").value.trim(); if (a.escolhida) conectar(a.escolhida.dev_id, a.codigo); };
	if ((b = app.querySelector("#fim"))) b.onclick = function () { estado.vista = "lista"; estado.assist = null; carregar(); };
	ligarComuns(app);

	function preparar() {
		a.achadas = []; a.pedirCodigo = false;
		Filuna.nativo("dispositivos.preparar", { fabricante: a.marca.id, modelo: a.modelo.nome }).then(function (r) {
			if (r.erro) { a.erro = r.erro; desenhar(); return; }
			a.perfil = r.perfil; a.agente = r.agente || ""; procurarCiclo();
		}).catch(function (e) { a.erro = e.message; desenhar(); });
	}
	function procurarCiclo() {
		if (estado.vista != "assistente" || a.passo != "procurar") return;
		daMarca(a).then(function (r) {
			var achadas = (r.impressoras || []);
			if (achadas.length) { a.achadas = achadas; desenhar(); return; }
			a.tentativas++;
			if (a.tentativas == 8) { semImpressoraNaRede(a, r); desenhar(); } // ~16 s sem resposta: oferece outros meios, mas segue procurando
			if (a.tentativas < 90) setTimeout(procurarCiclo, a.tentativas < 8 ? 2000 : 3000);
		}).catch(function (e) { a.erro = e.message; desenhar(); });
	}
	function conectar(devId, codigo) {
		a.erro = "";
		Filuna.nativo("dispositivos.conectar", { dev_id: devId, codigo: codigo || "" }).then(function (r) { if (r.erro) { a.erro = r.erro; a.pedirCodigo = true; desenhar(); return; } concluir(r.impressora); }).catch(function (e) { a.erro = e.message; desenhar(); });
	}
	function concluir(imp) {
		imp = imp || {};
		var nome = a.nome || imp.nome || a.modelo.nome;
		Filuna.nativo("dispositivos.registrar", { nome: nome, fabricante: a.marca.id, modelo: a.modelo.nome, dev_id: imp.dev_id || "" }).then(function () {
			imp.nome = nome; a.conectada = imp; a.passo = "pronto"; desenhar();
		}).catch(function (e) { a.erro = e.message; desenhar(); });
	}
}
Filuna.ouvir("complemento.progresso", function (p) {
	var a = estado.assist; if (!a || estado.vista != "assistente" || a.passo != "complemento") return;
	if (p.ok) { a.prog = null; a.comp = a.comp || {}; a.comp.instalado = true; a.passo = "procurar"; desenhar(); Filuna.nativo("dispositivos.preparar", { fabricante: a.marca.id, modelo: a.modelo.nome }).then(function (r) { if (r.erro) { a.erro = r.erro; desenhar(); return; } a.perfil = r.perfil; a.agente = r.agente || ""; a.tentativas = 0; desenhar(); pollDescobertas(); }); return; }
	if (p.erro) { a.erro = p.erro; a.prog = a.prog || {}; desenhar(); return; }
	a.prog = p; desenhar();
});
// Código que a própria marca usa quando o dono não definiu um: a Elegoo sai de fábrica com 123456 e o fatiador
// oficial conecta sem perguntar. Sem um código o programa nem tenta a conexão (trata a impressora como sem acesso).
function codigoPadrao(a) { var m = a && a.marca && a.marca.id; return m == "elegoo" ? "123456" : m == "anycubic" ? "lan" : ""; }
// Impressoras achadas na rede que são da marca escolhida no assistente. A lista da rede do programa guarda as
// achadas de outras marcas (ex.: a Elegoo de antes aparecia ao conectar uma Anycubic); o estado dá o agente de cada uma.
function daMarca(a) {
	return Promise.all([Filuna.nativo("dispositivos.descobertas"), Filuna.nativo("dispositivos.estado").catch(function () { return {}; })]).then(function (v) {
		var r = v[0] || {}, ag = {};
		((v[1] || {}).impressoras || []).forEach(function (i) { if (i.dev_id) ag[i.dev_id] = i.agente || ""; });
		if (a && a.agente) r.impressoras = (r.impressoras || []).filter(function (d) { return !ag[d.dev_id] || ag[d.dev_id] == a.agente; });
		return r;
	});
}
// Diagnóstico: a busca na rede terminou sem achar a impressora — vai para o servidor com marca, modelo e agente.
function semImpressoraNaRede(a, r) {
	Filuna.nativo("diagnostico.enviar", { etapa: "dispositivos.procurar", mensagem: "Busca na rede local terminou sem achar a impressora",
		contexto: { fabricante: a.marca && a.marca.id, modelo: a.modelo && a.modelo.nome, perfil: a.perfil || "", agente: (r && r.agente) || "" } }).catch(function () {});
}
function pollDescobertas() {
	var a = estado.assist; if (!a || estado.vista != "assistente" || a.passo != "procurar") return;
	daMarca(a).then(function (r) {
		var achadas = r.impressoras || [];
		if (achadas.length) { a.achadas = achadas; desenhar(); return; }
		a.tentativas++;
		if (a.tentativas == 8) { semImpressoraNaRede(a, r); desenhar(); }
		if (a.tentativas < 90) setTimeout(pollDescobertas, a.tentativas < 8 ? 2000 : 3000);
	}).catch(function () {});
}

function rodape() {
	return '<div class="rodape"><a style="color:var(--magenta-deep);font-weight:700" id="unidades">Impressoras</a><a data-aba="filuna.espaco" data-secao="estoque">Filamentos</a><a data-aba="filuna.espaco" data-secao="fila">Fila e histórico</a>' +
		'<span class="r">Envio, fila e agenda não iniciam impressão.</span></div>';
}

function ligarComuns(app) {
	var un = app.querySelector("#unidades"); if (un) un.onclick = function () { estado.vista = "lista"; desenhar(); };
	app.querySelectorAll("[data-aba]").forEach(function (b) { b.onclick = function () { Filuna.nativo("aba.abrir", { aba: b.dataset.aba, secao: b.dataset.secao || "" }); }; });
}

function camera(iid) {
	Filuna.nativo("config.ler", { chave: "filuna_token" }).then(function (r) {
		return fetch("https://filuna3d.com/api/slicer/v1/impressoras/" + encodeURIComponent(iid) + "/camera.jpg?" + Date.now(), { headers: { Authorization: "Bearer " + r.valor } });
	}).then(function (r) { return r.ok ? r.blob() : null; }).then(function (b) {
		var img = document.getElementById("cam"); if (b && img) img.src = URL.createObjectURL(b);
	}).catch(function () {});
}

Filuna.ouvir("mostrar", function () { Filuna.nativo("dispositivos.observar", { ligado: true }).catch(function () {}); carregar(); });
Filuna.ouvir("impressoras", carregar);   // cadastrada agora em "Adicionar impressora"
Filuna.ouvir("secao", function (d) { Filuna.nativo("secao.pendente").catch(function () {}); abrirPedido(d.secao); carregar(); });
Filuna.iniciar().then(function () { return Filuna.nativo("secao.pendente").then(function (r) { abrirPedido(r.secao); }).catch(function () {}); }).then(carregar);
setInterval(function () { if (!document.hidden && !estado.confirmar && document.activeElement.id != "busca") carregar(); }, 15000);
</script>
