.mesaia{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:10px 14px;border-radius:12px;background:#FFF8F0;font-size:13.5px;color:#5e5752}.mesaia.ok{background:#E3F5EC;color:#1F8F5F}.mesaia.ocupada{background:#FDE8DF;color:#D9480F;font-weight:600}.mesaia.erro{color:#8a817a}
.arqs{margin-top:14px}.arq{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:13px}.arq .an{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arq .ai{color:#8a817a;white-space:nowrap}
.fils{margin:16px 0 4px;padding-top:14px;border-top:1px solid rgba(0,0,0,.08)}.filrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}.fil{width:72px;text-align:center}.fil .bola{display:block;width:46px;height:46px;border-radius:50%;margin:0 auto 8px;border:1px solid rgba(0,0,0,.16);box-shadow:inset 0 -6px 10px rgba(0,0,0,.12)}.fil .bola.vazia{border:1.5px dashed rgba(0,0,0,.28);box-shadow:none}.fil .fn{font-weight:700;font-size:13.5px}.fil .fe{font-size:11.5px;color:#8a817a;margin-top:1px}.fil .fa{display:flex;gap:6px;justify-content:center;margin-top:8px}.fil .fa button{width:30px;height:30px;border-radius:50%;border:1px solid rgba(0,0,0,.16);background:#fff;color:#5e5752;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}.fil .fa button:hover{background:#FFE8F2;border-color:#B3125C;color:#B3125C}

<body>
<div class="tela"><div class="app" id="app"><div class="carregando">Carregando…</div></div></div>
<script src="ponte.js"></script>
<script src="mpegts.js"></script>
<script src="camera-conta.js"></script>
<script src="casa-plugins.js"></script>
<script src="casa.js"></script>
<script src="diagnostico.js"></script>
<script src="raiox.js"></script>
<script>
// Fluxo do Dispositivo: sem impressora → configuração (DEV-01); com impressoras → galeria de unidades (DEV-02);
// ao abrir uma unidade → a tela aprovada (02-dispositivo). As impressoras cadastradas neste computador aparecem
// mesmo sem internet; a leitura da Farm (estado, trabalho, slots) entra quando a conta está conectada.
var estado = { vista: "lista", filtro: "todas", busca: "", unidades: [], imps: [], bobinas: [], locais: [], sel: null, local: null, confirmar: null, vivas: [], assist: null, cat: catSalva() };
var NOMES = { livre: "Livre", imprimindo: "Imprimindo", pausada: "Pausada", limpar_mesa: "Limpar a mesa", erro: "Com erro", offline: "Desconectada", falhou: "Falhou" };
var TONS = { livre: "ok", imprimindo: "rosa", limpar_mesa: "rosa", pausada: "alerta", erro: "alerta", falhou: "alerta" };
var E = Filuna.esc;

// Excluir impressora (pedido do dono, 21/11/2026): sai deste computador (rede, vínculo e cadastro) e da conta (site e app).
function excluirUnidade(u) {
	var nome = u.nome || "esta impressora";
	if (u.farm && u.farm.estado == "imprimindo") { estado.msg = "A impressora está imprimindo. Espere terminar ou cancele a impressão antes de excluir."; desenhar(); return; }
	if (!confirm("Excluir " + nome + " do Filuna?\n\nEla sai deste computador, do site e do app. A impressora em si não é apagada: para usar de novo, é só adicionar outra vez.")) return;
	var v = u.viva || {}, passos = [];
	if (v.dev_id || v.cadastro_id) passos.push(Filuna.nativo("dispositivos.excluir", { dev_id: v.dev_id || "", cadastro_id: v.cadastro_id || "" }));
	if (u.farm && u.farm.id && Filuna.temToken()) passos.push(Filuna.api("POST", "/impressoras/" + encodeURIComponent(u.farm.id) + "/excluir", {}));
	Promise.all(passos).then(function (r) {
		var erro = r.filter(function (x) { return x && x.erro; })[0];
		if (erro) { estado.msg = erro.erro; desenhar(); return; }
		estado.msg = nome + " foi excluída."; estado.sel = null; estado.vista = "lista"; carregar();
	}, function (e) { estado.msg = (e && (e.erro || e.message)) || "Não deu para excluir agora."; desenhar(); });
}

function carregar() {
	carregarFotos();
	var pedidos = [
		Filuna.nativo("dispositivos.estado").then(function (e) { estado.vivas = (e.impressoras || []).map(fotoViva); }).catch(function () {}),
		Filuna.nativo("impressora.atual").then(function (r) { estado.local = r; }).catch(function () {}),
		Filuna.nativo("impressoras.registradas").then(function (r) { estado.locais = r.impressoras || []; }).catch(function () { estado.locais = []; })
	];
	if (Filuna.temToken()) pedidos.push(Promise.all([Filuna.api("GET", "/impressoras"), Filuna.api("GET", "/estoque").catch(function () { return { bobinas: [] }; })]).then(function (r) {
		estado.imps = r[0].impressoras || []; estado.bobinas = r[1].bobinas || []; estado.semLeitura = !!r[0]._offline; estado.erro = "";
	}, function (e) { if (e.status == 401) Filuna.sair(); estado.erro = e.erro; }));
	Promise.all(pedidos).then(function () { juntar(); aplicarPedido(); desenhar(); });
}

// Uma unidade por nome: cadastro deste computador e/ou impressora da Farm.
// Pedido de outra tela (Início › Farm › cartão da impressora): "unidade:<nome>" abre essa unidade.
// "raiox:<nome>" (Meu espaço › Impressoras) abre direto o Raio X dela.
function abrirPedido(secao) {
	var m = /^(unidade|raiox):(.*)$/.exec(secao || "");
	if (!m) return;
	estado.pedido = m[2].trim().toLowerCase();
	estado.pedidoRaioX = m[1] == "raiox";
}
function aplicarPedido() {
	if (estado.pedido == null) return;
	var u = estado.unidades.filter(function (x) { return x.nome.trim().toLowerCase() == estado.pedido; })[0];
	estado.pedido = null;
	if (u) { estado.sel = u.id; estado.vista = estado.pedidoRaioX ? "raiox" : "unidade"; if (estado.pedidoRaioX) RaioX.recarregar(); }
	estado.pedidoRaioX = false;
}

function juntar() {
	var por = {}, lista = [];
	function chave(n) { return String(n || "").trim().toLowerCase(); }
	estado.imps.forEach(function (i) { var u = { id: "f:" + i.id, nome: i.nome, modelo: i.modelo || "", farm: i }; por[chave(i.nome)] = u; lista.push(u); });
	estado.locais.forEach(function (l) {
		var u = por[chave(l.nome)];
		if (u) { u.local = l; return; }
		lista.push({ id: "l:" + l.nome, nome: l.nome, modelo: (l.perfis && l.perfis[0]) || "", local: l });
	});
	// impressoras conectadas/cadastradas pelo assistente (banco local + rede ao vivo)
	estado.vivas.forEach(function (v) {
		var u = por[chave(v.nome)];
		if (u) { u.viva = v; u.foto = u.foto || v.foto; return; }

// ---- Categorias do topo: impressoras de filamento, impressoras de resina e Casa (Filuna Home) ----
var CATS = [["filamento", "Impressoras de filamento", '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3.5v6M12 14.5v6"/>'],

	["casa", "Casa · Filuna Home", '<path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><circle cx="12" cy="14.5" r="2"/>']];
var RESINA_RE = /halot|photon|\bmars\b|saturn|jupiter|sonic mini|sonic mighty|uniformation|phrozen|\bresina\b|\bmsla\b|\bsla\b|form ?[234]\b/i;

function tecnologiaDe(u) { if (u.local && u.local.tecnologia) return u.local.tecnologia; return RESINA_RE.test((u.nome || "") + " " + (u.modelo || "")) ? "resina" : "filamento"; }

function resinaAtual() { return estado.local && estado.local.tecnologia == "resina" ? estado.local : null; }
function barraCats() {
	var n = { filamento: unidadesDe("filamento").length, resina: unidadesDe("resina").length || (resinaAtual() ? 1 : 0) };
	return '<div class="cats">' + CATS.map(function (c) {
		return '<button class="cat' + (estado.cat == c[0] ? " on" : "") + '" data-cat="' + c[0] + '"><svg viewBox="0 0 24 24" aria-hidden="true">' + c[2] + "</svg>" + c[1] +
			(n[c[0]] != null ? " <span>" + n[c[0]] + "</span>" : "") + "</button>";

}
function ligarCats(app) {
	app.querySelectorAll("[data-cat]").forEach(function (b) {

	});
}
function poeCats(app) { app.insertAdjacentHTML("afterbegin", barraCats()); ligarCats(app); }

function galeriaResina(app) {
	var lista = unidadesDe("resina"), atual = resinaAtual();
	var cards = lista.map(function (u) {
		var perfis = (u.local && u.local.perfis) || [];
		return '<div class="un">' + (u.foto ? '<div class="ft"><img src="' + E(u.foto) + '" alt=""></div>' : "") + '<div class="n">' + E(u.nome) + '</div><div class="st">' + E(perfis[0] || u.modelo || "") +
			'</div><div class="st">' + (u.local && u.local.endereco ? "Na rede: " + E(u.local.endereco) : "Envio por pendrive") + "</div></div>";
	});

		cards.unshift('<div class="un"><div class="n">' + E(atual.impressora) + '<span class="pillv on">em uso</span></div><div class="st">Escolhida na Preparação</div><div class="st">Arquivo ' +

			: '<div class="vazio">Escolha a impressora de resina na Preparação, em Selecionar impressora (por exemplo, Creality HALOT R6). Ela aparece aqui com o tipo de arquivo e o jeito de enviar.</div>') +
		'<div class="nota">Estas impressoras de resina recebem o arquivo fatiado por pendrive: na Preparação, fatie e use Exportar.</div></div>';

function desenhar() {
	var app = document.getElementById("app");
	if (estado.vista == "assistente") { assistente(app); return; }
	var u = estado.unidades.filter(function (x) { return x.id == estado.sel; })[0];
	if (estado.vista == "raiox" && u) { RaioX.desenhar(app, u, function () { estado.vista = "unidade"; desenhar(); }, desenhar); return; }
	if (estado.vista == "unidade" && u) { unidade(app, u); return; }
	estado.vista = "lista";
	if (estado.cat == "casa") {
		FilunaCasa.desenhar(app, barraCats(), ligarCats, estado.unidades.map(function (x) { return { nome: x.nome, modelo: x.modelo, tecnologia: tecnologiaDe(x), viva: x.viva }; }));
		return;
	}
	if (estado.cat == "resina") { galeriaResina(app); return; }
	if (!unidadesDe("filamento").length) { configurar(app); return; }
	galeria(app);
}

function unidade(app, u) {

				// total = restante ÷ o que falta (a impressora ao vivo só manda o restante); sem progresso ainda, não mostra total

	}

// O perfil da Preparação é desta impressora? Compara o modelo da impressora com o modelo do perfil (sem acentos e espaços).
// Último comando enviado a cada impressora (marca o que está ligado). Fica só neste computador.
function lerCtl() { try { return JSON.parse(localStorage.getItem("fl.ctl") || "{}") || {}; } catch (e) { return {}; } }
function guardarCtl(o) { try { localStorage.setItem("fl.ctl", JSON.stringify(o)); } catch (e) {} }
// O programa entrega a cor como "RRGGBBAA" (sem #): vira cor de tela.
function corCss(c) { c = String(c || "").replace(/^#/, ""); return /^[0-9a-fA-F]{6,8}$/.test(c) ? "#" + c.slice(0, 6) : "#eeeeee"; }
function mesmoModelo(a, b) {
	var n = function (x) { return String(x || "").toLowerCase().normalize("NFD").replace(/[^a-z0-9]/g, ""); };
	a = n(a); b = n(b);
	return !a || !b || a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}

function cabecalho(nome, est, modelo, local) {
	var perfil = local.impressora || "", confere = mesmoModelo(modelo, local.modelo || perfil);
	var ic = function (d) { return '<svg viewBox="0 0 24 24">' + d + "</svg>"; };
	return '<div class="head"><div><div class="lbl">Dispositivo local</div><div class="h1">' + E(nome) +
		(est ? ' <span class="pill ' + (TONS[est] || "") + '">' + E(NOMES[est] || est) + "</span>" : "") + "</div>" +
		'<div class="sub">' + E(modelo) + (perfil ? " · Perfil " + E(perfil) : "") + "</div>" +
		(perfil && modelo && !confere ? '<div class="perfil-aviso">O perfil na Preparação não é desta impressora.<a data-aba="prepare">Escolher o perfil certo</a></div>' : "") + "</div>" +
		'<div class="hr"><span class="hri">' + ic('<path d="M3.5 9.5a12 12 0 0 1 17 0M6.5 12.5a7.5 7.5 0 0 1 11 0M9.5 15.5a3 3 0 0 1 5 0"/><circle cx="12" cy="18.5" r=".8"/>') + "LAN local</span>" +
		'<span class="hri">' + ic('<rect x="5" y="10.5" width="14" height="9.5" rx="2"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>') + (Filuna.temToken() ? "Sessão do titular" : "Sem conta Filuna") + "</span>" +
		'<button class="btn" data-aba="prepare">Revisar envio</button></div></div>';

function materiais(i) {
	var slots = (i.slots || []).filter(function (x) { return x.material || x.cor; });
	if (slots.length) return slots.map(function (x) {
		return '<div class="mat"><span class="dot" style="width:18px;height:18px;background:' + E(x.cor || "#ccc") + '"></span><div><div class="n">' + E((x.material || "") + (x.cor_nome ? " · " + x.cor_nome : "")) +

// ---------- Filamentos identificados na impressora -> estoque (02-DADOS §4) ----------
// Cada entrada com filamento precisa de uma bobina do estoque ligada a ela (bobina.local). Para as que não
// têm, a tela pergunta: é uma bobina que já existe (mesmo material e cor parecida) ou é nova? Nova pede marca
// e peso e confirma de novo antes de gravar. Vale para qualquer marca que informe as entradas.
var estq = { aberto: false, adiado: {} };
// tipos de filamento e as derivações de cada um (aparecem ao lado ao escolher o tipo)
var FILAMENTOS = {
	"PLA": ["PLA", "PLA+", "PLA Fast (alta velocidade)", "PLA 2.0", "PLA Silk", "PLA Matte", "PLA Tough", "PLA-CF", "PLA Wood (madeira)", "PLA Marble (mármore)", "PLA Glow (brilha no escuro)", "PLA Galaxy", "PLA Translúcido"],
	"PETG": ["PETG", "PETG HF (alto fluxo)", "PETG Rapid", "PETG Translúcido", "PETG-CF", "PETG-GF"],
	"ABS": ["ABS", "ABS+", "ABS-GF", "ABS-CF"],
	"ASA": ["ASA", "ASA Aero", "ASA-CF", "ASA-GF"],
	"TPU": ["TPU 95A", "TPU 90A", "TPU 85A", "TPU HS (alta velocidade)", "TPU para sistema de cores"],
	"PA": ["PA (Nylon)", "PA6", "PA12", "PA-CF", "PA-GF"],
	"PC": ["PC", "PC-ABS", "PC-CF"],
	"Outros": ["PVA", "HIPS", "PP", "PET", "PET-CF", "PCTG", "Outro"]
};
function baseDoTipo(m) { var x = String(m || "").toUpperCase().match(/^[A-Z]+/); x = x ? x[0] : ""; return x == "PLA" || x == "PETG" || x == "ABS" || x == "ASA" || x == "TPU" || x == "PA" || x == "PC" ? x : (x == "NYLON" ? "PA" : x); }
function corPerto(a, b) {
	var h = function (c) { c = String(c || "").replace("#", "").slice(0, 6); return c.length == 6 ? [parseInt(c.slice(0, 2), 16), parseInt(c.slice(2, 4), 16), parseInt(c.slice(4, 6), 16)] : null; };
	var x = h(a), y = h(b); if (!x || !y) return false;
	return Math.sqrt(Math.pow(x[0] - y[0], 2) + Math.pow(x[1] - y[1], 2) + Math.pow(x[2] - y[2], 2)) < 60;
}
function estoqueIdentificar(v) {
	if (estq.aberto || !v || !v.cores || !v.cores.length) return;
	var chaveImp = v.cadastro_id || v.dev_id;
	var localDe = function (c) { return "impressora:" + chaveImp + ":slot:" + ((+c.unidade || 0) * 4 + (+c.slot || 0) + 1); };
	// entradas em que o filamento foi trocado depois de conectar: pergunta de novo, mesmo que material e cor sejam iguais
	var trocados = v.trocados || [];
	var trocado = function (c) { return trocados.indexOf(c.unidade + ":" + c.slot) >= 0; };
	var assinatura = chaveImp + "|" + v.cores.map(function (c) { return c.vazio ? "-" : (c.material || "") + c.cor; }).join(",") + "|" + trocados.join(",");
	if (estq.adiado[assinatura]) return;
	estq.aberto = true;
	Filuna.nativo("estoque.listar").then(function (r) {
		var bobinas = (r.bobinas || []).filter(function (b) { return b.estado == "lacrada" || b.estado == "em_uso"; });
		// a impressora diz só o tipo ("PLA"); no estoque fica a derivação ("PLA Silk") — compara pelo tipo base
		var igual = function (b, c) { var t = b.tipo || {}; return baseDoTipo(t.material) == baseDoTipo(c.material) && corPerto(t.cor_hex, c.cor); };
		var pend = v.cores.filter(function (c) {
			if (c.vazio || !c.material) return false;
			return trocado(c) || !bobinas.some(function (b) { return b.local == localDe(c) && igual(b, c); });
		});
		if (!pend.length) { estq.aberto = false; if (trocados.length) Filuna.nativo("dispositivos.troca_vista", { dev_id: v.dev_id }).catch(function () {}); return; }
		var total = pend.length, n = 0, novo = null, erro = "";
		var el = document.createElement("div"); el.className = "estq"; document.body.appendChild(el);
		var fechar = function (adiar) { if (adiar) estq.adiado[assinatura] = 1; el.remove(); estq.aberto = false;
			if (!adiar && trocados.length) Filuna.nativo("dispositivos.troca_vista", { dev_id: v.dev_id }).catch(function () {}); };
		var ligar = function (id, c) {
			if (!id) return Promise.reject(new Error("O estoque não devolveu a bobina criada."));
			// a bobina que estava nesta entrada antes volta para a prateleira
			var antigas = bobinas.filter(function (b) { return b.local == localDe(c) && b.id != id; });
			return Promise.all(antigas.map(function (b) { b.local = ""; return Filuna.nativo("estoque.local", { id: b.id, local: "" }); }))
				.then(function () { return Filuna.nativo("estoque.local", { id: id, local: localDe(c) }); });
		};
		var passo = function () {
			if (n >= pend.length) { fechar(false); estado.ctlMsg = "Filamentos da impressora ligados ao seu estoque."; desenhar(); return; }
			var c = pend[n], num = (+c.slot || 0) + 1;
			var cand = bobinas.filter(function (b) { return igual(b, c) && String(b.local || "").indexOf("impressora:") != 0; }).slice(0, 3);
			var h = '<div class="cx"><h3>' + (n == 0 ? "Foram identificados " + total + " filamento" + (total > 1 ? "s" : "") + " na " + E(v.nome) : "Filamento " + (n + 1) + " de " + total) + '</h3>' +
				'<div class="sub">Vamos ligar cada um ao seu estoque, para o Filuna descontar o que for usado.</div>' +
				'<div class="slot"><span class="bola" style="background:' + corCss(c.cor) + '"></span><div><b>Entrada ' + num + " · " + E(c.material) + "</b>" + (c.marca ? '<div style="font-size:12.5px;color:#6B6660">' + E(c.marca) + "</div>" : "") + "</div></div>" +
				(erro ? '<div class="er">' + E(erro) + "</div>" : "");
			if (!novo) {
				h += '<div class="op">' + cand.map(function (b, k) {
					var t = b.tipo || {};
					return '<button class="btn" data-ex="' + k + '">É o da etiqueta <b>' + E(b.codigo) + "</b> · " + E([t.marca, t.material, t.cor_nome].filter(Boolean).join(" ")) + " · " + Math.round(b.restante_g) + " g</button>"; }).join("") +
					'<button class="btn' + (cand.length ? "" : " primario") + '" id="eNovo">' + (cand.length ? "É um filamento novo no estoque" : "Cadastrar este filamento no estoque") + "</button></div>";
			} else {
				// sempre pergunta: tipo (com as derivações ao lado), marca, cor e peso aproximado
				var bases = Object.keys(FILAMENTOS);
				h += '<div class="tp"><div class="tb">' + bases.map(function (b) { return '<button class="chip' + (novo.base == b ? " on" : "") + '" data-base="' + b + '">' + b + "</button>"; }).join("") + "</div>" +
					'<div class="tv">' + FILAMENTOS[novo.base].map(function (x) { return '<button class="chip' + (novo.tipo == x ? " on" : "") + '" data-tipo="' + E(x) + '">' + E(x) + "</button>"; }).join("") + "</div></div>" +
					'<div class="cp"><label>Marca<input id="eMarca" value="' + E(novo.marca || "") + '" placeholder="Ex.: Elegoo, eSun, Voolt"></label>' +
					'<label>Peso aproximado (g)<input id="ePeso" type="number" min="1" max="10000" value="' + (novo.peso || 1000) + '"></label></div>' +
					'<div class="cp"><label>Cor<span style="display:flex;gap:8px;align-items:center"><input id="eCor" type="color" value="' + E(novo.cor) + '" style="width:54px;height:40px;padding:2px">' +
					'<input id="eHex" value="' + E(novo.cor.toUpperCase()) + '" maxlength="7" style="flex:1" placeholder="#RRGGBB"></span></label>' +
					'<label>Nome da cor<input id="eCorNome" value="' + E(novo.cor_nome || "") + '" placeholder="Ex.: Preto, Laranja"></label></div>' +
					(novo.confirmar ? '<div class="sub" style="margin-bottom:10px">Confirma: <b>' + E([novo.marca || "sem marca", novo.tipo, novo.cor_nome].filter(Boolean).join(" ")) + '</b> <span class="bola" style="display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:-2px;border:1px solid rgba(0,0,0,.2);background:' + E(novo.cor) + '"></span> ' + E(novo.cor.toUpperCase()) + " com <b>" + novo.peso + " g</b> entra no estoque?</div>" : "") +
					'<div class="op"><button class="btn primario" id="eGravar">' + (novo.confirmar ? "Confirmar e salvar no estoque" : "Continuar") + '</button><button class="btn" id="eVolta">Voltar</button></div>';
			}
			h += '<div class="pe"><span style="font-size:12.5px;color:#8a817a">' + (n + 1) + " de " + total + '</span><a id="eDepois">Agora não</a></div></div>';
			el.innerHTML = h;
			el.querySelector("#eDepois").onclick = function () { fechar(true); };
			el.querySelectorAll("[data-ex]").forEach(function (b) { b.onclick = function () {
				ligar(cand[+b.dataset.ex].id, c).then(function () { erro = ""; n++; passo(); }, function (e) { erro = e.message || "Não foi possível ligar a bobina."; passo(); });
			}; });
			var bn = el.querySelector("#eNovo"); if (bn) bn.onclick = function () {
				var base = baseDoTipo(c.material); if (!FILAMENTOS[base]) base = "Outros";
				var hx = "#" + String(c.cor || "").replace("#", "").slice(0, 6); if (!/^#[0-9a-fA-F]{6}$/.test(hx)) hx = "#CCCCCC";
				novo = { marca: c.marca ? String(c.marca).split(" ")[0] : "", peso: 1000, confirmar: false, base: base, tipo: FILAMENTOS[base].indexOf(c.material) >= 0 ? c.material : FILAMENTOS[base][0], cor: hx, cor_nome: "" };
				erro = ""; passo();
			};
			var ler = function () {
				var m = el.querySelector("#eMarca"); if (!m) return;
				novo.marca = m.value.trim(); novo.peso = Math.round(+el.querySelector("#ePeso").value || 0); novo.cor_nome = el.querySelector("#eCorNome").value.trim();
				var hx = el.querySelector("#eHex").value.trim(); if (hx && hx[0] != "#") hx = "#" + hx;
				var rgb = hx.replace("#", "").match(/^(\d{1,3})[ ,;]+(\d{1,3})[ ,;]+(\d{1,3})$/); // aceita "255, 128, 0"
				if (rgb) hx = "#" + [1, 2, 3].map(function (k) { return ("0" + Math.min(255, +rgb[k]).toString(16)).slice(-2); }).join("");
				if (/^#[0-9a-fA-F]{6}$/.test(hx)) novo.cor = hx; else novo.corRuim = true;
			};
			el.querySelectorAll("[data-base]").forEach(function (b) { b.onclick = function () { ler(); novo.base = b.dataset.base; novo.tipo = FILAMENTOS[novo.base][0]; novo.confirmar = false; passo(); }; });
			el.querySelectorAll("[data-tipo]").forEach(function (b) { b.onclick = function () { ler(); novo.tipo = b.dataset.tipo; novo.confirmar = false; passo(); }; });
			var ec = el.querySelector("#eCor"); if (ec) ec.oninput = function () { el.querySelector("#eHex").value = ec.value.toUpperCase(); };
			var bv = el.querySelector("#eVolta"); if (bv) bv.onclick = function () { novo = null; erro = ""; passo(); };
			var bg = el.querySelector("#eGravar"); if (bg) bg.onclick = function () {
				novo.corRuim = false; ler();
				if (novo.corRuim) { erro = "Confira a cor: use #RRGGBB (ex.: #FF8800) ou R, G, B (ex.: 255, 136, 0)."; passo(); return; }
				if (!novo.marca) { erro = "Informe a marca do filamento."; passo(); return; }
				if (novo.peso < 1 || novo.peso > 10000) { erro = "Informe o peso aproximado em gramas (1 a 10000)."; passo(); return; }
				if (!novo.confirmar) { novo.confirmar = true; erro = ""; passo(); return; }
				Filuna.nativo("estoque.criar", { marca: novo.marca, material: novo.tipo, cor_hex: novo.cor.toUpperCase(), cor_nome: novo.cor_nome, capacidade_g: Math.max(1000, novo.peso), usada: true, restante_g: novo.peso, estimado: true })
					.then(function (x) { return ligar((x.ids || [])[0], c); })
					.then(function () { novo = null; erro = ""; n++; passo(); }, function (e) { erro = e.message || "Não foi possível salvar no estoque."; passo(); });
			};
		};
		passo();
	}, function () { estq.aberto = false; });
}

// ---------- Preparar a impressora (ao conectar) ----------
// Três passos, uma vez por impressora: 1) o Filuna acende a luz e o cliente confirma; 2) com a mesa vazia e
// limpa, o Filuna guarda a foto de referência; 3) confere os filamentos e liga ao estoque. Depois disso o Filuna
// tem o que precisa antes de cada impressão. Vale para qualquer marca; passo sem recurso na marca é pulado.
var prep = { aberto: false };
function prepFeito(dev) { try { return localStorage.getItem("fl.prep." + dev) == "1"; } catch (e) { return false; } }
function prepararImpressora(v, temCamera) {
	if (prep.aberto || estq.aberto || !v || !v.selecionada || prepFeito(v.dev_id)) return false;
	var temLuz = (v.controles || []).indexOf("luz") >= 0;
	var passos = [];
	if (temLuz) passos.push("luz");
	if (temCamera) passos.push("mesa");
	if (v.cores && v.cores.length) passos.push("fil");
	if (!passos.length) return false;
	prep.aberto = true;
	var n = 0, msg = "", el = document.createElement("div"); el.className = "estq prep"; document.body.appendChild(el);
	var fim = function (concluiu) {
		try { localStorage.setItem("fl.prep." + v.dev_id, "1"); } catch (e) {}
		el.remove(); prep.aberto = false;
		if (concluiu && v.cores && v.cores.length) estoqueIdentificar(v); else desenhar();
	};
	var luz = function (ligar) { return Filuna.nativo("dispositivos.controle", { dev_id: v.dev_id, tipo: "luz", ligar: ligar }).catch(function () {}); };
	var desenha = function () {
		if (n >= passos.length) { fim(true); return; }
		var p = passos[n];
		var pontos = '<div class="pts">' + passos.map(function (x, k) { return '<i class="' + (k < n ? "ok" : k == n ? "on" : "") + '"></i>'; }).join("") + "</div>";
		var h = '<div class="cx">' + pontos + '<div class="pk">Preparar ' + E(v.nome) + " · passo " + (n + 1) + " de " + passos.length + "</div>";
		if (p == "luz") h += "<h3>A luz da impressora acendeu?</h3>" +
			'<div class="sub">O Filuna acabou de mandar acender a luz. Olhe a impressora (ou a câmera aqui ao lado) e confirme.</div>' +
			'<div class="op2"><button class="btn primario" id="pSim">Sim, acendeu</button><button class="btn" id="pDeNovo">Tentar de novo</button><button class="btn" id="pPula">Não tem luz</button></div>';
		else if (p == "mesa") h += "<h3>Deixe a mesa vazia e limpa</h3>" +
			'<div class="sub">Retire qualquer peça, sobra de plástico ou ferramenta. O Filuna guarda uma foto da mesa limpa e, antes de cada impressão, compara com a câmera para avisar se ficou algo na mesa.</div>' +
			(msg ? '<div class="er">' + E(msg) + "</div>" : "") +
			'<div class="op2"><button class="btn primario" id="pFoto">A mesa está limpa, registrar a foto</button><button class="btn" id="pPula">Fazer depois</button></div>';
		else h += "<h3>Conferir os filamentos</h3>" +
			'<div class="sub">A impressora informou ' + v.cores.filter(function (c) { return !c.vazio; }).length + " filamento(s) carregado(s). Vamos ligar cada um ao seu estoque: tipo, marca, cor e peso.</div>" +
			'<div class="op2"><button class="btn primario" id="pFil">Conferir filamentos</button><button class="btn" id="pPula">Fazer depois</button></div>';
		h += '<div class="pe"><span></span><a id="pFechar">Fechar e preparar depois</a></div></div>';
		el.innerHTML = h;
		var q = function (id) { return el.querySelector(id); };
		q("#pFechar").onclick = function () { el.remove(); prep.aberto = false; prep.adiado = true; };
		if (q("#pPula")) q("#pPula").onclick = function () { msg = ""; n++; desenha(); };
		if (q("#pSim")) q("#pSim").onclick = function () { n++; desenha(); };
		if (q("#pDeNovo")) q("#pDeNovo").onclick = function () { luz(false).then(function () { setTimeout(function () { luz(true); }, 900); }); };
		if (q("#pFoto")) q("#pFoto").onclick = function () {
			var f = mesaFoto();
			if (!f) { msg = "A câmera ainda não mostrou imagem. Espere o vídeo aparecer no cartão e tente de novo."; desenha(); return; }
			try { localStorage.setItem("fl.mesa." + v.dev_id, JSON.stringify({ g: f, em: Date.now() })); } catch (e) {}
			mesaIA[v.dev_id] = { estado: "ok", em: Date.now() };
			Filuna.nativo("dispositivos.mesa_veredito", { dev_id: v.dev_id, livre: true, motivo: "" }).catch(function () {});
			msg = ""; n++; desenha();
		};
		if (q("#pFil")) q("#pFil").onclick = function () { fim(true); };
	};
	if (temLuz) luz(true);
	desenha();
	return true;
}

// ---------- Conferência da mesa pela câmera ----------
// O cliente confirma uma vez "esta é a mesa limpa" (a foto fica guardada neste computador). Antes de imprimir,
// o Filuna compara a câmera de agora com essa foto: se a imagem mudou bastante, avisa que a mesa parece
// ocupada. Não depende de internet nem de IA externa e vale para qualquer marca com câmera.
var mesaIA = {}; // dev_id -> { estado: "ok"|"ocupada"|"erro"|"semref", motivo, em }
function mesaRef(dev) { try { return JSON.parse(localStorage.getItem("fl.mesa." + dev) || "null"); } catch (e) { return null; } }
// foto reduzida (64x48, cinza, com brilho e contraste igualados) do que a câmera mostra agora
function mesaFoto() {
	var el = document.querySelector("[data-cam]"); if (!el) return null;
	var w = el.videoWidth || el.naturalWidth, h = el.videoHeight || el.naturalHeight; if (!w || !h) return null;
	try {
		var c = document.createElement("canvas"); c.width = 64; c.height = 48;
		var x = c.getContext("2d"); x.drawImage(el, 0, 0, 64, 48);
		var d = x.getImageData(0, 0, 64, 48).data, g = [], soma = 0;
		for (var k = 0; k < d.length; k += 4) { var v = 0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]; g.push(v); soma += v; }
		var media = soma / g.length, dp = Math.sqrt(g.reduce(function (a, v) { return a + (v - media) * (v - media); }, 0) / g.length) || 1;
		return g.map(function (v) { return Math.round((v - media) / dp * 100) / 100; });
	} catch (e) { return null; }
}
function mesaHtml(v, temCamera) {
	if (!v || !v.selecionada || !temCamera) return "";
	var m = mesaIA[v.dev_id] || {}, ref = mesaRef(v.dev_id);
	var txt = !ref ? "Com a mesa vazia e limpa, clique em \"Esta é a mesa limpa\". O Filuna passa a conferir antes de imprimir." :
		m.estado == "ok" ? "Mesa livre, igual à foto da mesa limpa." : m.estado == "ocupada" ? "A mesa parece ocupada (" + (m.motivo || "a imagem mudou") + "). Retire as peças e limpe antes de imprimir." :
		m.estado == "erro" ? (m.motivo || "Não foi possível conferir a mesa.") : "O Filuna compara a câmera com a foto da mesa limpa antes de imprimir.";
	return '<div class="mesaia ' + E(ref ? (m.estado || "") : "") + '"><span>' + E(txt) + '</span><span style="display:flex;gap:8px;flex:none">' +
		(ref ? '<button class="btn peq" id="mesaConf">Conferir mesa</button>' : "") + '<button class="btn peq' + (ref ? "" : " primario") + '" id="mesaLimpa2">Esta é a mesa limpa</button></span></div>';
}
function mesaGuardar(v) {
	var f = mesaFoto();
	if (!f) { mesaIA[v.dev_id] = { estado: "erro", motivo: "A câmera ainda não mostrou imagem." }; desenhar(); return; }
	try { localStorage.setItem("fl.mesa." + v.dev_id, JSON.stringify({ g: f, em: Date.now() })); } catch (e) {}
	mesaIA[v.dev_id] = { estado: "ok", em: Date.now() };
	Filuna.nativo("dispositivos.mesa_veredito", { dev_id: v.dev_id, livre: true, motivo: "" }).catch(function () {});
	desenhar();
}
function mesaConferir(v) {
	var ref = mesaRef(v.dev_id); if (!ref || !ref.g) return;
	var f = mesaFoto();
	if (!f) { mesaIA[v.dev_id] = { estado: "erro", motivo: "A câmera ainda não mostrou imagem." }; desenhar(); return; }
	// 48 blocos de 8x8: um bloco "mudou" quando a diferença média passa de 0,55 desvio
	var mudou = 0;
	for (var by = 0; by < 6; by++) for (var bx = 0; bx < 8; bx++) {
		var dif = 0;
		for (var y = 0; y < 8; y++) for (var x = 0; x < 8; x++) { var k = (by * 8 + y) * 64 + bx * 8 + x; dif += Math.abs(f[k] - ref.g[k]); }
		if (dif / 64 > 0.55) mudou++;
	}
	var pct = Math.round(mudou * 100 / 48), livre = mudou <= 5; // até ~10% da imagem diferente é tolerado (luz, reflexo)
	mesaIA[v.dev_id] = { estado: livre ? "ok" : "ocupada", motivo: livre ? "" : pct + "% da imagem diferente da mesa limpa", em: Date.now() };
	Filuna.nativo("dispositivos.mesa_veredito", { dev_id: v.dev_id, livre: livre, motivo: livre ? "" : "a câmera mostra " + pct + "% da imagem diferente da foto da mesa limpa" }).catch(function () {});
	desenhar();
}

// últimos arquivos guardados na impressora (quando a marca informa)
function arquivosHtml(v) {
	// a lista só é pedida à impressora quando o cliente clica (pedido sob demanda)
	if (v && v.selecionada && (v.controles || []).indexOf("arquivos") >= 0 && (!v.arquivos || !v.arquivos.length))
		return '<div class="arqs"><button class="btn peq" data-ctl="arquivos">Ver arquivos guardados na impressora</button></div>';
	if (!v || !v.arquivos || !v.arquivos.length) return "";
	var quando = function (t) { if (!t) return ""; var d = new Date(t > 1e12 ? t : t * 1000); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); };
	var dur = function (s) { s = +s || 0; return s <= 0 ? "" : s >= 3600 ? Math.floor(s / 3600) + "h" + ("0" + Math.floor(s % 3600 / 60)).slice(-2) : Math.max(1, Math.round(s / 60)) + " min"; };
	return '<div class="arqs"><div class="lbl">Últimos arquivos na impressora</div>' + v.arquivos.slice(0, 6).map(function (a) {
		return '<div class="arq"><span class="an">' + E(a.nome) + '</span><span class="ai">' + E([quando(a.impresso_em), dur(a.tempo_s), a.vezes ? a.vezes + "×" : ""].filter(Boolean).join(" · ")) + "</span></div>"; }).join("") + "</div>";
}
// ---------- Estado ao vivo (cards) ----------
function viva(u) { return u.viva || null; }
Filuna.ouvir("dispositivos.estado", function (e) {
	estado.vivas = (e.impressoras || []).map(fotoViva);
	juntar();
	if (estado.vista == "lista" && !estado.confirmar && document.activeElement.id != "busca") desenhar();
	else if (estado.vista == "unidade" && !estado.confirmar) {
		// cartão aberto acompanha a impressora ao vivo; só redesenha quando algo mudou (não reinicia a câmera à toa)
		var chave = JSON.stringify(estado.vivas), foco = document.activeElement;
		if (foco && foco.closest && foco.closest(".ctlvivo") && /^(INPUT|SELECT)$/.test(foco.tagName)) return; // não atrapalha quem está digitando um valor
		if (chave != estado.vivasAntes) { estado.vivasAntes = chave; desenhar(); }
	}
});
var fotos = {};
// Foto oficial do modelo (catálogo de perfis). Vale para qualquer marca: a impressora diz "Centauri Carbon 2",
// o catálogo chama "Elegoo Centauri Carbon 2" — casa pelo nome mais longo contido num dos dois.
function fotoDoModelo() {
	var melhor = "", tam = 0, nomes = Object.keys(fotos);
	for (var a = 0; a < arguments.length; a++) {
		var nome = (arguments[a] || "").toLowerCase(); if (!nome || nome == "desconhecido") continue;
		nomes.forEach(function (n) { var m = n.toLowerCase(); if ((nome.indexOf(m) >= 0 || m.indexOf(nome) >= 0) && Math.min(m.length, nome.length) > tam) { tam = Math.min(m.length, nome.length); melhor = fotos[n]; } });
	}
	return melhor;
}
function fotoViva(v) { v.foto = v.foto || fotoDoModelo(v.nome, v.modelo_nome, v.modelo); return v; }
// carrega as fotos de todas as marcas uma vez (leitura local) e redesenha a lista
var fotosPedidas = false;
function carregarFotos() {
	if (fotosPedidas) return; fotosPedidas = true;
	Filuna.nativo("dispositivos.fabricantes").then(function (r) {
		return Promise.all((r.fabricantes || []).map(function (f) {
			return Filuna.nativo("dispositivos.modelos", { fabricante: f.id }).then(function (m) { (m.modelos || []).forEach(function (x) { if (x.foto) fotos[x.nome] = x.foto; }); }).catch(function () {});
		}));
	}).then(function () {
		(estado.vivas || []).forEach(fotoViva); juntar();
		if (estado.vista == "lista" && !estado.confirmar) desenhar();
	}).catch(function () { fotosPedidas = false; });
}

// ---------- Assistente: conectar nova impressora ----------
function abrirAssistente() { estado.assist = { passo: "marcas", marcas: [], marca: null, modelos: [], modelo: null, comp: null, prog: null, achadas: [], tentativas: 0, erro: "", ip: "", codigo: "", nome: "" }; estado.vista = "assistente"; desenhar(); }
function assistente(app) {
	var a = estado.assist, html = '<div class="pg"><div class="topo"><a class="voltar" id="voltarA">‹ ' + (a.passo == "marcas" ? "Impressoras" : "Voltar") + '</a>';
	if (a.passo == "marcas") {
		html += '<div class="h1">Conectar nova impressora</div><div class="sub">Escolha o fabricante. Elegoo e Anycubic já foram testadas em impressora real; as demais foram validadas em simulador e estão em teste com os primeiros clientes.</div></div>';
		if (!a.marcas.length) { html += '<div class="carregando"><span class="spin"></span>Lendo o catálogo…</div>'; Filuna.nativo("dispositivos.fabricantes").then(function (r) { a.marcas = r.fabricantes || []; a.conta = r.conta; desenhar(); }).catch(function (e) { a.erro = e.message; desenhar(); }); }
		else if (!a.marcas.length) html += '<div class="vazio">Nenhum fabricante no catálogo desta conta.</div>';
		else html += '<div class="marcas">' + a.marcas.map(function (m) {
			return '<div class="marca' + (m.modelos_disponiveis ? "" : " off") + '" data-m="' + E(m.id) + '"><img src="' + E(m.logo) + '" alt="" onerror="this.style.display=\'none\'"><div class="nm">' + E(m.nome) + '</div><div class="ct">' + m.modelos_disponiveis + ' modelo(s) homologado(s)' + (m.modo_motor == "ORCA_NATIVO" ? " · motor Orca" : "") + '</div></div>';
		}).join("") + "</div>" + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "");
	} else if (a.passo == "modelos") {
		html += '<div class="h1">' + E(a.marca.nome) + '</div><div class="sub">Modelos disponíveis para esta marca. Validados em simulador; o teste em impressora real de cada modelo é feito com os primeiros clientes.</div></div>';
		if (!a.modelos.length) { html += '<div class="carregando"><span class="spin"></span>Carregando modelos…</div>'; Filuna.nativo("dispositivos.modelos", { fabricante: a.marca.id }).then(function (r) { a.modelos = r.modelos || []; a.modelos.forEach(function (m) { if (m.foto) fotos[m.nome] = m.foto; }); desenhar(); }).catch(function (e) { a.erro = e.message; desenhar(); }); }
		else html += '<div class="modelos">' + a.modelos.map(function (m) {
			return '<div class="modelo' + (m.disponivel ? "" : " off") + '" data-md="' + E(m.nome) + '"><div class="ft">' + (m.foto ? '<img src="' + E(m.foto) + '" alt="">' : ilustracao(160)) + '</div><div class="nm">' + E(m.nome) + '</div>' + (m.disponivel ? '<div class="ct" style="font-size:12.5px;color:var(--ink2)">Bicos: ' + E((m.bicos || []).join(", ")) + '</div>' : '<div class="ms">' + E(m.mensagem) + '</div>') + '</div>';
		}).join("") + "</div>" + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "");
	} else if (a.passo == "complemento") {
		var c = a.comp, mb = c ? (c.bytes / 1048576).toFixed(1) : "";
		html += '<div class="h1">' + E(a.modelo.nome) + '</div></div><div class="fotoGrande">' + (a.modelo.foto ? '<img src="' + E(a.modelo.foto) + '" alt="">' : ilustracao(260)) + '</div>';
		if (!c) { html += '<div class="carregando"><span class="spin"></span>Verificando o complemento…</div>'; Filuna.nativo("dispositivos.complemento", { fabricante: a.marca.id }).then(function (r) { a.comp = r; if (r.instalado) { a.passo = "procurar"; preparar(); } desenhar(); }).catch(function (e) { a.erro = e.message; desenhar(); }); }
		else if (a.prog) {
			html += '<div class="caixa"><h3><span class="spin"></span>Baixando complemento ' + E(a.marca.nome) + '</h3><p>Não feche o Filuna. Estamos atualizando a base para a sua impressora.</p>' +
				'<div class="progresso"><div class="bar"><i style="width:' + Math.round(100 * (a.prog.feito || 0) / Math.max(1, a.prog.total || 1)) + '%"></i></div><div class="et">' + E(a.prog.etapa || "") + '</div></div>' + (a.erro ? '<div class="erro">' + E(a.erro) + '</div><div class="acoes"><button class="btn" id="denovo">Tentar de novo</button></div>' : "") + "</div>";
		} else {
			html += '<div class="caixa" style="margin-top:22px"><h3>Baixar complemento</h3><p>Para a <b>' + E(a.modelo.nome) + '</b>, o Filuna precisa do complemento <b>' + E(a.marca.nome) + ' ' + E(c.versao || "") + '</b>' + (mb ? ' (' + mb + ' MB)' : '') + '. Depois disso o Filuna passa a ser nativo nesta impressora.</p>' +
				'<ul>' + (c.libera || []).map(function (x) { return "<li>" + E(x) + "</li>"; }).join("") + '</ul>' +
				'<div class="acoes"><button class="btn primario" id="baixar">Baixar e liberar</button><button class="btn" id="depois">Agora não</button></div>' + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "") + "</div>";
		}
	} else if (a.passo == "procurar") {
		html += '<div class="h1">' + E(a.modelo.nome) + '</div><div class="sub">' + (a.achadas.length ? "Escolha a sua impressora." : "Procurando na sua rede local…") + '</div></div>';
		html += '<div class="caixa"><h3>' + (a.achadas.length ? "Impressoras encontradas" : '<span class="spin"></span>Verificando a rede LAN') + '</h3><p>A impressora precisa estar ligada, na mesma rede e com o modo LAN ativo.</p>' +
			(a.achadas.length ? '<div class="achadas">' + a.achadas.map(function (d) { return '<div class="achada" data-d="' + E(d.dev_id) + '"><div class="nm">' + E(d.nome) + '</div><div class="ip">' + E((d.modelo_nome || d.modelo || "") + " · " + d.ip) + (d.precisa_codigo && a.marca && a.marca.id == "bambu" ? " · pede código de acesso" : "") + '</div></div>'; }).join("") + "</div>" : "") +
			(a.pedirCodigo ? '<div class="campo" style="margin-top:14px"><label>Código de acesso (está na tela da impressora)</label><input type="text" id="codigo" value="' + E(a.codigo) + '"></div><div class="acoes"><button class="btn primario" id="conectarCod">Conectar</button></div>' : "") +
			'<div class="acoes">' + (a.tentativas >= 8 || a.achadas.length ? '<button class="btn" id="outros">Não achei · outros meios</button>' : "") + '<button class="btn" id="procurar">Procurar de novo</button><button class="btn" id="trocarMarca">Trocar fabricante</button></div>' + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "") + "</div>";
	} else if (a.passo == "ip") {
		html += '<div class="h1">Outros meios de conexão</div><div class="sub">Se a busca automática não achou, informe o endereço da impressora.</div></div>';
		html += '<div class="caixa"><h3>Conectar pelo endereço IP</h3><p>O IP aparece na tela da impressora em Configurações › Rede.</p>' +
			'<div class="campo" style="margin-top:14px"><label>Endereço IP</label><input type="text" id="ip" placeholder="192.168.0.50" value="' + E(a.ip) + '"></div>' +
			'<div class="campo"><label>Código de acesso (se a impressora mostrar um)</label><input type="text" id="codigo" value="' + E(a.codigo) + '"></div>' +
			'<div class="campo"><label>Nome da impressora no Filuna</label><input type="text" id="nome" placeholder="' + E(a.modelo.nome) + '" value="' + E(a.nome) + '"></div>' +
			'<div class="acoes"><button class="btn primario" id="conectarIp">Conectar</button><button class="btn" id="ponte">Não conecta · me ensine a ligar o modo LAN</button></div>' + (a.erro ? '<div class="erro">' + E(a.erro) + "</div>" : "") + "</div>";
	} else if (a.passo == "ponte") {
		var pt = a.ponte || { titulo: "", passos: [] };
		html += '<div class="h1">Ponte pela rede LAN</div><div class="sub">Passo a passo na sua ' + E(a.modelo.nome) + '.</div></div>';
		html += '<div class="caixa"><h3>' + E(pt.titulo) + '</h3><ol class="passosLan">' + (pt.passos || []).map(function (x) { return "<li>" + E(x) + "</li>"; }).join("") + '</ol>' + (pt.nota ? '<p>' + E(pt.nota) + '</p>' : "") +
			'<div class="acoes"><button class="btn primario" id="procurarP">Pronto, procurar de novo</button><button class="btn" id="irIp">Informar o IP</button></div></div>';
	} else if (a.passo == "pronto") {
		var v = a.conectada || {};
		html += '<div class="h1">' + E(v.nome || a.modelo.nome) + ' conectada</div><div class="sub">O Filuna agora é nativo nesta impressora. Ela já aparece em Preparar.</div></div>';
		html += '<div class="fotoGrande">' + (a.modelo.foto ? '<img src="' + E(a.modelo.foto) + '" alt="">' : ilustracao(260)) + '</div><div class="caixa" style="margin-top:22px"><h3>Tudo liberado</h3><ul><li>Rede: ' + E(v.ip || "") + '</li><li>Estado: ' + E(v.estado || "") + '</li><li>Cores: ' + ((v.cores || []).length || "sem sistema de cores detectado") + '</li><li>Câmera: ' + (v.camera ? "disponível" : "não detectada") + '</li></ul>' +
			'<div class="acoes"><button class="btn primario" id="fim">Ir para as impressoras</button><button class="btn" data-aba="prepare">Abrir Preparar</button></div></div>';
	}
	html += "</div>";
	app.innerHTML = html;
	app.querySelector("#voltarA").onclick = function () {
		if (a.passo == "marcas") { estado.vista = "lista"; desenhar(); return; }
		a.erro = "";
		a.passo = a.passo == "modelos" ? "marcas" : a.passo == "complemento" ? "modelos" : a.passo == "procurar" ? "modelos" : a.passo == "ip" ? "procurar" : a.passo == "ponte" ? "ip" : "marcas";
		if (a.passo == "complemento") a.prog = null;
		desenhar();
	};
	app.querySelectorAll("[data-m]").forEach(function (x) { x.onclick = function () { var m = a.marcas.filter(function (y) { return y.id == x.dataset.m; })[0]; if (!m || !m.modelos_disponiveis) return; a.marca = m; a.modelos = []; a.erro = ""; a.passo = "modelos"; desenhar(); }; });
	app.querySelectorAll("[data-md]").forEach(function (x) { x.onclick = function () { var m = a.modelos.filter(function (y) { return y.nome == x.dataset.md; })[0]; if (!m) return; if (!m.disponivel) { a.erro = m.mensagem; desenhar(); return; } a.modelo = m; a.comp = null; a.prog = null; a.erro = ""; a.passo = "complemento"; desenhar(); }; });
	var b;
	if ((b = app.querySelector("#baixar"))) b.onclick = function () { a.erro = ""; a.prog = { etapa: "Iniciando…", feito: 0, total: 1 }; desenhar(); Filuna.nativo("dispositivos.complemento.baixar", { fabricante: a.marca.id }).catch(function (e) { a.erro = e.message; desenhar(); }); };
	if ((b = app.querySelector("#denovo"))) b.onclick = function () { a.prog = null; a.erro = ""; desenhar(); };
	if ((b = app.querySelector("#depois"))) b.onclick = function () { estado.vista = "lista"; desenhar(); };
	if ((b = app.querySelector("#procurar"))) b.onclick = function () { a.erro = ""; a.tentativas = 0; preparar(); desenhar(); };
	if ((b = app.querySelector("#procurarP"))) b.onclick = function () { a.erro = ""; a.tentativas = 0; a.passo = "procurar"; preparar(); desenhar(); };
	// Fabricante errado: sai da busca a qualquer momento (a busca da tela para sozinha fora do passo "procurar")
	if ((b = app.querySelector("#trocarMarca"))) b.onclick = function () { a.passo = "marcas"; a.marca = null; a.modelo = null; a.modelos = []; a.achadas = []; a.erro = ""; a.pedirCodigo = false; desenhar(); };
	if ((b = app.querySelector("#outros"))) b.onclick = function () { a.passo = "ip"; a.erro = ""; desenhar(); };
	if ((b = app.querySelector("#irIp"))) b.onclick = function () { a.passo = "ip"; a.erro = ""; desenhar(); };
	if ((b = app.querySelector("#ponte"))) b.onclick = function () { Filuna.nativo("dispositivos.ponte", { fabricante: a.marca.id }).then(function (r) { a.ponte = r; a.passo = "ponte"; desenhar(); }); };
	if ((b = app.querySelector("#conectarIp"))) b.onclick = function () {
		a.ip = app.querySelector("#ip").value.trim(); a.codigo = app.querySelector("#codigo").value.trim(); a.nome = app.querySelector("#nome").value.trim(); a.erro = "";
		Filuna.nativo("dispositivos.conectar_ip", { fabricante: a.marca.id, modelo: a.modelo.nome, ip: a.ip, codigo: a.codigo, nome: a.nome }).then(function (r) { if (r.erro) { a.erro = r.erro; desenhar(); return; } concluir(r.impressora); }).catch(function (e) { a.erro = e.message; desenhar(); });
	};
	app.querySelectorAll("[data-d]").forEach(function (x) { x.onclick = function () {
		var d = a.achadas.filter(function (y) { return y.dev_id == x.dataset.d; })[0]; if (!d) return;
		a.escolhida = d; a.erro = "";
		// Só a Bambu exige código antes de conectar. Elegoo, Creality e as demais conectam direto, como no fatiador
		// oficial; o código só é pedido se a impressora recusar (quem definiu um PIN nela).
		if (d.precisa_codigo && !a.codigo && a.marca && a.marca.id == "bambu") { a.pedirCodigo = true; desenhar(); return; }
		conectar(d.dev_id, a.codigo || codigoPadrao(a));
	}; });
	if ((b = app.querySelector("#conectarCod"))) b.onclick = function () { a.codigo = app.querySelector("#codigo").value.trim(); if (a.escolhida) conectar(a.escolhida.dev_id, a.codigo); };
	if ((b = app.querySelector("#fim"))) b.onclick = function () { estado.vista = "lista"; estado.assist = null; carregar(); };
	ligarComuns(app);

	function preparar() {
		a.achadas = []; a.pedirCodigo = false;
		Filuna.nativo("dispositivos.preparar", { fabricante: a.marca.id, modelo: a.modelo.nome }).then(function (r) {
			if (r.erro) { a.erro = r.erro; desenhar(); return; }
			a.perfil = r.perfil; a.agente = r.agente || ""; procurarCiclo();
		}).catch(function (e) { a.erro = e.message; desenhar(); });
	}
	function procurarCiclo() {
		if (estado.vista != "assistente" || a.passo != "procurar") return;
		daMarca(a).then(function (r) {
			var achadas = (r.impressoras || []);
			if (achadas.length) { a.achadas = achadas; desenhar(); return; }
			a.tentativas++;
			if (a.tentativas == 8) { semImpressoraNaRede(a, r); desenhar(); } // ~16 s sem resposta: oferece outros meios, mas segue procurando
			if (a.tentativas < 90) setTimeout(procurarCiclo, a.tentativas < 8 ? 2000 : 3000);
		}).catch(function (e) { a.erro = e.message; desenhar(); });
	}
	function conectar(devId, codigo) {
		a.erro = "";
		Filuna.nativo("dispositivos.conectar", { dev_id: devId, codigo: codigo || "" }).then(function (r) { if (r.erro) { a.erro = r.erro; a.pedirCodigo = true; desenhar(); return; } concluir(r.impressora); }).catch(function (e) { a.erro = e.message; desenhar(); });
	}
	function concluir(imp) {
		imp = imp || {};
		var nome = a.nome || imp.nome || a.modelo.nome;
		Filuna.nativo("dispositivos.registrar", { nome: nome, fabricante: a.marca.id, modelo: a.modelo.nome, dev_id: imp.dev_id || "" }).then(function () {
			imp.nome = nome; a.conectada = imp; a.passo = "pronto"; desenhar();
		}).catch(function (e) { a.erro = e.message; desenhar(); });
	}
}
Filuna.ouvir("complemento.progresso", function (p) {
	var a = estado.assist; if (!a || estado.vista != "assistente" || a.passo != "complemento") return;
	if (p.ok) { a.prog = null; a.comp = a.comp || {}; a.comp.instalado = true; a.passo = "procurar"; desenhar(); Filuna.nativo("dispositivos.preparar", { fabricante: a.marca.id, modelo: a.modelo.nome }).then(function (r) { if (r.erro) { a.erro = r.erro; desenhar(); return; } a.perfil = r.perfil; a.agente = r.agente || ""; a.tentativas = 0; desenhar(); pollDescobertas(); }); return; }
	if (p.erro) { a.erro = p.erro; a.prog = a.prog || {}; desenhar(); return; }
	a.prog = p; desenhar();
});
// Código que a própria marca usa quando o dono não definiu um: a Elegoo sai de fábrica com 123456 e o fatiador
// oficial conecta sem perguntar. Sem um código o programa nem tenta a conexão (trata a impressora como sem acesso).
function codigoPadrao(a) { var m = a && a.marca && a.marca.id; return m == "elegoo" ? "123456" : m == "anycubic" ? "lan" : ""; }
// Impressoras achadas na rede que são da marca escolhida no assistente. A lista da rede do programa guarda as
// achadas de outras marcas (ex.: a Elegoo de antes aparecia ao conectar uma Anycubic); o estado dá o agente de cada uma.
function daMarca(a) {
	return Promise.all([Filuna.nativo("dispositivos.descobertas"), Filuna.nativo("dispositivos.estado").catch(function () { return {}; })]).then(function (v) {
		var r = v[0] || {}, ag = {};
		((v[1] || {}).impressoras || []).forEach(function (i) { if (i.dev_id) ag[i.dev_id] = i.agente || ""; });
		if (a && a.agente) r.impressoras = (r.impressoras || []).filter(function (d) { return !ag[d.dev_id] || ag[d.dev_id] == a.agente; });
		return r;
	});
}
// Diagnóstico: a busca na rede terminou sem achar a impressora — vai para o servidor com marca, modelo e agente.
// Aos 16 s ainda procura (a varredura da rede pode levar mais); só no fim (cerca de 4 min) é "terminou sem achar".
function semImpressoraNaRede(a, r, fim) {
	Filuna.nativo("diagnostico.enviar", { etapa: "dispositivos.procurar", mensagem: fim ? "Busca na rede local terminou sem achar a impressora (4 min)" : "Busca na rede local: 16 s sem achar a impressora, continua procurando",
		contexto: { fabricante: a.marca && a.marca.id, modelo: a.modelo && a.modelo.nome, perfil: a.perfil || "", agente: (r && r.agente) || "", busca_klipper: (r && r.busca_klipper) || null } }).catch(function () {});
}
function pollDescobertas() {
	var a = estado.assist; if (!a || estado.vista != "assistente" || a.passo != "procurar") return;
	daMarca(a).then(function (r) {
		var achadas = r.impressoras || [];
		if (achadas.length) { a.achadas = achadas; desenhar(); return; }
		a.tentativas++;
		if (a.tentativas == 8) { semImpressoraNaRede(a, r, false); desenhar(); }
		if (a.tentativas == 89) semImpressoraNaRede(a, r, true);
		if (a.tentativas < 90) setTimeout(pollDescobertas, a.tentativas < 8 ? 2000 : 3000);
	}).catch(function () {});
}

function rodape() {
	return '<div class="rodape"><a style="color:var(--magenta-deep);font-weight:700" id="unidades">Impressoras</a><a data-aba="filuna.espaco" data-secao="estoque">Filamentos</a><a data-aba="filuna.espaco" data-secao="fila">Fila e histórico</a>' +
		'<span class="r">Envio, fila e agenda não iniciam impressão.</span></div>';
}

function ligarComuns(app) {
	var un = app.querySelector("#unidades"); if (un) un.onclick = function () { estado.vista = "lista"; desenhar(); };
	app.querySelectorAll("[data-aba]").forEach(function (b) { b.onclick = function () { Filuna.nativo("aba.abrir", { aba: b.dataset.aba, secao: b.dataset.secao || "" }); }; });
}

function camera(iid) {
	Filuna.nativo("config.ler", { chave: "filuna_token" }).then(function (r) {
		return fetch("https://filuna3d.com/api/slicer/v1/impressoras/" + encodeURIComponent(iid) + "/camera.jpg?" + Date.now(), { headers: { Authorization: "Bearer " + r.valor } });
	}).then(function (r) { return r.ok ? r.blob() : null; }).then(function (b) {
		var img = document.getElementById("cam"); if (b && img) img.src = URL.createObjectURL(b);
	}).catch(function () {});
}

Filuna.ouvir("mostrar", function () { Filuna.nativo("dispositivos.observar", { ligado: true }).catch(function () {}); carregar(); });
Filuna.ouvir("impressoras", carregar);   // cadastrada agora em "Adicionar impressora"
Filuna.ouvir("secao", function (d) { if (/^(unidade|raiox):/.test(d.secao || "")) Filuna.nativo("secao.pendente").catch(function () {}); abrirPedido(d.secao); carregar(); });
Filuna.iniciar().then(function () { return Filuna.nativo("secao.pendente").then(function (r) { abrirPedido(r.secao); }).catch(function () {}); }).then(carregar);
setInterval(function () { if (!document.hidden && !estado.confirmar && document.activeElement.id != "busca") carregar(); }, 15000);
</script>
