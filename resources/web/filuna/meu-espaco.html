<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu espaço</title>
<link rel="stylesheet" href="base.css">
<style>
.dois{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:1000px){.dois{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--side)}.kpi b{display:block;font-size:24px;margin-top:4px}
.av{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.av:last-child{border:none}
.av .t{font-weight:700}.av .s{color:var(--ink2);font-size:13.5px;margin-top:2px}
.bob{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
.reel{width:44px;height:44px;border-radius:50%;border:9px solid;flex:none;box-shadow:inset 0 0 0 4px #fff}
.oferta{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;display:flex;flex-direction:column}
.oferta img{width:100%;height:140px;object-fit:contain;background:#fff;padding:8px}
.oferta .i{padding:10px 12px;border-top:1px solid var(--line)}.oferta .t{font-size:13.5px;font-weight:600;max-height:38px;overflow:hidden}
.oferta .p{font-size:18px;font-weight:800;margin-top:6px}.oferta .k{font-size:12.5px;color:var(--muted)}
.grupo{margin-bottom:22px}.grupo h3{font-size:16px;margin-bottom:8px}
.opcao{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.opcao .r{font-weight:600}.opcao .a{font-size:12.5px;color:var(--muted);margin-top:2px}
.opcao input[type=number],.opcao input[type=text],.opcao select{width:170px}
.marcas{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:360px}
.marcas label{border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px}
.msg{padding:12px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap;line-height:1.45}
.msg.eu{background:var(--rose);align-self:flex-end}.msg.ia{background:var(--side);border:1px solid var(--line)}
.prov{display:flex;gap:10px;margin:12px 0}
.prov button{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left}
.prov button.on{border-color:var(--magenta-deep);background:var(--rose)}
.prov b{display:block}.prov span{font-size:12.5px;color:var(--ink2)}
.proj{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.proj:hover{border-color:#d9d2c8}.proj .th{width:56px;height:56px;border-radius:10px;background:linear-gradient(145deg,#F6F2EC,#ECE7E0);flex:none;object-fit:cover}
table.l{width:100%;border-collapse:collapse}table.l td,table.l th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
table.l th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}

/* Direção Visual C — Meu espaço e Estoque (FILUNA/design/visual-c/ui/meu-espaco.html e estoque.html) */
.side .sep{height:1px;background:var(--line);margin:10px 6px}
.side .grupo-lbl{padding:10px 6px 6px}
.selcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 12px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.selcard:hover{border-color:#d9d2c8}.selcard .n{font-weight:700;font-size:14px}.selcard .s{font-size:12px;color:var(--muted)}
.selcard .av{width:30px;height:30px;border-radius:50%;background:var(--magenta-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;padding:0;border:0}
.fn .bobina-svg{flex:0 0 auto;margin:-6px 4px -6px -6px;filter:drop-shadow(0 2px 3px rgba(44,42,40,.18))}
.fil .bobina-svg{flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(44,42,40,.15))}
.selcard .av-icone{border-radius:10px;background:var(--magenta-soft,#FDE3EC);color:var(--magenta-deep,#8E1243)}
.status{padding:10px 8px 2px;font-size:13px}.status b{display:flex;align-items:center;gap:8px}.status b:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.status.off b:before{background:#CFC8BE}.status span{display:block;color:var(--muted);margin:2px 0 0 16px}
.me{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;margin-top:18px}
@media(max-width:1100px){.me{grid-template-columns:1fr}}
.me .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.bloco{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.bloco .bh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.bloco .bh .lbl{color:var(--ink);display:flex;align-items:center;gap:10px}
.bloco .bb{padding:14px 18px}
.atv{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}.atv:last-child{border-bottom:0}
.atv .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.atv .t{font-weight:600}.atv .s{font-size:12.5px;color:var(--muted)}.atv .e{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pj{border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;min-width:0}.pj:hover{border-color:#d9d2c8}
.pj .th{height:120px;border-radius:10px;background:#F2EEE8;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#bdb5aa}
.pj .th img{width:100%;height:100%;object-fit:cover}.pj .n{font-weight:700;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pj .s{font-size:12.5px;color:var(--muted)}
.pf{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.pf .ico{width:40px;height:40px;border-radius:11px;background:#F2EEE8;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.pf .t{font-weight:700}.pf .s{font-size:12.5px;color:var(--muted)}.pf .tag{margin-left:auto;white-space:nowrap}
.tracejado{display:block;width:calc(100% - 36px);margin:12px 18px 14px;border:1px dashed #DCD5CC;border-radius:12px;padding:10px;text-align:center;color:var(--ink2);font-weight:600;background:none}
.tracejado:hover{border-color:var(--magenta-deep);color:var(--magenta-deep)}
.fils{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.fil{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.fil .reel{width:38px;height:38px;border-width:8px}.fil .n{font-size:12.5px;font-weight:700;line-height:1.25}.fil .s{font-size:11.5px;color:var(--muted)}
.dois2{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:18px}
.kv{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:14px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;font-weight:600;text-align:left}
.links button:hover{border-color:#d9d2c8}
/* Estoque de filamentos */
.etop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.etab{border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:20px;overflow:hidden}
.etab table{width:100%;border-collapse:collapse}
.etab th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}
.etab td{padding:18px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
.etab .fn{display:flex;gap:12px;align-items:flex-start}.etab .fn .dot{width:18px;height:18px;margin-top:3px}
.etab .fn b{font-size:16px}.etab .fn .s{color:var(--ink2);font-size:13px;margin:2px 0 6px}
.etab .mat,.ecard .mat{display:inline-block;background:var(--rose);color:var(--magenta-deep);font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 9px}
.etab .loc b{display:block}.etab .loc span{color:var(--ink2);font-size:13px}
.etab .peso .bar{width:170px;margin-bottom:8px}.etab .peso span{display:block;color:var(--ink2);font-size:12.5px}
.etab .custo b{font-size:16px;display:block}.etab .custo span{color:var(--ink2);font-size:12.5px}
.etab .baixo{color:var(--warn);font-weight:600;font-size:13.5px}
.etab .pe{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:var(--ink2)}
.ekpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:20px}
@media(max-width:1000px){.ekpis{grid-template-columns:1fr 1fr}}
.ekpis>div{padding:20px 24px;border-right:1px solid var(--line)}.ekpis>div:last-child{border-right:0}
.ekpis span{font-size:13px;font-weight:600}.ekpis b{display:block;font-size:28px;font-weight:800;margin:4px 0}.ekpis small{color:var(--ink2);font-size:12.5px}
/* Estoque: grade, lista e miniaturas; a bobina mostra o que resta ao passar o mouse, focar ou clicar */
.ebarra{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}.ebarra #sinc{margin:0}
.emodos{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:12px;background:#fff}
.emodos button{display:flex;align-items:center;gap:6px;height:38px;padding:0 12px;border:0;border-radius:9px;background:none;color:var(--ink2);font-weight:600;font-size:13.5px}
.emodos button:hover{color:var(--ink)}.emodos button[aria-pressed=true]{background:var(--rose);color:var(--magenta-deep)}
.emodos .ic{width:16px;height:16px}
.bob-viva{position:relative;display:inline-flex;flex:none;border-radius:12px;cursor:help;outline:none}
.bob-viva:focus-visible{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--magenta-deep)}
.bob-viva::after{content:attr(data-dica);position:absolute;left:0;bottom:calc(100% + 2px);background:var(--ink);color:#fff;font-size:12px;font-weight:600;line-height:1.3;padding:6px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;z-index:5}
.bob-viva:hover::after,.bob-viva:focus-visible::after,.bob-viva.aberta::after{opacity:1}
.egrade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:20px}
.ecard{border:1px solid var(--line);border-radius:16px;background:#fff;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ecard.baixa,.emini .it.baixa{border-color:#F5C7AE}
.ecard .topo{display:flex;gap:12px;align-items:center}
.ecard .bobina-svg,.emini .bobina-svg{filter:drop-shadow(0 2px 3px rgba(44,42,40,.18))}
.ecard .topo b{font-size:15.5px}.ecard .s{color:var(--ink2);font-size:12.5px;margin:2px 0 6px}
.ecard .loc b{display:block;font-size:13.5px}.ecard .loc span{color:var(--ink2);font-size:12.5px}
.ecard .peso{font-size:13.5px}.ecard .peso .bar{margin-bottom:6px}.ecard .peso span{display:block;color:var(--ink2);font-size:12.5px}
.ecard .rod{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.ecard .custo b{display:block;font-size:15px}.ecard .custo span{color:var(--ink2);font-size:12.5px}
.ecard .baixo{color:var(--warn);font-weight:600;font-size:12.5px;text-align:right}
.ecard .ac{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.emini{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-top:20px}
.emini .it{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;min-width:0}
.emini .n{font-size:12.5px;font-weight:700;line-height:1.25;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emini .s{font-size:11.5px;color:var(--muted)}
.emini .ac{display:flex;gap:4px;margin-top:4px}
.emini .ac button{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink2);display:flex;align-items:center;justify-content:center}
.emini .ac button:hover{border-color:var(--magenta-deep);color:var(--magenta-deep)}.emini .ac .ic{width:15px;height:15px}
.etab.epe{margin-top:14px}
.rxchip{display:inline-block;margin-top:6px;border:1px solid #F6B08A;background:#FFF0E6;color:#D9480F;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}
.rxjan{position:fixed;inset:0;background:rgba(30,25,20,.45);display:flex;align-items:center;justify-content:center;z-index:60}
.rxcaixa{background:#fff;border-radius:16px;padding:18px;width:min(620px,92vw);max-height:80vh;overflow:auto}.rxcaixa a{cursor:pointer;color:var(--magenta-deep)}
.rxev{display:flex;gap:10px;border-top:1px solid var(--line);padding:10px 0}.rxev img{width:110px;height:80px;object-fit:cover;border-radius:8px}.rxpad{background:#FFF5EC;border-radius:10px;padding:8px 10px;margin-bottom:8px;color:var(--ink)}
/* Menu em grupos e abas do grupo (redesenho 2.5.88) */
.nav-g{display:flex;align-items:center;gap:12px}.nav-g .ic{width:19px;height:19px;flex:none;opacity:.8}.nav-g.on .ic{opacity:1}
.nav-n{margin-left:auto;font-style:normal;background:var(--warn);color:#fff;border-radius:999px;font-size:11.5px;font-weight:800;padding:1px 8px}
.abas-g{display:flex;gap:4px;margin:-4px 0 22px;border-bottom:1px solid var(--line);overflow-x:auto}
.abas-g button{border:0;background:none;padding:10px 16px;font-weight:700;font-size:14px;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.abas-g button.on{color:var(--ink);border-color:var(--magenta-deep)}.abas-g button:hover{color:var(--ink)}
.ini-topo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}.ini-topo .btn .ic{width:16px;height:16px;margin-right:6px;vertical-align:-3px}
.ini-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}@media(max-width:1000px){.ini-kpis{grid-template-columns:1fr 1fr}}
.ini-kpis .kp{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}.ini-kpis span{font-size:13px;font-weight:600;color:var(--ink2)}
.ini-kpis b{display:block;font-size:28px;font-weight:800;margin:2px 0;letter-spacing:-.02em}.ini-kpis small{color:var(--muted);font-size:12.5px}
.ini-kpis .kp.on b{color:var(--magenta-deep)}.ini-kpis .kp.at{background:#FFF6EF;border-color:#F3C3A5;cursor:pointer}.ini-kpis .kp.at b{color:var(--warn)}
.ini-grade{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px}@media(max-width:1100px){.ini-grade{grid-template-columns:1fr}}
.ini-grade .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.ini-imp,.ini-fil{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}.ini-imp{cursor:pointer}.ini-imp:hover{background:var(--side)}
.ini-imp:last-child,.ini-fil:last-child{border-bottom:0}.ini-imp .t,.ini-fil .t{font-weight:700}.ini-imp .s,.ini-fil .s{font-size:12.5px;color:var(--ink2);display:flex;align-items:center;gap:6px}
.ini-fil .bar{margin-top:6px;height:6px}.pt{width:8px;height:8px;border-radius:50%;background:#CFC8BE;display:inline-block}.pt.imprimindo{background:var(--magenta-deep)}.pt.livre{background:var(--good)}.pt.erro{background:var(--warn)}
.tag.at{background:#FFF0E6;color:var(--warn)}
.ofi{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:18px}
.ofi-c{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;cursor:pointer}
.ofi-c:hover{border-color:#d9d2c8;box-shadow:0 10px 24px -16px rgba(40,30,20,.4)}.ofi-c b{font-size:15.5px}.ofi-c small{color:var(--muted);font-size:12.5px}
.ofi-f{width:100%;aspect-ratio:4/3;border-radius:12px;background:radial-gradient(120% 90% at 50% 35%,#fff,#efeae3);display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:#bdb5aa}
.ofi-f img{width:78%;height:88%;object-fit:contain}.ofi-f .ic{width:48px;height:48px}
.ofi-n{display:flex;gap:6px;width:100%;margin:8px 0}.ofi-n>span{flex:1;background:var(--side);border-radius:10px;padding:6px 8px;font-size:11.5px;color:var(--muted)}.ofi-n b{display:block;font-size:16px;color:var(--ink)}
.ekpis{margin-top:14px}.ekpis>div.at{background:#FFF6EF;cursor:pointer}
.euso{margin-top:14px;background:linear-gradient(135deg,#FFF5F9,#FFF8F0);border:1px solid #F7D3E2;border-radius:18px;padding:14px 18px}
.euso-l{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}.euso-c{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 16px 10px 8px;min-width:280px}
.euso-c b{display:block;font-size:15px}.euso-c small{display:block;color:var(--ink2);font-size:12.5px}.euso-c .bar{width:160px;margin:6px 0 2px;height:6px}
.efiltros{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.echips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.echips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--ink2);cursor:pointer}
.echips button.on{background:var(--rose);border-color:#F2B8CF;color:var(--magenta-deep)}.esep{width:1px;height:22px;background:var(--line);margin:0 4px}
#buscaEst{width:260px;max-width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:12px}
.ini-foto{width:56px;height:56px;border-radius:12px;background:radial-gradient(120% 90% at 50% 35%,#fff,#efeae3);display:flex;align-items:center;justify-content:center;flex:none;color:#bdb5aa}
.ini-foto img{width:90%;height:90%;object-fit:contain}.ini-foto .ic{width:28px;height:28px}.ini-bob{margin-left:-18px;margin-right:4px}
</style>
</head>
<body>
<div class="tela"><div class="app"><div class="corpo">
	<div class="side">
		<div class="lbl" style="padding:0 6px 8px">Perfis</div>
		<div id="topo"></div>
		<div id="menu"></div>
		<div style="margin-top:auto" id="conta"></div>
	</div>
	<div class="principal" id="tela"><div class="carregando">Carregando…</div></div>
</div></div></div>
<script src="ponte.js"></script>
<script src="qr.js"></script>
<script>
var E = Filuna.esc;
// Menu da referência (Meu espaço, Projetos, Perfis de impressão, Filamentos, Configurações) e, abaixo, as ferramentas Filuna.
// Configurações não ficam aqui: estão na engrenagem da barra (Configurações do programa › Filuna).
// Seis grupos no menu (antes eram 13 itens soltos); dentro de cada grupo, abas. SECOES continua sendo a lista de
// seções que o Post nas redes (midia-espaco.js) completa com "marca" e "posts" quando a conta tem a ferramenta.
var SECOES = [["visao", "Início"], ["modelos", "Projetos"], ["historico", "Histórico"], ["perfis", "Perfis salvos"], ["reparacao", "Reparar modelo"],
	["estoque", "Estoque"], ["oficina", "Assistência técnica"], ["fila", "Fila da Farm"], ["painel", "Números"], ["ofertas", "Ofertas"], ["loja", "Minha loja"], ["ia", "IA Filuna"]];
var GRUPOS = [
	{ id: "inicio", nome: "Início", icone: "casa", abas: ["visao"] },

// Bobinas imprimindo agora: carregadas numa impressora (local "impressora:<cadastro>:slot:N") cujo estado ao vivo é
// "imprimindo". Se a impressora diz qual entrada está puxando (slot_ativo), gira só a bobina daquela entrada; senão, se
// um trabalho aberto confirmou as bobinas da impressão, giram só elas; senão giram todas as carregadas naquela impressora.
function bobinasImprimindo(bobinas) {
	return Promise.all([Filuna.nativo("dispositivos.estado"), Filuna.nativo("historico.listar", { limite: 30 }).catch(function () { return {}; })]).then(function (r) {
		var imprimindo = {}, confirmadas = {}, porImpressora = {}, giram = {}, entrada = {};
		(r[0].impressoras || []).forEach(function (i) {
			if (i.estado != "imprimindo") return;
			var sa = i.slot_ativo && i.slot_ativo.slot !== undefined && i.slot_ativo.slot !== "" ? (+i.slot_ativo.unidade || 0) * 4 + (+i.slot_ativo.slot || 0) + 1 : 0;
			[i.cadastro_id, i.dev_id].forEach(function (k) { if (k) { imprimindo[k] = true; if (sa) entrada[k] = sa; } });
		});
		(r[1].trabalhos || []).forEach(function (t) { if (t.estado == "imprimindo") (t.bobinas || []).forEach(function (id) { if (id) confirmadas[id] = true; }); });
		var localDe = {};
		bobinas.forEach(function (x) {
			if ((x.estado == "lacrada" || x.estado == "em_uso") && x.na_impressora && imprimindo[x.na_impressora]) {
				(porImpressora[x.na_impressora] = porImpressora[x.na_impressora] || []).push(x.id);
				localDe[x.id] = x.local || "";
			}
		});
		Object.keys(porImpressora).forEach(function (k) {
			var l = porImpressora[k], so = entrada[k] ? l.filter(function (id) { return (localDe[id] || "").slice(-(":slot:" + entrada[k]).length) == ":slot:" + entrada[k]; })
				: l.filter(function (id) { return confirmadas[id]; });
			(so.length ? so : l).forEach(function (id) { giram[id] = true; });
		});
		return giram;
	}, function () { return {}; });
}
var giroTimer = 0;
function naListaEstoque() { return st.secao == "estoque" && !!document.querySelector("#tela .emodos") && !!document.getElementById("r"); }
function vigiarGiro() {
	clearInterval(giroTimer);
	var ver = function () {
		if (st.secao != "estoque" || !naListaEstoque()) { clearInterval(giroTimer); return; }
		if (document.hidden) return;
		bobinasImprimindo(st.bobinas || []).then(function (g) {
			if (Object.keys(g).sort().join() == Object.keys(st.giram || {}).sort().join()) return;
			st.giram = g;
			if (naListaEstoque()) tabelaEstoque();
		});
	};
	ver();
	giroTimer = setInterval(ver, 15000);
}

			'<div style="margin-top:6px;font-weight:700">' + E(t.titulo) + "</div><div class='s' style='color:var(--muted)'>" + E(t.marca) + " · " + Filuna.gramas(t.capacidade_g) + "</div>" +
			'<div style="margin-top:12px;display:flex;gap:18px;justify-content:center;align-items:center">' + Filuna.bobinaSVG(t.cor_hex, 120) +
			FilunaQR.svg(t.qr, 132) + '</div><div class="s" style="color:var(--muted);margin-top:6px">Leia o QR com o app Filuna no celular.</div></div>' +
			'<div class="bb" style="border-top:1px solid var(--line)"><button class="btn primario" id="imp">Imprimir etiqueta</button></div></div>';
		document.getElementById("voltar").onclick = function () { estoque(); };
		document.getElementById("imp").onclick = function () { window.print(); };
	}, function (e) { falha(e); });
}

// Cor da barra de peso: cores muito claras (branco, natural) ficam visíveis com um cinza quente.
// nome da impressora (o local guarda o código do cadastro) e a entrada: "Bambu A1 · entrada 2"
function nomeImpEst(x) {
	var n = (st.nomesImp || {})[x.na_impressora], m = /:slot:(\d+)$/.exec(x.local || "");
	return (n || "Impressora cadastrada") + (m ? " · entrada " + m[1] : "");
}
function corBarra(c) { var r = Filuna.corRgb(c || "#C2185B"); return (0.299 * r[0] + 0.587 * r[1] + 0.114 * r[2]) / 255 > 0.85 ? "#9A948C" : c; }
function pctRestante(x) { return x.peso_inicial_g ? Math.max(0, Math.min(100, x.restante_g / x.peso_inicial_g * 100)) : 0; }
// Bobina desenhada com o que resta (passos de 10%); passar o mouse, focar ou clicar mostra a porcentagem e os gramas.
function bobinaViva(x, px) {
	var gira = !!(st.giram && st.giram[x.id]);
	var dica = Math.round(pctRestante(x)) + "% restante · " + Filuna.gramas(x.restante_g) + (x.peso_inicial_g ? " de " + Filuna.gramas(x.peso_inicial_g) : "") +
		(x.estimado ? " (estimado)" : "") + (gira ? " · imprimindo agora" : "");
	return '<span class="bob-viva' + (gira ? " girando" : "") + '" tabindex="0" role="img" aria-label="' + E(dica) + '" data-dica="' + E(dica) + '">' +
		Filuna.bobinaSVG(x.cor, px, x.peso_inicial_g ? pctRestante(x) / 100 : null) + "</span>";
}
var ICONE_ESTOQUE = {
	pesar: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v15M7 19.5h10M5 8h14M7.5 8 4.5 14a3 3 0 0 0 6 0zM16.5 8l-3 6a3 3 0 0 0 6 0z"/></svg>',
	etiqueta: '<svg class="ic" viewBox="0 0 24 24"><path d="M3.5 12.2V4.5h7.7l9.3 9.3-7.7 7.7z"/><circle cx="8" cy="9" r="1.4"/></svg>'
};
function tabelaEstoque() {
	var todas = (st.bobinas || []).slice(), ord = st.ordem || "nome", lim = st.lim, alerta = st.alerta, modo = st.modoEstoque || "grade";
	var nome = function (x) { return (x.material + " " + x.cor_nome).toLowerCase(); };
	todas.sort(function (a, c) { return ord == "peso" ? a.restante_g - c.restante_g : ord == "numero" ? (a.numero < c.numero ? -1 : 1) : nome(a) < nome(c) ? -1 : nome(a) > nome(c) ? 1 : 0; });
	// filtros: onde está, estoque baixo, material e busca por texto (marca, cor, código)
	var filtro = st.filtroEst || "todas", mat = st.matEst || "", busca = (st.buscaEst || "").toLowerCase();
	var materiais = todas.map(function (x) { return x.material; }).filter(function (m, k, l) { return m && l.indexOf(m) == k; }).sort();
	var b = todas.filter(function (x) {
		if (filtro == "impressora" && !x.na_impressora) return false;
		if (filtro == "guardadas" && x.na_impressora) return false;
		if (filtro == "baixo" && !((x.estado == "lacrada" || x.estado == "em_uso") && x.restante_g < lim)) return false;
		if (mat && x.material != mat) return false;
		return !busca || [x.marca, x.material, x.cor_nome, x.numero].join(" ").toLowerCase().indexOf(busca) >= 0;
	});
	var ativas = todas.filter(function (x) { return x.estado == "lacrada" || x.estado == "em_uso"; });
	var custo = function (x) { return x.preco_kg ? x.restante_g / 1000 * x.preco_kg : null; };
	var baixo = function (x) { return alerta && (x.estado == "lacrada" || x.estado == "em_uso") && x.restante_g < lim; };
	var naImp = ativas.filter(function (x) { return x.na_impressora; }).length, total = 0, inicial = 0, valor = 0, temValor = false, nBaixo = 0;
	ativas.forEach(function (x) { total += x.restante_g; inicial += x.peso_inicial_g || 0; var c = custo(x); if (c != null) { valor += c; temValor = true; } if (baixo(x)) nBaixo++; });
	var ESTADO = { lacrada: "lacrada", em_uso: "em uso", vazia: "vazia", descartada: "arquivada" };
	var descricao = function (x) { return E((x.marca ? x.marca + " · " : "") + "Bobina " + String(x.numero).replace("-", "‑") + " · " + (ESTADO[x.estado] || x.estado)); };
	var nomeImp = nomeImpEst;
	var local = function (x) { return x.na_impressora ? "<b>Na impressora</b><span>" + E(nomeImp(x)) + "</span>" : x.prateleira ? "<b>Guardada</b><span>" + E(x.prateleira) + "</span>" : "<b>Guardada</b><span>Fora das impressoras</span>"; };
	var peso = function (x) {
		var pct = pctRestante(x);
		return "<div class='bar'><i style='width:" + pct + "%;background:" + E(corBarra(x.cor)) + "'></i></div>" + Filuna.gramas(x.restante_g) + " / " + Filuna.gramas(x.peso_inicial_g) +
			"<span>" + Math.round(pct) + "% restante" + (x.estimado ? " · estimado, pese para confirmar" : "") + "</span>";
	};
	var preco = function (x) { var c = custo(x); return c != null ? "<b>" + Filuna.reais(c) + "</b><span>" + Filuna.reais(x.preco_kg / 1000) + " /g</span>" : "<b>—</b><span>sem preço cadastrado</span>"; };
	var rx = function (x) { var r = (st.rxBob || {})[x.id]; return r ? "<button class='rxchip' data-rx='" + E(x.id) + "' title='" + E("Último: " + r.ultimo) + "'>⚠ " + r.erros + (r.erros == 1 ? " erro" : " erros") + "</button>" : ""; };
	var aviso = function (x) { return (baixo(x) ? "<span class='baixo'>Estoque baixo<br>&lt; " + E(lim) + " g</span>" : "") + rx(x); };
	var acoes = function (x, k) { return x.estado == "descartada" ? "" : "<button class='btn peq' data-pesar='" + k + "'>Pesar</button> <button class='btn peq' data-etq='" + k + "'>Etiqueta</button> <button class='btn peq' data-arq='" + k + "'>Arquivar</button>"; };
	var linha = function (x, k) {
		return "<tr><td><div class='fn'>" + bobinaViva(x, 64) + "<div><b>" + E(x.material + " " + x.cor_nome) + "</b><div class='s'>" + descricao(x) + "</div><span class='mat'>" + E(x.material) + "</span></div></div></td>" +
			"<td class='loc'>" + local(x) + "</td><td class='peso'>" + peso(x) + "</td><td class='custo'>" + preco(x) + "</td><td>" + aviso(x) + "</td>" +
			"<td style='white-space:nowrap'>" + acoes(x, k) + "</td></tr>";
	};
	var cartao = function (x, k) {
		return "<div class='ecard" + (baixo(x) ? " baixa" : "") + "'><div class='topo'>" + bobinaViva(x, 92) + "<div style='min-width:0'><b>" + E(x.material + " " + x.cor_nome) + "</b><div class='s'>" + descricao(x) +
			"</div><span class='mat'>" + E(x.material) + "</span></div></div><div class='loc'>" + local(x) + "</div><div class='peso'>" + peso(x) + "</div>" +
			"<div class='rod'><div class='custo'>" + preco(x) + "</div>" + aviso(x) + "</div>" + (x.estado == "descartada" ? "" : "<div class='ac'>" + acoes(x, k) + "</div>") + "</div>";
	};
	var mini = function (x, k) {
		var titulo = x.material + " " + x.cor_nome;
		return "<div class='it" + (baixo(x) ? " baixa" : "") + "'>" + bobinaViva(x, 60) + "<div class='n' title='" + E(titulo) + "'>" + E(titulo) + "</div><div class='s'>" + Math.round(pctRestante(x)) + "% · " + Filuna.gramas(x.restante_g) + "</div>" + rx(x) +
			(x.estado == "descartada" ? "" : "<div class='ac'><button data-pesar='" + k + "' title='Pesar' aria-label='Pesar " + E(x.numero) + "'>" + ICONE_ESTOQUE.pesar + "</button><button data-etq='" + k + "' title='Etiqueta' aria-label='Etiqueta de " + E(x.numero) + "'>" + ICONE_ESTOQUE.etiqueta +
			"</button><button data-arq='" + k + "' title='Arquivar' aria-label='Arquivar " + E(x.numero) + "'>" + ICONE.caixa + "</button></div>") + "</div>";
	};
	var pe = '<div class="pe"><span>' + ativas.length + (ativas.length == 1 ? " bobina ativa" : " bobinas ativas") + '</span><label class="linha" style="gap:8px"><input type="checkbox" id="arq"' + (st.verArquivadas ? " checked" : "") + "> Mostrar vazias e arquivadas</label>" +
		'<label class="linha" style="gap:8px">Ordenar por: <select id="ordem" style="width:auto">' +
		[["nome", "Nome"], ["peso", "Peso restante"], ["numero", "Código da bobina"]].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] == ord ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></label></div>";
	var corpo = modo == "grade" ? '<div class="egrade">' + b.map(cartao).join("") + '</div><div class="etab epe">' + pe + "</div>"
		: modo == "mini" ? '<div class="emini">' + b.map(mini).join("") + '</div><div class="etab epe">' + pe + "</div>"
		: '<div class="etab"><table><tr><th>Filamento</th><th>Localização</th><th>Peso restante</th><th>Custo</th><th></th><th></th></tr>' + b.map(linha).join("") + "</table>" + pe + "</div>";
	var kpis = '<div class="ekpis"><div><span>Bobinas ativas</span><b>' + ativas.length + "</b><small>" + naImp + " na impressora · " + (ativas.length - naImp) + " guardada(s)</small></div>" +
		"<div><span>Peso total restante</span><b>" + Filuna.gramas(total) + "</b><small>de " + Filuna.gramas(inicial) + "</small></div>" +
		"<div><span>Valor total estimado</span><b>" + (temValor ? Filuna.reais(valor) : "—") + "</b><small>" + (temValor ? "pelo preço por kg das bobinas" : "cadastre o preço por kg") + "</small></div>" +
		"<div class='" + (nBaixo ? "at" : "") + "' data-filtro-kpi='baixo'><span>Estoque baixo</span><b" + (nBaixo ? " style='color:var(--warn)'" : "") + ">" + (alerta ? nBaixo : "—") + "</b><small>" + (alerta ? "abaixo de " + E(lim) + " g" : "alerta desligado nas Configurações") + "</small></div></div>";
	// imprimindo agora: a bobina gira e o fio sai em direção à impressora
	var emUso = ativas.filter(function (x) { return st.giram && st.giram[x.id]; });
	var faixa = emUso.length ? '<div class="euso"><div class="lbl">Imprimindo agora</div><div class="euso-l">' + emUso.map(function (x) {
		var pct = Math.round(pctRestante(x));
		return '<div class="euso-c"><span class="bob-viva girando">' + Filuna.bobinaSVG(x.cor, 96, x.peso_inicial_g ? pct / 100 : null) + '</span><div><b>' + E((x.marca ? x.marca + " " : "") + x.material + " " + x.cor_nome) +
			"</b><small>" + E(nomeImpEst(x)) + "</small><div class='bar'><i style='width:" + pct + "%;background:" + E(corBarra(x.cor)) + "'></i></div><small>" + pct + "% · " + Filuna.gramas(x.restante_g) + " restantes</small></div></div>";
	}).join("") + "</div></div>" : "";
	var chips = [["todas", "Todas"], ["impressora", "Na impressora"], ["guardadas", "Guardadas"], ["baixo", "Estoque baixo"]];
	var filtros = '<div class="efiltros"><div class="echips">' + chips.map(function (c) { return '<button data-filtro="' + c[0] + '" class="' + (filtro == c[0] ? "on" : "") + '">' + c[1] + "</button>"; }).join("") +
		(materiais.length > 1 ? '<span class="esep"></span>' + materiais.map(function (m) { return '<button data-mat="' + E(m) + '" class="' + (mat == m ? "on" : "") + '">' + E(m) + "</button>"; }).join("") : "") +
		'</div><input type="search" id="buscaEst" placeholder="Buscar marca, cor ou código" value="' + E(st.buscaEst || "") + '"></div>';
	document.getElementById("r").outerHTML = '<div id="r">' + (todas.length ? kpis + faixa + filtros + (b.length ? corpo : '<div class="vazio" style="margin-top:16px">Nenhuma bobina com esse filtro.</div>')
		: '<div class="vazio" style="margin-top:20px">Nenhuma bobina cadastrada. Use “Adicionar filamento”.</div>') + "</div>";
	el().querySelectorAll("[data-filtro]").forEach(function (x) { x.onclick = function () { st.filtroEst = x.dataset.filtro; tabelaEstoque(); }; });
	el().querySelectorAll("[data-filtro-kpi]").forEach(function (x) { x.onclick = function () { st.filtroEst = "baixo"; tabelaEstoque(); }; });
	el().querySelectorAll("[data-mat]").forEach(function (x) { x.onclick = function () { st.matEst = st.matEst == x.dataset.mat ? "" : x.dataset.mat; tabelaEstoque(); }; });
	var be = document.getElementById("buscaEst");
	if (be) be.oninput = function () { st.buscaEst = be.value; var p = be.selectionStart; tabelaEstoque(); var n = document.getElementById("buscaEst"); n.focus(); n.setSelectionRange(p, p); };
	var o = document.getElementById("ordem"); if (o) o.onchange = function () { st.ordem = o.value; tabelaEstoque(); };
	var a = document.getElementById("arq"); if (a) a.onchange = function () { st.verArquivadas = a.checked; estoque(); };
	el().querySelectorAll("[data-pesar]").forEach(function (x) { x.onclick = function () { pesarBobina(b[+x.dataset.pesar]); }; });
	el().querySelectorAll("[data-etq]").forEach(function (x) { x.onclick = function () { etiquetaBobina(b[+x.dataset.etq]); }; });
	el().querySelectorAll("[data-arq]").forEach(function (x) { x.onclick = function () { arquivarBobina(b[+x.dataset.arq]); }; });
	el().querySelectorAll("[data-rx]").forEach(function (x) { x.onclick = function () { errosDaBobina(b.filter(function (y) { return y.id == x.dataset.rx; })[0]); }; });
	el().querySelectorAll(".bob-viva").forEach(function (s) {
		s.onclick = function (ev) { ev.stopPropagation(); s.classList.toggle("aberta"); };
		s.onblur = function () { s.classList.remove("aberta"); };
	});
}

// Histórico de impressões (02-DADOS §7): onde a impressora não avisa o fim, o fim é marcado aqui.
var ESTADO_TRAB = { fatiado: "Fatiado", enviado: "Enviado", imprimindo: "Imprimindo", concluido: "Concluído", cancelado: "Cancelado", falhou: "Falhou" };
function historico() {
	el().innerHTML = titulo("Meu espaço", "Histórico de impressões", "Cada envio para imprimir fica aqui. Quando a impressora não avisa o fim, marque como terminou para dar baixa nas bobinas.") +
		'<div id="r" class="carregando" style="margin-top:18px">Carregando…</div>';
	Filuna.nativo("historico.listar", { limite: 100 }).then(function (r) {
		var l = r.trabalhos || [];
		document.getElementById("r").outerHTML = '<div id="r" style="margin-top:18px">' + (l.length ? '<div class="etab"><table><tr><th>Quando</th><th>Produto</th><th>Impressora</th><th>Filamento</th><th>Tempo</th><th>Situação</th><th></th></tr>' +
			l.map(function (t, k) {
				var aberto = t.estado == "fatiado" || t.estado == "enviado" || t.estado == "imprimindo";
				var dt = new Date(t.criado_em), quando = isNaN(dt) ? "" : dt.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
				var arq = t.arquivo ? (t.arquivo.situacao == "aqui" ? "<br><a class='s' data-abrir='" + k + "' style='color:var(--mag);cursor:pointer'>Abrir " + E(t.arquivo.nome) + "</a>"
					: "<br><span class='s'>" + (t.arquivo.situacao == "ausente" ? "Arquivo não encontrado neste computador" : "Arquivo em outro computador") + "</span> <a class='s' data-localizar='" + k + "' style='color:var(--mag);cursor:pointer'>Localizar arquivo</a>") : "";
				return "<tr><td>" + E(quando) + "</td><td><b>" + E(t.produto || "Sem nome") + "</b>" + arq + "</td><td>" + E(t.impressora || "—") + "</td>" +
					"<td>" + Filuna.gramas(aberto ? t.previsto_g : t.real_g) + (t.estimado ? " <span class='s'>(estimado)</span>" : "") + "</td>" +
					"<td>" + (t.tempo_real_s != null ? Filuna.tempo(t.tempo_real_s) : t.tempo_previsto_s != null ? Filuna.tempo(t.tempo_previsto_s) : "—") + "</td>" +
					"<td>" + E(ESTADO_TRAB[t.estado] || t.estado) + "</td>" +
					"<td style='white-space:nowrap'>" + (aberto ? "<button class='btn peq primario' data-ok='" + k + "'>Terminou</button> <button class='btn peq' data-cancel='" + k + "'>Cancelada</button> <button class='btn peq' data-falha='" + k + "'>Falhou</button>" : "") + "</td></tr>";
			}).join("") + "</table></div>" : '<div class="vazio">Nenhuma impressão registrada. Ao exportar ou enviar uma mesa com bobinas cadastradas, o Filuna pergunta de quais bobinas sai o filamento.</div>') + "</div>";
		var fim = function (t, tipo) {
			var dados = { id: t.id, fim: tipo };
			if (tipo != "concluido") {
				var p = window.prompt("Quanto chegou a imprimir, em %? (ex.: 50)");
				if (p === null || p === "" || isNaN(Number(p.replace(",", ".")))) return;
				dados.progresso = Math.max(0, Math.min(100, Number(p.replace(",", "."))));
			}
			Filuna.nativo("trabalho.finalizar", dados).then(historico, function (e) { falha(e); });
		};
		el().querySelectorAll("[data-ok]").forEach(function (x) { x.onclick = function () { fim(l[+x.dataset.ok], "concluido"); }; });
		el().querySelectorAll("[data-cancel]").forEach(function (x) { x.onclick = function () { fim(l[+x.dataset.cancel], "cancelado"); }; });
		el().querySelectorAll("[data-falha]").forEach(function (x) { x.onclick = function () { fim(l[+x.dataset.falha], "falhou"); }; });
		var arquivo = function (t, acao) {
			Filuna.nativo(acao, { produto_id: t.produto_id }).then(function (r) { if (!r.aberto && r.situacao) historico(); }, function (e) { falha(e); });
		};
		el().querySelectorAll("[data-abrir]").forEach(function (x) { x.onclick = function () { arquivo(l[+x.dataset.abrir], "arquivo.abrir"); }; });
		el().querySelectorAll("[data-localizar]").forEach(function (x) { x.onclick = function () { arquivo(l[+x.dataset.localizar], "arquivo.localizar"); }; });
	}, function (e) { document.getElementById("r").outerHTML = '<div id="r" class="erro">' + E(e.erro || e.message) + "</div>"; });
}

// Painel (02-DADOS §9–§11): desperdício, produtos mais impressos, previsão de falta e manutenção.
// Lucro por produto: custo do filamento real (pelo preço de cada bobina) e o preço de venda que o vendedor informa.
function lucroProdutos() {
	var caixa = document.getElementById("pLucro");
	Filuna.nativo("produto.lucro").then(function (r) {
		var l = r.produtos || [];
		if (!l.length) { caixa.innerHTML = "<div class='vazio'>Os produtos aparecem aqui depois da primeira impressão concluída.</div>"; return; }
		var tot = 0, comPreco = 0;
		caixa.innerHTML = "<table class='tabela-lucro' style='width:100%;border-collapse:collapse;font-size:13.5px'><tr style='color:var(--ink3);font-size:12px;text-align:left'><th>Produto</th><th>Peças</th><th>Custo/peça</th><th>Preço de venda</th><th>Lucro</th></tr>" +
			l.map(function (x) {
				if (x.lucro_total_centavos != null) { tot += x.lucro_total_centavos; comPreco++; }
				var preco = x.preco_venda_centavos != null ? (x.preco_venda_centavos / 100).toFixed(2).replace(".", ",") : "";
				return "<tr style='border-top:1px solid var(--line)'><td style='padding:6px 0'><b>" + E(x.nome || "Sem nome") + "</b></td><td>" + x.pecas + "</td><td>" + Filuna.reais(x.custo_peca_centavos / 100) +
					"</td><td><input data-preco='" + E(x.id) + "' value='" + preco + "' placeholder='R$' inputmode='decimal' style='width:80px'></td><td" +
					(x.lucro_total_centavos != null && x.lucro_total_centavos < 0 ? " style='color:var(--warn);font-weight:700'" : "") + ">" +
					(x.lucro_total_centavos != null ? Filuna.reais(x.lucro_peca_centavos / 100) + " por peça · " + Filuna.reais(x.lucro_total_centavos / 100) : "—") + "</td></tr>";
			}).join("") + "</table><div class='s' style='margin-top:8px'>" + (comPreco ? "Lucro total dos produtos com preço: <b>" + Filuna.reais(tot / 100) + "</b>. " : "") +
			"O custo conta só o filamento gasto de verdade; energia, mão de obra e taxas de venda entram na calculadora do site.</div>";
		caixa.querySelectorAll("[data-preco]").forEach(function (inp) {
			inp.onchange = function () {
				var v = String(inp.value || "").replace(/[^0-9,\.]/g, "").replace(",", ".");
				var c = v === "" ? null : Math.round(parseFloat(v) * 100);
				if (c !== null && !(c >= 0)) { inp.value = ""; return; }
				Filuna.nativo("produto.preco", { id: inp.dataset.preco, centavos: c }).then(lucroProdutos, function (e) { falha(e); });
			};
		});
	}, function (e) { caixa.innerHTML = '<div class="erro">' + E(e.erro || e.message) + "</div>"; });
}

function painel() {
	el().innerHTML = titulo("Meu espaço", "Painel", "Números deste computador, calculados das impressões registradas.") +
		'<div class="me" style="margin-top:18px"><div class="col"><div class="bloco"><div class="bh"><span class="lbl">Desperdício nos últimos 30 dias</span></div><div class="bb" id="pDes"><div class="carregando">Carregando…</div></div></div>' +
		'<div class="bloco"><div class="bh"><span class="lbl">Produtos mais impressos</span></div><div class="bb" id="pTop"></div></div>' +
		'<div class="bloco"><div class="bh"><span class="lbl">Lucro por produto</span></div><div class="bb" id="pLucro"><div class="carregando">Carregando…</div></div></div></div>' +
		'<div class="col"><div class="bloco"><div class="bh"><span class="lbl">Vai faltar filamento?</span></div><div class="bb" id="pPrev"><div class="carregando">Carregando…</div></div></div>' +
		'<div class="bloco"><div class="bh"><span class="lbl">Manutenção</span></div><div class="bb" id="pMan"><div class="carregando">Carregando…</div></div></div></div></div>';
	Filuna.nativo("painel.resumo", { dias: 30 }).then(function (r) {
		document.getElementById("pDes").innerHTML = r.consumo_g > 0
			? "<div style='font-size:28px;font-weight:800'>" + (r.taxa != null ? Math.round(r.taxa * 100) + "%" : "—") + "</div><div class='s'>" + Filuna.gramas(r.desperdicio_g) + " de " + Filuna.gramas(r.consumo_g) + " (purga e falhas)</div>"
			: "<div class='vazio'>Sem impressões terminadas no período.</div>";
		var p = r.produtos || [];
		document.getElementById("pTop").innerHTML = p.length ? p.map(function (x) { return "<div class='linha' style='justify-content:space-between;padding:6px 0'><b>" + E(x.nome || "Sem nome") + "</b><span>" + x.concluidos + "× · " + Filuna.gramas(x.gramas) + "</span></div>"; }).join("")
			: "<div class='vazio'>Nenhum produto impresso ainda.</div>";
	}, function (e) { document.getElementById("pDes").innerHTML = '<div class="erro">' + E(e.erro || e.message) + "</div>"; });
	lucroProdutos();
	Filuna.nativo("previsao.filamentos").then(function (r) {
		var l = (r.previsoes || []);
		document.getElementById("pPrev").innerHTML = l.length ? l.map(function (x) {
			var t = x.tipo || {}, nome = (t.material || "") + " " + (t.cor_nome || "");
			var txt = !x.dados_suficientes ? "dados insuficientes (precisa de 3 impressões e 7 dias)" : x.sem_consumo ? "sem consumo recente" :
				x.alerta ? "acaba em " + x.dias_de_estoque.toFixed(1).replace(".", ",") + " dias · faltam " + Filuna.gramas(x.falta_g) + " para 7 dias" : "dá para " + Math.floor(x.dias_de_estoque) + " dias";
			return "<div class='linha' style='justify-content:space-between;padding:6px 0'><span><span class='dot' style='display:inline-block;width:10px;height:10px;border-radius:50%;background:" + E(t.cor_hex || "#ccc") + "'></span> <b>" + E(nome) + "</b></span><span" + (x.alerta ? " style='color:var(--warn);font-weight:700'" : "") + ">" + E(txt) + "</span></div>";
		}).join("") : "<div class='vazio'>Cadastre bobinas para ver a previsão.</div>";
	}, function (e) { document.getElementById("pPrev").innerHTML = '<div class="erro">' + E(e.erro || e.message) + "</div>"; });
	// a manutenção agora é uma só, no Raio X de cada impressora (por horas, com a região na foto)
	document.getElementById("pMan").innerHTML = '<div class="s" style="margin-bottom:10px">A manutenção por horas fica no Raio X de cada impressora, junto com os erros e o reparo.</div><button class="btn peq" id="irOficina">Abrir a Assistência técnica</button>';
	document.getElementById("irOficina").onclick = function () { abrirSecao("oficina"); };
}

function fila() {
	if (precisaConta("Entre para ver a fila da sua Farm.")) return;
	el().innerHTML = titulo("Farm", "Fila de impressão", "Mesas organizadas por cor e impressora.") + '<div id="r" class="carregando">Carregando…</div>';
	Filuna.api("GET", "/fila").then(function (r) {
		var l = r.trabalhos || r.fila || [];
		document.getElementById("r").outerHTML = '<div class="linha" style="margin:14px 0"><button class="btn primario" id="novoP">Novo projeto na Farm</button><button class="btn" data-aba="filuna.farm">Abrir a Farm</button><button class="btn" data-aba="filuna.dispositivo">Ver impressoras</button></div>' +
			(l.length ? '<div class="card" style="padding:6px 8px"><table class="l"><tr><th>Pedido</th><th>Mesa</th><th>Cor</th><th>Impressora</th><th>Tempo</th><th>Situação</th></tr>' + l.map(function (t) {
				return "<tr><td><b>" + E(t.descricao || ("Pedido " + (t.pedido || ""))) + "</b><div class='ajuda'>" + E(t.arquivo || "") + "</div></td><td>" + E((t.mesa || t.numero || 1) + "/" + (t.mesas || t.total || 1)) +
					"</td><td><span class='dot' style='background:" + E(t.cor || t.cor_hex || "#ccc") + "'></span> " + E((t.material || "") + " " + (t.cor_nome || "")) + "</td><td>" + E((t.impressora && t.impressora.nome) || "—") +
					"</td><td>" + Filuna.tempo(t.tempo_s) + "</td><td>" + E({aguardando:"Na fila",enviado:"Enviado",imprimindo:"Imprimindo"}[t.estado] || t.estado || "") + (t.pode_iniciar ? " · pode começar" : "") + "</td></tr>";
			}).join("") + "</table></div>" : '<div class="vazio">A fila está vazia.</div>');
		document.getElementById("novoP").onclick = function () { Filuna.nativo("aba.abrir", { aba: "filuna.farm", secao: "/farm/novo" }); };
		el().querySelectorAll("[data-aba]").forEach(function (b) { b.onclick = function () { Filuna.nativo("aba.abrir", { aba: b.dataset.aba }); }; });
	}, function (e) { document.getElementById("r").innerHTML = '<div class="erro">' + E(e.erro) + "</div>"; });
}

function modelos() {
	el().innerHTML = titulo("Projetos", "Meus projetos", "Os projetos ficam no seu computador; nada sobe para o site.") +
		'<div class="linha" style="margin:14px 0"><button class="btn primario" id="abrir">Abrir ou importar modelo</button></div><div id="rec" class="grade"></div>';
	document.getElementById("abrir").onclick = function () { Filuna.nativo("projeto.importar"); };
	recentes(document.getElementById("rec"));
}

function reparacao() {
	el().innerHTML = titulo("Reparação", "Conferir e consertar modelos", "Procura buracos, faces invertidas e partes soltas nos modelos da mesa atual e conserta.") + '<div id="r" class="carregando">Analisando…</div>';
	Filuna.nativo("modelo.objetos").then(function (r) {
		var l = r.objetos || [], ruins = l.filter(function (o) { return o.bordas_abertas > 0 || o.reparados > 0; }).length;
		document.getElementById("r").outerHTML = (l.length ? '<div class="card" style="margin-top:14px;padding:6px 8px"><table class="l"><tr><th>Modelo</th><th>Faces</th><th>Bordas abertas</th><th>Erros já corrigidos</th><th>Situação</th></tr>' +
			l.map(function (o) { var ok = !o.bordas_abertas; return "<tr><td><b>" + E(o.nome) + "</b></td><td>" + o.faces + "</td><td>" + o.bordas_abertas + "</td><td>" + o.reparados +
				"</td><td>" + (ok ? '<span class="pill ok">Fechado</span>' : '<span class="pill alerta">Precisa reparar</span>') + "</td></tr>"; }).join("") + "</table></div>" +
			'<div class="linha" style="margin-top:14px"><button class="btn primario" id="rep"' + (ruins ? "" : " disabled") + ">Reparar " + (ruins ? ruins + " modelo(s)" : "") + '</button><span class="ajuda">Um modelo com bordas abertas pode sair com falhas ou nem fatiar.</span></div>'
			: '<div class="vazio" style="margin-top:14px">Nenhum modelo na mesa. Importe um modelo na Preparação.</div>');
		var b = document.getElementById("rep"); if (b) b.onclick = function () { b.disabled = true; Filuna.nativo("modelo.reparar").then(reparacao, function (e) { falha(e); }); };
	}, falha);
}

function ofertas() {
	if (precisaConta("Entre para ver as ofertas escolhidas para você.")) return;
	el().innerHTML = titulo("Ofertas", "Filamento e peças em oferta", "Reunidas pelo Filuna. Filtros em Configurações (engrenagem) › Ofertas.") + '<div id="r" class="carregando">Buscando…</div>';
	Filuna.api("GET", "/ofertas").then(function (r) {
		var l = r.ofertas || [];
		document.getElementById("r").outerHTML = !r.ativas ? '<div class="vazio" style="margin-top:14px">Ofertas desligadas. <a id="lig">Ligar em Configurações</a></div>' :
			l.length ? '<div class="grade" style="margin-top:14px">' + l.map(function (o, k) {
				return '<div class="oferta" data-k="' + k + '"><img src="' + E(o.imagem) + '" alt=""><div class="i"><div class="t">' + E(o.titulo) + '</div><div class="p">' + Filuna.reais(o.preco) + "</div>" +
					'<div class="k">' + E(o.loja) + (o.preco_kg ? " · " + Filuna.reais(o.preco_kg) + "/kg" : "") + "</div></div></div>"; }).join("") + "</div>"
			: '<div class="vazio" style="margin-top:14px">Nenhuma oferta com esses filtros agora.</div>';
		el().querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () { Filuna.abrirLink(l[+b.dataset.k].url); }; });
		var lg = document.getElementById("lig"); if (lg) lg.onclick = function () { Filuna.nativo("preferencias.abrir"); };
	}, function (e) { document.getElementById("r").innerHTML = '<div class="erro">' + E(e.erro) + "</div>"; });
}

function ia() {
	if (precisaConta("Entre para usar a IA Filuna.")) return;
	el().innerHTML = titulo("IA Filuna", "Pergunte sobre a sua impressão", "Ela recebe o que está na Preparação: impressora, filamento e o resultado do fatiamento.") + '<div id="r" class="carregando">Carregando…</div>';
	Promise.all([Filuna.api("GET", "/ia/estado"), prefs()]).then(function (r) {
		var e = r[0], prov = st.provedor || e.provedor;
		document.getElementById("r").outerHTML = '<div class="prov">' +
			'<button data-p="chatgpt" class="' + (prov == "chatgpt" ? "on" : "") + '"><b>Meu ChatGPT</b><span>' + (e.chatgpt_ligado ? "Ligado (chave …" + E(e.chatgpt_final) + ") · cobrado na sua conta OpenAI" : "Ligue com a sua chave da OpenAI") + "</span></button>" +
			'<button data-p="claude" class="' + (prov == "claude" ? "on" : "") + '"><b>Claude Filuna</b><span>' + (e.claude_disponivel ? e.creditos_claude + " crédito(s) · 1 por pergunta" : "Indisponível agora") + "</span></button></div>" +
			(prov == "chatgpt" && !e.chatgpt_ligado ? '<div class="card" style="margin-bottom:14px"><div class="campo"><label>Chave da OpenAI (sk-…)</label><input type="password" id="chave" placeholder="sk-..."></div>' +
				'<div class="ajuda" style="margin-bottom:10px">Fica guardada criptografada na sua conta. Crie em platform.openai.com › API keys.</div><button class="btn primario" id="ligar">Ligar meu ChatGPT</button> <a id="pegar">Onde pego a chave?</a></div>' : "") +
			(prov == "claude" && e.claude_disponivel && e.creditos_claude < 1 ? '<div class="erro">Sem créditos do Claude Filuna. <a id="comprar">Adquirir créditos</a></div>' : "") +
			'<div class="card"><div class="chat" id="chat">' + (st.conversa.length ? st.conversa.map(function (m) { return '<div class="msg ' + m.de + '">' + E(m.t) + "</div>"; }).join("")
				: '<div class="ajuda">Exemplos: “Por que meu PETG está fazendo fios?” · “Esse tempo de impressão está bom para esta peça?” · “Que suporte uso aqui?”</div>') + "</div>" +
			'<div class="linha" style="margin-top:12px"><textarea id="perg" rows="2" placeholder="Escreva sua pergunta"></textarea><button class="btn primario" id="env">Perguntar</button></div>' +
			(e.chatgpt_ligado ? '<div class="ajuda" style="margin-top:8px"><a id="desligar">Desligar meu ChatGPT</a></div>' : "") + "</div>";
		el().querySelectorAll("[data-p]").forEach(function (b) { b.onclick = function () { st.provedor = b.dataset.p; Filuna.api("POST", "/preferencias", { valores: { "ia.provedor": b.dataset.p } }).then(function (x) { st.prefs = x.valores; ia(); }); }; });
		var lg = document.getElementById("ligar"); if (lg) lg.onclick = function () { Filuna.api("POST", "/ia/chave", { chave: document.getElementById("chave").value.trim() }).then(ia, falha); };
		var pg = document.getElementById("pegar"); if (pg) pg.onclick = function () { Filuna.abrirLink("https://platform.openai.com/api-keys"); };
		var cp = document.getElementById("comprar"); if (cp) cp.onclick = function () { Filuna.abrirLink("https://filuna3d.com/planos"); };
		var dl = document.getElementById("desligar"); if (dl) dl.onclick = function () { Filuna.api("POST", "/ia/chave", { chave: "" }).then(ia, falha); };
		document.getElementById("env").onclick = function () {
			var p = document.getElementById("perg").value.trim(), b = this; if (!p) return;
			b.disabled = true; st.conversa.push({ de: "eu", t: p }); st.conversa.push({ de: "ia", t: "Pensando…" }); ia_chat();
			Filuna.nativo("contexto.ia").catch(function () { return {}; }).then(function (c) {
				return Filuna.api("POST", "/ia", { pergunta: p, contexto: c.texto || "", provedor: prov });
			}).then(function (r) { st.conversa[st.conversa.length - 1].t = r.resposta; ia(); }, function (x) { st.conversa[st.conversa.length - 1].t = x.erro || x.message; ia(); });
		};
	}, function (e) { document.getElementById("r").innerHTML = '<div class="erro">' + E(e.erro) + "</div>"; });
}
function ia_chat() { var c = document.getElementById("chat"); if (c) { c.innerHTML = st.conversa.map(function (m) { return '<div class="msg ' + m.de + '">' + E(m.t) + "</div>"; }).join(""); c.scrollTop = 1e6; } }

Filuna.iniciar().then(function () {
	return Promise.all([iniciais(), Filuna.nativo("secao.pendente").then(function (r) { if (r.secao) st.secao = r.secao; }).catch(function () {})]);
}).then(desenhar);
// Seções de outras abas ("unidade:…", "modelo:…", "/farm…", "ferramentas") também chegam aqui: não são desta tela.
function secaoDestaTela(s) { return !!s && !/[:\/]/.test(s) && s != "ferramentas"; }
Filuna.ouvir("secao", function (d) { if (secaoDestaTela(d.secao)) { Filuna.nativo("secao.pendente").catch(function () {}); st.secao = d.secao; desenhar(); } });
Filuna.ouvir("preferencias", function () { st.prefs = null; if (st.secao == "estoque") desenhar(); });
Filuna.ouvir("conexao", function () { menu(); });
Filuna.ouvir("sincronizado", function () { if (st.secao == "estoque" || st.secao == "visao") desenhar(); });
Filuna.ouvir("estoque", function () { if (st.secao == "estoque" || st.secao == "visao" || st.secao == "historico" || st.secao == "painel") desenhar(); });
Filuna.ouvir("mostrar", function () { iniciais().then(function () { if (st.secao == "visao" || st.secao == "perfis") desenhar(); else menu(); }); });
</script>
<script src="midia-espaco.js"></script>
</body>
</html>
