<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meu espaço</title>
<link rel="stylesheet" href="base.css">
<style>
.dois{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:1000px){.dois{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--side)}.kpi b{display:block;font-size:24px;margin-top:4px}
.av{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}.av:last-child{border:none}
.av .t{font-weight:700}.av .s{color:var(--ink2);font-size:13.5px;margin-top:2px}
.bob{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px}
.reel{width:44px;height:44px;border-radius:50%;border:9px solid;flex:none;box-shadow:inset 0 0 0 4px #fff}
.oferta{border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;background:#fff;display:flex;flex-direction:column}
.oferta img{width:100%;height:140px;object-fit:contain;background:#fff;padding:8px}
.oferta .i{padding:10px 12px;border-top:1px solid var(--line)}.oferta .t{font-size:13.5px;font-weight:600;max-height:38px;overflow:hidden}
.oferta .p{font-size:18px;font-weight:800;margin-top:6px}.oferta .k{font-size:12.5px;color:var(--muted)}
.grupo{margin-bottom:22px}.grupo h3{font-size:16px;margin-bottom:8px}
.opcao{display:flex;gap:16px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.opcao .r{font-weight:600}.opcao .a{font-size:12.5px;color:var(--muted);margin-top:2px}
.opcao input[type=number],.opcao input[type=text],.opcao select{width:170px}
.marcas{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:360px}
.marcas label{border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:13px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow:auto;padding:4px}
.msg{padding:12px 14px;border-radius:14px;max-width:85%;white-space:pre-wrap;line-height:1.45}
.msg.eu{background:var(--rose);align-self:flex-end}.msg.ia{background:var(--side);border:1px solid var(--line)}
.prov{display:flex;gap:10px;margin:12px 0}
.prov button{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left}
.prov button.on{border-color:var(--magenta-deep);background:var(--rose)}
.prov b{display:block}.prov span{font-size:12.5px;color:var(--ink2)}
.proj{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;cursor:pointer}
.proj:hover{border-color:#d9d2c8}.proj .th{width:56px;height:56px;border-radius:10px;background:linear-gradient(145deg,#F6F2EC,#ECE7E0);flex:none;object-fit:cover}
table.l{width:100%;border-collapse:collapse}table.l td,table.l th{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
table.l th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}

/* Direção Visual C — Meu espaço e Estoque (FILUNA/design/visual-c/ui/meu-espaco.html e estoque.html) */
.side .sep{height:1px;background:var(--line);margin:10px 6px}
.side .grupo-lbl{padding:10px 6px 6px}
.selcard{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;background:#fff;padding:11px 12px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left}
.selcard:hover{border-color:#d9d2c8}.selcard .n{font-weight:700;font-size:14px}.selcard .s{font-size:12px;color:var(--muted)}
.selcard .av{width:30px;height:30px;border-radius:50%;background:var(--magenta-deep);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;padding:0;border:0}
.fn .bobina-svg{flex:0 0 auto;margin:-6px 4px -6px -6px;filter:drop-shadow(0 2px 3px rgba(44,42,40,.18))}
.fil .bobina-svg{flex:0 0 auto;filter:drop-shadow(0 1px 2px rgba(44,42,40,.15))}
.selcard .av-icone{border-radius:10px;background:var(--magenta-soft,#FDE3EC);color:var(--magenta-deep,#8E1243)}
.status{padding:10px 8px 2px;font-size:13px}.status b{display:flex;align-items:center;gap:8px}.status b:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--good)}
.status.off b:before{background:#CFC8BE}.status span{display:block;color:var(--muted);margin:2px 0 0 16px}
.me{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;margin-top:18px}
@media(max-width:1100px){.me{grid-template-columns:1fr}}
.me .col{display:flex;flex-direction:column;gap:18px;min-width:0}
.bloco{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.bloco .bh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.bloco .bh .lbl{color:var(--ink);display:flex;align-items:center;gap:10px}
.bloco .bb{padding:14px 18px}
.atv{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}.atv:last-child{border-bottom:0}
.atv .ico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.atv .t{font-weight:600}.atv .s{font-size:12.5px;color:var(--muted)}.atv .e{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.projs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.pj{border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;min-width:0}.pj:hover{border-color:#d9d2c8}
.pj .th{height:120px;border-radius:10px;background:#F2EEE8;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#bdb5aa}
.pj .th img{width:100%;height:100%;object-fit:cover}.pj .n{font-weight:700;margin-top:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pj .s{font-size:12.5px;color:var(--muted)}
.pf{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.pf .ico{width:40px;height:40px;border-radius:11px;background:#F2EEE8;display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink2)}
.pf .t{font-weight:700}.pf .s{font-size:12.5px;color:var(--muted)}.pf .tag{margin-left:auto;white-space:nowrap}
.tracejado{display:block;width:calc(100% - 36px);margin:12px 18px 14px;border:1px dashed #DCD5CC;border-radius:12px;padding:10px;text-align:center;color:var(--ink2);font-weight:600;background:none}
.tracejado:hover{border-color:var(--magenta-deep);color:var(--magenta-deep)}
.fils{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.fil{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px;min-width:0}
.fil .reel{width:38px;height:38px;border-width:8px}.fil .n{font-size:12.5px;font-weight:700;line-height:1.25}.fil .s{font-size:11.5px;color:var(--muted)}
.dois2{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:18px}
.kv{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:14px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links button{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;font-weight:600;text-align:left}
.links button:hover{border-color:#d9d2c8}
/* Estoque de filamentos */
.etop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.etab{border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:20px;overflow:hidden}
.etab table{width:100%;border-collapse:collapse}
.etab th{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:16px 20px;border-bottom:1px solid var(--line)}
.etab td{padding:18px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
.etab .fn{display:flex;gap:12px;align-items:flex-start}.etab .fn .dot{width:18px;height:18px;margin-top:3px}
.etab .fn b{font-size:16px}.etab .fn .s{color:var(--ink2);font-size:13px;margin:2px 0 6px}
.etab .mat{display:inline-block;background:var(--rose);color:var(--magenta-deep);font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 9px}
.etab .loc b{display:block}.etab .loc span{color:var(--ink2);font-size:13px}
.etab .peso .bar{width:170px;margin-bottom:8px}.etab .peso span{display:block;color:var(--ink2);font-size:12.5px}
.etab .custo b{font-size:16px;display:block}.etab .custo span{color:var(--ink2);font-size:12.5px}
.etab .baixo{color:var(--warn);font-weight:600;font-size:13.5px}
.etab .pe{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;color:var(--ink2)}
.ekpis{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:16px;background:#fff;margin-top:20px}
@media(max-width:1000px){.ekpis{grid-template-columns:1fr 1fr}}
.ekpis>div{padding:20px 24px;border-right:1px solid var(--line)}.ekpis>div:last-child{border-right:0}
.ekpis span{font-size:13px;font-weight:600}.ekpis b{display:block;font-size:28px;font-weight:800;margin:4px 0}.ekpis small{color:var(--ink2);font-size:12.5px}
</style>
</head>
<body>
<div class="tela"><div class="app"><div class="corpo">
	<div class="side">
		<div class="lbl" style="padding:0 6px 8px">Perfis</div>
		<div id="topo"></div>
		<div id="menu"></div>
		<div style="margin-top:auto" id="conta"></div>
	</div>
	<div class="principal" id="tela"><div class="carregando">Carregando…</div></div>
</div></div></div>
<script src="ponte.js"></script>
<script>
var E = Filuna.esc;
// Menu da referência (Meu espaço, Projetos, Perfis de impressão, Filamentos, Configurações) e, abaixo, as ferramentas Filuna.
// Configurações não ficam aqui: estão na engrenagem da barra (Configurações do programa › Filuna).
var SECOES = [["visao", "Meu espaço"], ["modelos", "Projetos"], ["perfis", "Perfis de impressão"], ["estoque", "Filamentos"], ["historico", "Histórico"], ["painel", "Painel"]];
var FERRAMENTAS = [["fila", "Fila da Farm"], ["reparacao", "Reparação"], ["ofertas", "Ofertas"], ["ia", "IA Filuna"], ["loja", "Minha loja"]];
var st = { secao: "visao", prefs: null, catalogo: [], opcoes: {}, conversa: [] };
try { var h = (location.hash || "").slice(1); if (h) st.secao = h; } catch (e) {}

function botoes(l) {
	return l.map(function (s) { return '<button class="nav' + (s[0] == st.secao ? " on" : "") + '" data-s="' + s[0] + '">' + E(s[1]) + "</button>"; }).join("");
}
function menu() {
	document.getElementById("menu").innerHTML = botoes(SECOES) + '<div class="sep"></div><div class="lbl grupo-lbl">Ferramentas Filuna</div>' + botoes(FERRAMENTAS);
	document.querySelectorAll("#menu [data-s]").forEach(function (b) { b.onclick = function () { abrirSecao(b.dataset.s); }; });
	var imp = st.local || {};
	document.getElementById("topo").innerHTML =
		'<button class="selcard" id="perfilAtual"><span class="av av-icone" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="m3 13 9 5 9-5"/></svg></span><span style="min-width:0"><span class="n" style="display:block">' +
		E(st.perfilAtual || "Perfil de impressão") + '</span><span class="s">Perfil em uso na Preparação</span></span></button>' +
		'<button class="selcard" id="impAtual"><span style="min-width:0;flex:1"><span class="n" style="display:block">' + E(imp.impressora || "Impressora") +
		'</span><span class="s">Impressora 3D</span></span><span class="s">›</span></button>';
	document.getElementById("perfilAtual").onclick = function () { abrirSecao("perfis"); };
	document.getElementById("impAtual").onclick = function () { Filuna.nativo("aba.abrir", { aba: "prepare" }); };
	document.getElementById("conta").innerHTML = Filuna.temToken()
		? (Filuna.conexao().online ? '<div class="status"><b>Conectado</b>' : '<div class="status off"><b>Sem conexão</b>') + '<span id="nomeConta">' + E((st.conta && st.conta.nome) || "Conta Filuna") + '</span></div><button class="nav" id="sair" style="margin-top:4px;color:var(--ink2)">Sair desta conta</button>'
		: '<div class="status off"><b>Sem conta</b><span>Entre para ver seus dados</span></div>';
	var s = document.getElementById("sair"); if (s) s.onclick = function () { Filuna.sair().then(desenhar); };
}
function abrirSecao(id) {
	if (id == "loja") { location.href = "loja.html"; return; }
	st.secao = id; desenhar();
}
function iniciais() {
	return Promise.all([
		Filuna.nativo("impressora.atual").then(function (r) { st.local = r; }).catch(function () {}),
		Filuna.nativo("perfis.salvos").then(function (r) { st.perfis = r.perfis || []; st.perfilAtual = r.em_uso || ""; }).catch(function () { st.perfis = []; })
	]);
}

function el() { return document.getElementById("tela"); }
function titulo(lbl, t, sub) { return '<div class="lbl">' + E(lbl) + '</div><div class="h1" style="margin-top:6px">' + E(t) + "</div>" + (sub ? '<div class="sub">' + E(sub) + "</div>" : ""); }
function falha(e) { el().insertAdjacentHTML("beforeend", '<div class="erro">' + E(e.erro || e.message) + "</div>"); }
function precisaConta(texto) {
	if (Filuna.temToken()) return false;
	el().innerHTML = '<div id="lg"></div>'; Filuna.telaLogin(el().querySelector("#lg"), desenhar, texto); return true;
}
function prefs() {
	// Ajustadas na engrenagem (no computador); o que não foi ajustado aqui vem da conta.
	if (st.prefs) return Promise.resolve(st.prefs);
	return Filuna.prefs().then(function (v) { st.prefs = v; return v; });
}

function desenhar() {
	if (st.secao == "loja") { location.href = "loja.html"; return; }
	menu();
	({ visao: visao, estoque: estoque, historico: historico, painel: painel, perfis: perfis, fila: fila, modelos: modelos, reparacao: reparacao, ofertas: ofertas, ia: ia }[st.secao] || visao)();
}

var ICONE = {
	caixa: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/></svg>',
	relogio: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
	pasta: '<svg class="ic" viewBox="0 0 24 24"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>',
	linhas: '<svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h10M4 17h13"/></svg>',
	bobina: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3"/></svg>',
	pessoa: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-3.5 4-5 7-5s6 1.5 7 5"/></svg>',
	hex: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 3.5l7.5 4.25v8.5L12 20.5l-7.5-4.25v-8.5z"/></svg>',
	mais: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
	baixar: '<svg class="ic" viewBox="0 0 24 24"><path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14"/></svg>',
	engrenagem: '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v2.5M12 18v2.5M3.5 12H6M18 12h2.5M6 6l1.8 1.8M16.2 16.2 18 18M6 18l1.8-1.8M16.2 7.8 18 6"/></svg>',
	loja: '<svg class="ic" viewBox="0 0 24 24"><path d="M4.5 9.5 6 4.5h12l1.5 5M4.5 9.5h15v10h-15zM9 19.5v-5h6v5"/></svg>'
};
var CORES_ATV = ["#7B4BFF", "#C2185B", "#2F6FE4", "#FF6B1A"];

function visao() {
	el().innerHTML = '<div class="h1">Meu espaço</div><div class="sub">Bem-vindo(a) ao seu espaço de trabalho pessoal.</div>' +
		'<div class="me"><div class="col">' +
		'<div class="bloco"><div class="bh"><span class="lbl">' + ICONE.relogio + 'Atividade recente</span><a data-s="modelos">Ver tudo</a></div><div id="atv"><div class="carregando">Carregando…</div></div></div>' +
		'<div class="bloco"><div class="bh"><span class="lbl">' + ICONE.pasta + 'Meus projetos</span><a data-s="modelos">Ver todos os projetos</a></div><div class="bb"><div id="projs" class="projs"></div></div></div>' +
		'</div><div class="col">' +
		'<div class="bloco"><div class="bh"><span class="lbl">' + ICONE.linhas + 'Perfis salvos</span><a data-s="perfis">Gerenciar</a></div><div id="pfs"></div>' +
		'<button class="tracejado" id="novoPerfil">+ Novo perfil</button></div>' +
		'<div class="bloco"><div class="bh"><span class="lbl">' + ICONE.bobina + 'Biblioteca de filamentos</span><a data-s="estoque">Ver estoque</a></div><div class="bb"><div id="fils" class="fils"></div></div>' +
		'<button class="tracejado" id="novaBobina">+ Adicionar filamento</button></div>' +
		'<div class="dois2"><div class="bloco"><div class="bh"><span class="lbl">' + ICONE.pessoa + 'Status da conta</span></div><div class="bb" id="contaBox"></div></div>' +
		'<div class="bloco"><div class="bh"><span class="lbl">Links rápidos</span></div><div class="bb"><div class="links">' +
		'<button id="lNovo">' + ICONE.pasta + 'Novo projeto</button><button id="lImp">' + ICONE.baixar + 'Importar modelo</button>' +
		'<button id="lConfig">' + ICONE.engrenagem + 'Configurações</button><button data-s="loja">' + ICONE.loja + 'Minha loja</button></div></div></div></div>' +
		"</div></div>";
	el().querySelectorAll("[data-s]").forEach(function (b) { b.onclick = function () { abrirSecao(b.dataset.s); }; });
	document.getElementById("lConfig").onclick = function () { Filuna.nativo("preferencias.abrir"); };
	document.getElementById("lNovo").onclick = function () { Filuna.nativo("aba.abrir", { aba: "prepare" }); };
	document.getElementById("lImp").onclick = function () { Filuna.nativo("projeto.importar"); };
	document.getElementById("novoPerfil").onclick = function () { Filuna.nativo("aba.abrir", { aba: "prepare" }); };
	document.getElementById("novaBobina").onclick = function () { novaBobina(); };

	Filuna.nativo("projetos.recentes").then(function (r) {
		var l = r.projetos || [];
		document.getElementById("atv").innerHTML = l.length ? l.slice(0, 4).map(function (p, k) {
			return '<div class="atv" data-k="' + k + '"><span class="ico" style="background:' + CORES_ATV[k % 4] + '">' + ICONE.caixa + '</span><div style="min-width:0"><div class="t">Projeto “' + E(p.nome) +
				'” aberto</div><div class="s">' + E(p.quando || "") + "</div></div></div>"; }).join("")
			: '<div class="vazio" style="margin:14px 18px">Nenhuma atividade ainda. Abra ou importe um modelo para começar.</div>';
		document.getElementById("projs").innerHTML = l.length ? l.slice(0, 3).map(function (p, k) {
			return '<div class="pj" data-k="' + k + '"><div class="th">' + (p.imagem ? '<img src="' + E(p.imagem) + '" alt="">' : ICONE.caixa.replace('class="ic"', 'style="width:56px;height:56px"')) +
				'</div><div class="n">' + E(p.nome) + '</div><div class="s">' + E(p.quando || "") + "</div></div>"; }).join("")
			: '<div class="vazio" style="grid-column:1/-1">Nenhum projeto aberto ainda.</div>';
		el().querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () { Filuna.nativo("projeto.abrir", { caminho: l[+b.dataset.k].caminho }); }; });
	}, function () { document.getElementById("atv").innerHTML = '<div class="vazio" style="margin:14px 18px">Abra o Filuna Slicer para ver sua atividade.</div>'; });

	var pf = st.perfis || [];
	document.getElementById("pfs").innerHTML = pf.length ? pf.slice(0, 3).map(function (p, k) {
		return '<div class="pf"><span class="ico">' + ICONE.hex + '</span><div style="min-width:0"><div class="t">' + E(p.nome) + '</div><div class="s">' + E(p.base ? "Baseado em " + p.base : "Perfil próprio") +
			'</div></div><span class="tag">' + (p.atual ? "Em uso" : "Personalizado") + "</span></div>"; }).join("")
		: '<div class="vazio" style="margin:14px 18px 0">Nenhum perfil salvo. Ajuste a impressão na Preparação e clique em salvar.</div>';

	var cx = document.getElementById("contaBox"), fs = document.getElementById("fils");
	Filuna.nativo("estoque.listar").then(function (r) {

// Estoque local (banco do Filuna, 02-DADOS §4–§5): funciona sem conta e sem internet; a conta sincroniza depois.
function bobinaParaLinha(x) {

	return { id: x.id, numero: x.codigo, material: t.material || "", cor: t.cor_hex || "#C2185B", cor_nome: t.cor_nome || "", marca: t.marca || "",

		na_impressora: imp, prateleira: /^prateleira:/.test(x.local || "") ? x.local.slice(11) : "", estado: x.estado, estimado: x.estimado, nova: x.estado == "lacrada" };
}
function estoque() {
	el().innerHTML = '<div class="etop"><div><div class="h1">Estoque de filamentos</div><div class="sub">Gerencie seus filamentos, quantidades e custos. A baixa é automática ao fim de cada impressão.</div></div>' +

}
var MATERIAIS = ["PLA", "PETG", "ABS", "TPU", "ASA", "PA", "PC"];
function novaBobina() {
	el().innerHTML = '<div class="etop"><div><a class="voltar" id="voltar" style="color:var(--ink2);font-weight:600;font-size:13.5px">‹ Filamentos</a><div class="h1">Adicionar filamento</div>' +
		'<div class="sub">Cadastre uma ou várias bobinas iguais de uma vez. Fica guardado neste computador e funciona sem internet.</div></div></div>' +

		'<input type="text" id="fHex" value="#FFFFFF" maxlength="7" style="width:96px" aria-label="Cor em hexadecimal"><input type="text" id="fNomeCor" placeholder="Nome da cor (ex.: Branco)"></div></div>' +

		'<div class="campo"><label>Situação</label><select id="fSit"><option value="nova">Nova, lacrada</option><option value="balanca">Já usada — pesei na balança</option><option value="fracao">Já usada — não tenho balança</option></select></div>' +
		'<div class="campo" id="cQtd"><label>Quantidade de bobinas iguais</label><input type="number" id="fQtd" min="1" max="200" step="1" value="1"></div>' +
		'<div class="campo" id="cBal" style="display:none"><label>Peso na balança, com a bobina (g)</label><input type="number" id="fBal" min="0" step="1"></div>' +
		'<div class="campo" id="cFra" style="display:none"><label>Quanto ainda tem</label><select id="fFra"><option value="0.75">Uns ¾</option><option value="0.5">Metade</option><option value="0.25">Uns ¼</option></select></div>' +
		'</div><div class="bb" style="border-top:1px solid var(--line);display:flex;gap:12px;align-items:center"><button class="btn primario" id="fSalvar">Salvar</button><button class="btn" id="fCancelar">Cancelar</button><span id="fMsg"></span></div></div>';

	fHex.oninput = function () { var v = fHex.value.trim(); if (!/^#/.test(v)) v = "#" + v; if (/^#[0-9a-fA-F]{6}$/.test(v)) { fCor.value = v; pintar(v); } };

		} else { dados.usada = true; dados.restante_g = peso * Number(v("fFra")); dados.estimado = true; }

// Cor da barra de peso: cores muito claras (branco, natural) ficam visíveis com um cinza quente.
function corBarra(c) { var r = Filuna.corRgb(c || "#C2185B"); return (0.299 * r[0] + 0.587 * r[1] + 0.114 * r[2]) / 255 > 0.85 ? "#9A948C" : c; }
function tabelaEstoque() {
	var b = (st.bobinas || []).slice(), ord = st.ordem || "nome", lim = st.lim, alerta = st.alerta;
	var nome = function (x) { return (x.material + " " + x.cor_nome).toLowerCase(); };
	b.sort(function (a, c) { return ord == "peso" ? a.restante_g - c.restante_g : ord == "numero" ? (a.numero < c.numero ? -1 : 1) : nome(a) < nome(c) ? -1 : nome(a) > nome(c) ? 1 : 0; });
	var ativas = b.filter(function (x) { return x.estado == "lacrada" || x.estado == "em_uso"; });
	var custo = function (x) { return x.preco_kg ? x.restante_g / 1000 * x.preco_kg : null; };
	var baixo = function (x) { return alerta && (x.estado == "lacrada" || x.estado == "em_uso") && x.restante_g < lim; };
	var naImp = ativas.filter(function (x) { return x.na_impressora; }).length, total = 0, inicial = 0, valor = 0, temValor = false, nBaixo = 0;
	ativas.forEach(function (x) { total += x.restante_g; inicial += x.peso_inicial_g || 0; var c = custo(x); if (c != null) { valor += c; temValor = true; } if (baixo(x)) nBaixo++; });
	var ESTADO = { lacrada: "lacrada", em_uso: "em uso", vazia: "vazia", descartada: "arquivada" };
	var linhas = b.map(function (x, k) {
		var pct = x.peso_inicial_g ? Math.max(0, Math.min(100, x.restante_g / x.peso_inicial_g * 100)) : 0, c = custo(x);
		return "<tr><td><div class='fn'>" + Filuna.bobinaSVG(x.cor, 52) + "<div><b>" + E(x.material + " " + x.cor_nome) + "</b><div class='s'>" +
			E((x.marca ? x.marca + " · " : "") + "Bobina " + String(x.numero).replace("-", "\u2011") + " · " + (ESTADO[x.estado] || x.estado)) + "</div><span class='mat'>" + E(x.material) + "</span></div></div></td>" +
			"<td class='loc'>" + (x.na_impressora ? "<b>Na impressora</b><span>" + E(x.na_impressora) + "</span>" : x.prateleira ? "<b>Guardada</b><span>" + E(x.prateleira) + "</span>" : "<b>Guardada</b><span>Fora das impressoras</span>") + "</td>" +
			"<td class='peso'><div class='bar'><i style='width:" + pct + "%;background:" + E(corBarra(x.cor)) + "'></i></div>" + Filuna.gramas(x.restante_g) + " / " + Filuna.gramas(x.peso_inicial_g) +
			"<span>" + Math.round(pct) + "% restante" + (x.estimado ? " · estimado, pese para confirmar" : "") + "</span></td>" +
			"<td class='custo'>" + (c != null ? "<b>" + Filuna.reais(c) + "</b><span>" + Filuna.reais(x.preco_kg / 1000) + " /g</span>" : "<b>—</b><span>sem preço cadastrado</span>") + "</td>" +
			"<td>" + (baixo(x) ? "<span class='baixo'>Estoque baixo<br>&lt; " + E(lim) + " g</span>" : "") + "</td>" +
			"<td style='white-space:nowrap'>" + (x.estado == "descartada" ? "" : "<button class='btn peq' data-pesar='" + k + "'>Pesar</button> <button class='btn peq' data-etq='" + k + "'>Etiqueta</button> <button class='btn peq' data-arq='" + k + "'>Arquivar</button>") + "</td></tr>";
	}).join("");
	document.getElementById("r").outerHTML = '<div id="r">' + (b.length ?
		'<div class="etab"><table><tr><th>Filamento</th><th>Localização</th><th>Peso restante</th><th>Custo</th><th></th><th></th></tr>' + linhas + "</table>" +
		'<div class="pe"><span>' + ativas.length + (ativas.length == 1 ? " bobina ativa" : " bobinas ativas") + '</span><label class="linha" style="gap:8px"><input type="checkbox" id="arq"' + (st.verArquivadas ? " checked" : "") + '> Mostrar vazias e arquivadas</label>' +
		'<label class="linha" style="gap:8px">Ordenar por: <select id="ordem" style="width:auto">' +
		[["nome", "Nome"], ["peso", "Peso restante"], ["numero", "Código da bobina"]].map(function (o) { return '<option value="' + o[0] + '"' + (o[0] == ord ? " selected" : "") + ">" + o[1] + "</option>"; }).join("") + "</select></label></div></div>" +
		'<div class="ekpis"><div><span>Bobinas ativas</span><b>' + ativas.length + "</b><small>" + naImp + " na impressora · " + (ativas.length - naImp) + " guardada(s)</small></div>" +
		"<div><span>Peso total restante</span><b>" + Filuna.gramas(total) + "</b><small>de " + Filuna.gramas(inicial) + "</small></div>" +
		"<div><span>Valor total estimado</span><b>" + (temValor ? Filuna.reais(valor) : "—") + "</b><small>" + (temValor ? "pelo preço por kg das bobinas" : "cadastre o preço por kg") + "</small></div>" +
		"<div><span>Alerta de estoque baixo</span><b" + (nBaixo ? " style='color:var(--warn)'" : "") + ">" + (alerta ? nBaixo : "—") + "</b><small>" + (alerta ? "abaixo de " + E(lim) + " g" : "alerta desligado nas Configurações") + "</small></div></div>"
		: '<div class="vazio" style="margin-top:20px">Nenhuma bobina cadastrada. Use “Adicionar filamento”.</div>') + "</div>";
	var o = document.getElementById("ordem"); if (o) o.onchange = function () { st.ordem = o.value; tabelaEstoque(); };
	var a = document.getElementById("arq"); if (a) a.onchange = function () { st.verArquivadas = a.checked; estoque(); };
	el().querySelectorAll("[data-pesar]").forEach(function (x) { x.onclick = function () { pesarBobina(b[+x.dataset.pesar]); }; });
	el().querySelectorAll("[data-etq]").forEach(function (x) { x.onclick = function () { etiquetaBobina(b[+x.dataset.etq]); }; });
	el().querySelectorAll("[data-arq]").forEach(function (x) { x.onclick = function () { arquivarBobina(b[+x.dataset.arq]); }; });
}

// Histórico de impressões (02-DADOS §7): onde a impressora não avisa o fim, o fim é marcado aqui.
var ESTADO_TRAB = { fatiado: "Fatiado", enviado: "Enviado", imprimindo: "Imprimindo", concluido: "Concluído", cancelado: "Cancelado", falhou: "Falhou" };
function historico() {
	el().innerHTML = titulo("Meu espaço", "Histórico de impressões", "Cada envio para imprimir fica aqui. Quando a impressora não avisa o fim, marque como terminou para dar baixa nas bobinas.") +
		'<div id="r" class="carregando" style="margin-top:18px">Carregando…</div>';
	Filuna.nativo("historico.listar", { limite: 100 }).then(function (r) {
		var l = r.trabalhos || [];
		document.getElementById("r").outerHTML = '<div id="r" style="margin-top:18px">' + (l.length ? '<div class="etab"><table><tr><th>Quando</th><th>Produto</th><th>Impressora</th><th>Filamento</th><th>Tempo</th><th>Situação</th><th></th></tr>' +
			l.map(function (t, k) {
				var aberto = t.estado == "fatiado" || t.estado == "enviado" || t.estado == "imprimindo";
				var dt = new Date(t.criado_em), quando = isNaN(dt) ? "" : dt.toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
				return "<tr><td>" + E(quando) + "</td><td><b>" + E(t.produto || "Sem nome") + "</b></td><td>" + E(t.impressora || "—") + "</td>" +
					"<td>" + Filuna.gramas(aberto ? t.previsto_g : t.real_g) + (t.estimado ? " <span class='s'>(estimado)</span>" : "") + "</td>" +
					"<td>" + (t.tempo_real_s != null ? Filuna.tempo(t.tempo_real_s) : t.tempo_previsto_s != null ? Filuna.tempo(t.tempo_previsto_s) : "—") + "</td>" +
					"<td>" + E(ESTADO_TRAB[t.estado] || t.estado) + "</td>" +
					"<td style='white-space:nowrap'>" + (aberto ? "<button class='btn peq primario' data-ok='" + k + "'>Terminou</button> <button class='btn peq' data-cancel='" + k + "'>Cancelada</button> <button class='btn peq' data-falha='" + k + "'>Falhou</button>" : "") + "</td></tr>";
			}).join("") + "</table></div>" : '<div class="vazio">Nenhuma impressão registrada. Ao exportar ou enviar uma mesa com bobinas cadastradas, o Filuna pergunta de quais bobinas sai o filamento.</div>') + "</div>";
		var fim = function (t, tipo) {
			var dados = { id: t.id, fim: tipo };
			if (tipo != "concluido") {
				var p = window.prompt("Quanto chegou a imprimir, em %? (ex.: 50)");
				if (p === null || p === "" || isNaN(Number(p.replace(",", ".")))) return;
				dados.progresso = Math.max(0, Math.min(100, Number(p.replace(",", "."))));
			}
			Filuna.nativo("trabalho.finalizar", dados).then(historico, function (e) { falha(e); });
		};
		el().querySelectorAll("[data-ok]").forEach(function (x) { x.onclick = function () { fim(l[+x.dataset.ok], "concluido"); }; });
		el().querySelectorAll("[data-cancel]").forEach(function (x) { x.onclick = function () { fim(l[+x.dataset.cancel], "cancelado"); }; });
		el().querySelectorAll("[data-falha]").forEach(function (x) { x.onclick = function () { fim(l[+x.dataset.falha], "falhou"); }; });
	}, function (e) { document.getElementById("r").outerHTML = '<div id="r" class="erro">' + E(e.erro || e.message) + "</div>"; });
}

// Painel (02-DADOS §9–§11): desperdício, produtos mais impressos, previsão de falta e manutenção.
function painel() {
	el().innerHTML = titulo("Meu espaço", "Painel", "Números deste computador, calculados das impressões registradas.") +
		'<div class="me" style="margin-top:18px"><div class="col"><div class="bloco"><div class="bh"><span class="lbl">Desperdício nos últimos 30 dias</span></div><div class="bb" id="pDes"><div class="carregando">Carregando…</div></div></div>' +
		'<div class="bloco"><div class="bh"><span class="lbl">Produtos mais impressos</span></div><div class="bb" id="pTop"></div></div></div>' +
		'<div class="col"><div class="bloco"><div class="bh"><span class="lbl">Vai faltar filamento?</span></div><div class="bb" id="pPrev"><div class="carregando">Carregando…</div></div></div>' +
		'<div class="bloco"><div class="bh"><span class="lbl">Manutenção</span></div><div class="bb" id="pMan"><div class="carregando">Carregando…</div></div></div></div></div>';
	Filuna.nativo("painel.resumo", { dias: 30 }).then(function (r) {
		document.getElementById("pDes").innerHTML = r.consumo_g > 0
			? "<div style='font-size:28px;font-weight:800'>" + (r.taxa != null ? Math.round(r.taxa * 100) + "%" : "—") + "</div><div class='s'>" + Filuna.gramas(r.desperdicio_g) + " de " + Filuna.gramas(r.consumo_g) + " (purga e falhas)</div>"
			: "<div class='vazio'>Sem impressões terminadas no período.</div>";
		var p = r.produtos || [];
		document.getElementById("pTop").innerHTML = p.length ? p.map(function (x) { return "<div class='linha' style='justify-content:space-between;padding:6px 0'><b>" + E(x.nome || "Sem nome") + "</b><span>" + x.concluidos + "× · " + Filuna.gramas(x.gramas) + "</span></div>"; }).join("")
			: "<div class='vazio'>Nenhum produto impresso ainda.</div>";
	}, function (e) { document.getElementById("pDes").innerHTML = '<div class="erro">' + E(e.erro || e.message) + "</div>"; });
	Filuna.nativo("previsao.filamentos").then(function (r) {
		var l = (r.previsoes || []);
		document.getElementById("pPrev").innerHTML = l.length ? l.map(function (x) {
			var t = x.tipo || {}, nome = (t.material || "") + " " + (t.cor_nome || "");
			var txt = !x.dados_suficientes ? "dados insuficientes (precisa de 3 impressões e 7 dias)" : x.sem_consumo ? "sem consumo recente" :
				x.alerta ? "acaba em " + x.dias_de_estoque.toFixed(1).replace(".", ",") + " dias · faltam " + Filuna.gramas(x.falta_g) + " para 7 dias" : "dá para " + Math.floor(x.dias_de_estoque) + " dias";
			return "<div class='linha' style='justify-content:space-between;padding:6px 0'><span><span class='dot' style='display:inline-block;width:10px;height:10px;border-radius:50%;background:" + E(t.cor_hex || "#ccc") + "'></span> <b>" + E(nome) + "</b></span><span" + (x.alerta ? " style='color:var(--warn);font-weight:700'" : "") + ">" + E(txt) + "</span></div>";
		}).join("") : "<div class='vazio'>Cadastre bobinas para ver a previsão.</div>";
	}, function (e) { document.getElementById("pPrev").innerHTML = '<div class="erro">' + E(e.erro || e.message) + "</div>"; });
	Filuna.nativo("manutencao.listar").then(function (r) {
		var l = r.impressoras || [];
		document.getElementById("pMan").innerHTML = l.length ? l.map(function (i) {
			return "<div style='padding:6px 0'><b>" + E(i.nome) + "</b> <span class='s'>" + i.horas.toFixed(1).replace(".", ",") + " h de impressão</span>" +
				(i.regras.length ? i.regras.map(function (g) {
					return "<div class='linha' style='justify-content:space-between;padding:4px 0'><span>" + E(g.nome) + " · a cada " + g.intervalo_h + " h</span><span>" + E(g.situacao) +
						(g.situacao != "em dia" ? "" : " · faltam " + Math.max(0, g.faltam_h).toFixed(0) + " h") + " <button class='btn peq' data-man='" + E(g.id) + "'>Feita</button></span></div>";
				}).join("") : "<div class='s'>Sem regras. <a data-nova='" + E(i.id) + "'>Adicionar limpeza do bico a cada 100 h</a></div>") + "</div>";
		}).join("") : "<div class='vazio'>As impressoras aparecem aqui depois da primeira impressão registrada.</div>";
		el().querySelectorAll("[data-man]").forEach(function (x) { x.onclick = function () { Filuna.nativo("manutencao.registrar", { id: x.dataset.man }).then(painel, function (e) { falha(e); }); }; });
		el().querySelectorAll("[data-nova]").forEach(function (x) { x.onclick = function () { Filuna.nativo("manutencao.adicionar", { impressora_id: x.dataset.nova, nome: "Limpar o bico", intervalo_h: 100 }).then(painel, function (e) { falha(e); }); }; });
	}, function (e) { document.getElementById("pMan").innerHTML = '<div class="erro">' + E(e.erro || e.message) + "</div>"; });
}

function fila() {
	if (precisaConta("Entre para ver a fila da sua Farm.")) return;
	el().innerHTML = titulo("Farm", "Fila de impressão", "Mesas organizadas por cor e impressora.") + '<div id="r" class="carregando">Carregando…</div>';
	Filuna.api("GET", "/fila").then(function (r) {
		var l = r.trabalhos || r.fila || [];
		document.getElementById("r").outerHTML = '<div class="linha" style="margin:14px 0"><button class="btn primario" id="novoP">Novo pedido na Farm</button><button class="btn" data-aba="filuna.dispositivo">Ver impressoras</button></div>' +
			(l.length ? '<div class="card" style="padding:6px 8px"><table class="l"><tr><th>Pedido</th><th>Mesa</th><th>Cor</th><th>Impressora</th><th>Tempo</th><th>Situação</th></tr>' + l.map(function (t) {
				return "<tr><td><b>" + E(t.descricao || ("Pedido " + (t.pedido || ""))) + "</b><div class='ajuda'>" + E(t.arquivo || "") + "</div></td><td>" + E((t.mesa || t.numero || 1) + "/" + (t.mesas || t.total || 1)) +
					"</td><td><span class='dot' style='background:" + E(t.cor || t.cor_hex || "#ccc") + "'></span> " + E((t.material || "") + " " + (t.cor_nome || "")) + "</td><td>" + E((t.impressora && t.impressora.nome) || "—") +
					"</td><td>" + Filuna.tempo(t.tempo_s) + "</td><td>" + E({aguardando:"Na fila",enviado:"Enviado",imprimindo:"Imprimindo"}[t.estado] || t.estado || "") + (t.pode_iniciar ? " · pode começar" : "") + "</td></tr>";
			}).join("") + "</table></div>" : '<div class="vazio">A fila está vazia.</div>');
		document.getElementById("novoP").onclick = function () { Filuna.abrirLink("https://filuna3d.com/farm/novo"); };
		el().querySelectorAll("[data-aba]").forEach(function (b) { b.onclick = function () { Filuna.nativo("aba.abrir", { aba: b.dataset.aba }); }; });
	}, function (e) { document.getElementById("r").innerHTML = '<div class="erro">' + E(e.erro) + "</div>"; });
}

function modelos() {
	el().innerHTML = titulo("Projetos", "Meus projetos", "Os projetos ficam no seu computador; nada sobe para o site.") +
		'<div class="linha" style="margin:14px 0"><button class="btn primario" id="abrir">Abrir ou importar modelo</button></div><div id="rec" class="grade"></div>';
	document.getElementById("abrir").onclick = function () { Filuna.nativo("projeto.importar"); };
	recentes(document.getElementById("rec"));
}

function reparacao() {
	el().innerHTML = titulo("Reparação", "Conferir e consertar modelos", "Procura buracos, faces invertidas e partes soltas nos modelos da mesa atual e conserta.") + '<div id="r" class="carregando">Analisando…</div>';
	Filuna.nativo("modelo.objetos").then(function (r) {
		var l = r.objetos || [], ruins = l.filter(function (o) { return o.bordas_abertas > 0 || o.reparados > 0; }).length;
		document.getElementById("r").outerHTML = (l.length ? '<div class="card" style="margin-top:14px;padding:6px 8px"><table class="l"><tr><th>Modelo</th><th>Faces</th><th>Bordas abertas</th><th>Erros já corrigidos</th><th>Situação</th></tr>' +
			l.map(function (o) { var ok = !o.bordas_abertas; return "<tr><td><b>" + E(o.nome) + "</b></td><td>" + o.faces + "</td><td>" + o.bordas_abertas + "</td><td>" + o.reparados +
				"</td><td>" + (ok ? '<span class="pill ok">Fechado</span>' : '<span class="pill alerta">Precisa reparar</span>') + "</td></tr>"; }).join("") + "</table></div>" +
			'<div class="linha" style="margin-top:14px"><button class="btn primario" id="rep"' + (ruins ? "" : " disabled") + ">Reparar " + (ruins ? ruins + " modelo(s)" : "") + '</button><span class="ajuda">Um modelo com bordas abertas pode sair com falhas ou nem fatiar.</span></div>'
			: '<div class="vazio" style="margin-top:14px">Nenhum modelo na mesa. Importe um modelo na Preparação.</div>');
		var b = document.getElementById("rep"); if (b) b.onclick = function () { b.disabled = true; Filuna.nativo("modelo.reparar").then(reparacao, function (e) { falha(e); }); };
	}, falha);
}

function ofertas() {
	if (precisaConta("Entre para ver as ofertas escolhidas para você.")) return;
	el().innerHTML = titulo("Ofertas", "Filamento e peças em oferta", "Reunidas pelo Filuna. Filtros em Configurações (engrenagem) › Ofertas.") + '<div id="r" class="carregando">Buscando…</div>';
	Filuna.api("GET", "/ofertas").then(function (r) {
		var l = r.ofertas || [];
		document.getElementById("r").outerHTML = !r.ativas ? '<div class="vazio" style="margin-top:14px">Ofertas desligadas. <a id="lig">Ligar em Configurações</a></div>' :
			l.length ? '<div class="grade" style="margin-top:14px">' + l.map(function (o, k) {
				return '<div class="oferta" data-k="' + k + '"><img src="' + E(o.imagem) + '" alt=""><div class="i"><div class="t">' + E(o.titulo) + '</div><div class="p">' + Filuna.reais(o.preco) + "</div>" +
					'<div class="k">' + E(o.loja) + (o.preco_kg ? " · " + Filuna.reais(o.preco_kg) + "/kg" : "") + "</div></div></div>"; }).join("") + "</div>"
			: '<div class="vazio" style="margin-top:14px">Nenhuma oferta com esses filtros agora.</div>';
		el().querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () { Filuna.abrirLink(l[+b.dataset.k].url); }; });
		var lg = document.getElementById("lig"); if (lg) lg.onclick = function () { Filuna.nativo("preferencias.abrir"); };
	}, function (e) { document.getElementById("r").innerHTML = '<div class="erro">' + E(e.erro) + "</div>"; });
}

function ia() {
	if (precisaConta("Entre para usar a IA Filuna.")) return;
	el().innerHTML = titulo("IA Filuna", "Pergunte sobre a sua impressão", "Ela recebe o que está na Preparação: impressora, filamento e o resultado do fatiamento.") + '<div id="r" class="carregando">Carregando…</div>';
	Promise.all([Filuna.api("GET", "/ia/estado"), prefs()]).then(function (r) {
		var e = r[0], prov = st.provedor || e.provedor;
		document.getElementById("r").outerHTML = '<div class="prov">' +
			'<button data-p="chatgpt" class="' + (prov == "chatgpt" ? "on" : "") + '"><b>Meu ChatGPT</b><span>' + (e.chatgpt_ligado ? "Ligado (chave …" + E(e.chatgpt_final) + ") · cobrado na sua conta OpenAI" : "Ligue com a sua chave da OpenAI") + "</span></button>" +
			'<button data-p="claude" class="' + (prov == "claude" ? "on" : "") + '"><b>Claude Filuna</b><span>' + (e.claude_disponivel ? e.creditos_claude + " crédito(s) · 1 por pergunta" : "Indisponível agora") + "</span></button></div>" +
			(prov == "chatgpt" && !e.chatgpt_ligado ? '<div class="card" style="margin-bottom:14px"><div class="campo"><label>Chave da OpenAI (sk-…)</label><input type="password" id="chave" placeholder="sk-..."></div>' +
				'<div class="ajuda" style="margin-bottom:10px">Fica guardada criptografada na sua conta. Crie em platform.openai.com › API keys.</div><button class="btn primario" id="ligar">Ligar meu ChatGPT</button> <a id="pegar">Onde pego a chave?</a></div>' : "") +
			(prov == "claude" && e.claude_disponivel && e.creditos_claude < 1 ? '<div class="erro">Sem créditos do Claude Filuna. <a id="comprar">Adquirir créditos</a></div>' : "") +
			'<div class="card"><div class="chat" id="chat">' + (st.conversa.length ? st.conversa.map(function (m) { return '<div class="msg ' + m.de + '">' + E(m.t) + "</div>"; }).join("")
				: '<div class="ajuda">Exemplos: “Por que meu PETG está fazendo fios?” · “Esse tempo de impressão está bom para esta peça?” · “Que suporte uso aqui?”</div>') + "</div>" +
			'<div class="linha" style="margin-top:12px"><textarea id="perg" rows="2" placeholder="Escreva sua pergunta"></textarea><button class="btn primario" id="env">Perguntar</button></div>' +
			(e.chatgpt_ligado ? '<div class="ajuda" style="margin-top:8px"><a id="desligar">Desligar meu ChatGPT</a></div>' : "") + "</div>";
		el().querySelectorAll("[data-p]").forEach(function (b) { b.onclick = function () { st.provedor = b.dataset.p; Filuna.api("POST", "/preferencias", { valores: { "ia.provedor": b.dataset.p } }).then(function (x) { st.prefs = x.valores; ia(); }); }; });
		var lg = document.getElementById("ligar"); if (lg) lg.onclick = function () { Filuna.api("POST", "/ia/chave", { chave: document.getElementById("chave").value.trim() }).then(ia, falha); };
		var pg = document.getElementById("pegar"); if (pg) pg.onclick = function () { Filuna.abrirLink("https://platform.openai.com/api-keys"); };
		var cp = document.getElementById("comprar"); if (cp) cp.onclick = function () { Filuna.abrirLink("https://filuna3d.com/planos"); };
		var dl = document.getElementById("desligar"); if (dl) dl.onclick = function () { Filuna.api("POST", "/ia/chave", { chave: "" }).then(ia, falha); };
		document.getElementById("env").onclick = function () {
			var p = document.getElementById("perg").value.trim(), b = this; if (!p) return;
			b.disabled = true; st.conversa.push({ de: "eu", t: p }); st.conversa.push({ de: "ia", t: "Pensando…" }); ia_chat();
			Filuna.nativo("contexto.ia").catch(function () { return {}; }).then(function (c) {
				return Filuna.api("POST", "/ia", { pergunta: p, contexto: c.texto || "", provedor: prov });
			}).then(function (r) { st.conversa[st.conversa.length - 1].t = r.resposta; ia(); }, function (x) { st.conversa[st.conversa.length - 1].t = x.erro || x.message; ia(); });
		};
	}, function (e) { document.getElementById("r").innerHTML = '<div class="erro">' + E(e.erro) + "</div>"; });
}
function ia_chat() { var c = document.getElementById("chat"); if (c) { c.innerHTML = st.conversa.map(function (m) { return '<div class="msg ' + m.de + '">' + E(m.t) + "</div>"; }).join(""); c.scrollTop = 1e6; } }

Filuna.iniciar().then(function () {
	return Promise.all([iniciais(), Filuna.nativo("secao.pendente").then(function (r) { if (r.secao) st.secao = r.secao; }).catch(function () {})]);
}).then(desenhar);
Filuna.ouvir("secao", function (d) { if (d.secao) { Filuna.nativo("secao.pendente").catch(function () {}); st.secao = d.secao; desenhar(); } });
Filuna.ouvir("preferencias", function () { st.prefs = null; if (st.secao == "estoque") desenhar(); });
Filuna.ouvir("conexao", function () { menu(); });
Filuna.ouvir("sincronizado", function () { if (st.secao == "estoque" || st.secao == "visao") desenhar(); });
Filuna.ouvir("estoque", function () { if (st.secao == "estoque" || st.secao == "visao" || st.secao == "historico" || st.secao == "painel") desenhar(); });
Filuna.ouvir("mostrar", function () { iniciais().then(function () { if (st.secao == "visao" || st.secao == "perfis") desenhar(); else menu(); }); });
</script>
