<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo 3D</title>
<!-- página do modelo igual à do site (templates/modelos3d/modelo.html + filuna.css, publico.css, modelos3d.css) -->
<link rel="stylesheet" href="m3d/filuna.css">
<link rel="stylesheet" href="m3d/publico.css">
<link rel="stylesheet" href="m3d/modelos3d.css">
<style>
main.m3d{padding-top:28px}
.m3d-trilha a{cursor:pointer}
.fl-voltar{margin-bottom:16px}
.fl-msg{margin:0 0 14px;padding:12px 16px;border-radius:12px;font-weight:600;font-size:15px}
.fl-msg.ok{background:var(--good-soft);color:#155F40}.fl-msg.erro{background:var(--warn-soft);color:#8A2C06}
.fl-trava{font-size:13.5px;color:var(--ink2);margin-top:10px}
</style>
</head>
<body>
<main class="m3d wrap" id="pagina"><p style="padding:60px 0;color:var(--ink2)">Carregando o modelo…</p></main>
<script src="ponte.js"></script>
<script src="voltar.js"></script>
<script src="m3d/three.js"></script>
<script src="m3d/orbit.js"></script>
<script src="m3d/visualizador.js"></script>
<script>
(function () {
"use strict";
var E = Filuna.esc, slug = (location.search.match(/slug=([^&]+)/) || [])[1] || "", D = null, atual = null, vista = null, placas = [];
var calmo = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
// filtros do template do site
function tempo(s) { s = +s || 0; var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60); return (h ? h + " h " : "") + m + " min"; }
function brl(v) { return Filuna.reais(+v || 0); }   // na moeda da conta (real ou dólar)
function g(v) { return (+v || 0).toFixed(1).replace(".", ",").replace(",0", "") + " g"; }
function gramasJS(v) { return (Math.round(v * 10) / 10).toString().replace(".", ",") + " g"; }
function pct(a, tot) { return Math.round(a / tot * 10000) / 100; }

function render() {
	var m = D.m, r = D.resumos[0] || null, lic = D.licenca, h = "";
	h += FilunaVoltar.html("Voltar aos modelos 3D", { href: "modelos-3d.html" });
	h += '<nav class="m3d-trilha" aria-label="Você está em"><a href="modelos-3d.html">Modelos 3D</a><span aria-hidden="true">/</span><span>' + E(m.categoria) + "</span></nav>";
	h += '<div id="msg"></div><div class="m3d-topo"><section class="m3d-palco" aria-label="Modelo em 3D"><div class="m3d-vista" id="vista"></div><div class="m3d-carregando" id="carregando"><span class="barra"><i id="carga"></i></span>Montando o modelo em 3D</div><p class="m3d-dica" id="dica" hidden>Arraste para girar e role para aproximar</p>';
	if (r && r.mesas.length > 1) {
		h += '<div class="m3d-mesas" role="tablist" aria-label="Mesas do projeto" id="mesas">';
		r.mesas.forEach(function (me, i) { h += '<button type="button" role="tab" class="m3d-mesa" data-i="' + i + '" aria-selected="' + (i == 0) + '"><span class="pontos">' + me.cores.map(function (c) { return '<i style="--c:' + E(c) + '"></i>'; }).join("") + '</span><span class="t"><b>Mesa ' + me.numero + '</b><span class="n">' + E(me.nome) + "</span></span></button>"; });
		h += "</div>";
	}
	h += '</section><aside class="m3d-ficha"><h1>' + E(m.titulo) + '</h1><p class="m3d-resumo">' + E(m.resumo) + "</p>";
	if (D.resumos.length > 1) h += '<div class="m3d-imp" role="radiogroup" aria-label="Impressora usada no cálculo">' + D.resumos.map(function (x, i) { return '<label><input type="radio" name="imp" value="' + i + '"' + (i == 0 ? " checked" : "") + "><span>" + E(x.nome) + "</span></label>"; }).join("") + "</div>";
	if (r) {
		var tot = r.preco || 1;
		h += '<div class="m3d-bloco m3d-tempo"><span class="rot">Tempo de impressão</span><strong class="grande" data-v="tempo">' + tempo(r.tempo_s) + '</strong><span class="sub" data-v="config">' + r.mesas.length + " " + (r.mesas.length == 1 ? "mesa" : "mesas") + ", bico " + E(r.bico) + ", camada " + E(r.camada) + "</span></div>" +
			'<dl class="m3d-numeros"><div><dt>Filamento</dt><dd data-v="gramas">' + g(r.gramas) + '</dd></div><div><dt>Purga</dt><dd data-v="purga">' + g(r.purga) + '</dd></div><div><dt>Cores</dt><dd data-v="ncores">' + r.cores.length + '</dd></div><div><dt>Trocas de cor</dt><dd data-v="trocas">' + r.trocas + "</dd></div></dl>" +
			'<ul class="m3d-bobinas" data-v="bobinas" aria-label="Filamentos">' + r.cores.map(function (c) { return '<li><span class="bobina" style="--c:' + E(c.hex) + '"></span><span><b>' + E(c.nome || c.hex) + "</b> " + E(m.material) + '</span><span class="q">' + g(c.gramas) + "</span></li>"; }).join("") + "</ul>" +
			'<div class="m3d-bloco m3d-preco"><div class="m3d-pv"><span class="rot">Preço de venda sugerido</span><strong class="grande" data-v="preco">' + brl(r.preco) + '</strong></div><div class="barra-custo" data-v="barra" aria-hidden="true">' +
			'<i class="c1" style="width:' + pct(r.custos.material, tot) + '%"></i><i class="c2" style="width:' + pct(r.custos.energia, tot) + '%"></i><i class="c3" style="width:' + pct(r.custos.mao_obra, tot) + '%"></i><i class="c4" style="width:' + pct(r.custos.manutencao, tot) + '%"></i><i class="c5" style="width:' + pct(r.lucro, tot) + '%"></i></div>' +
			'<dl class="custos"><div><dt><i class="c1"></i>Filamento</dt><dd data-v="c_material">' + brl(r.custos.material) + '</dd></div><div><dt><i class="c2"></i>Energia</dt><dd data-v="c_energia">' + brl(r.custos.energia) + '</dd></div><div><dt><i class="c3"></i>Mão de obra</dt><dd data-v="c_mao_obra">' + brl(r.custos.mao_obra) +
			'</dd></div><div><dt><i class="c4"></i>Desgaste da impressora</dt><dd data-v="c_manutencao">' + brl(r.custos.manutencao) + '</dd></div><div class="tot"><dt>Custo de produção</dt><dd data-v="custo">' + brl(r.custo_total) + '</dd></div><div class="lucro"><dt><i class="c5"></i>Lucro</dt><dd data-v="lucro">' + brl(r.lucro) + "</dd></div></dl>" +
			'<p class="nota">' + (D.custos_proprios ? "Com os seus custos." : "Com os custos padrão do Filuna.") + ' <a href="#" data-site="/calculadora">Ajustar na calculadora</a></p></div>';
	}
	h += '<div class="m3d-acao" id="imprimir"><button type="button" class="btn btn-mag m3d-btn" id="btImprimir">' + (lic ? "Imprimir neste Filuna Slicer" : "Assine o Filuna para imprimir") + "</button>";
	if (lic) h += '<div class="m3d-lic-ok" role="status"><span class="ic" aria-hidden="true">✓</span><span><b>Licença ativa</b> no ' + (lic.plano == "Administrador" ? E(lic.plano) : "plano " + E(lic.plano)) + (lic.ate ? ", até " + E(lic.ate) : "") + ". Você pode imprimir e vender as peças deste modelo.</span></div>" +
		'<a class="btn btn-line m3d-btn m3d-baixar-lic" href="#" data-site="/modelos-3d/' + E(m.slug) + '/licenca.pdf"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Baixar minha licença (PDF)</a>';
	else h += '<a class="btn btn-line m3d-btn m3d-licenca" href="#" data-site="/modelos-3d/' + E(m.slug) + '/licenca">Adquirir licença</a>';
	h += '<p>O modelo abre na Preparação já com as mesas, as cores e o perfil da impressora, pronto para imprimir.</p><p class="fl-trava">Modelos do catálogo Filuna são para imprimir: não podem ser salvos nem exportados (projeto, 3MF, STL, G-code ou arquivo fatiado).</p></div></aside></div>';
	if (r) {
		h += '<section class="m3d-sec" aria-labelledby="t-mesas"><h2 id="t-mesas">Mesa a mesa</h2><div class="m3d-tabela" role="table" aria-label="Consumo por mesa"><div class="cab" role="row"><span role="columnheader">Mesa</span><span role="columnheader">Cor</span><span role="columnheader">Filamento</span><span role="columnheader">Purga</span><span role="columnheader">Camadas</span><span role="columnheader">Tempo</span></div><div data-v="tabela">' +
			r.mesas.map(function (me) { return '<div class="lin" role="row"><span role="cell"><b>' + me.numero + "</b> " + E(me.nome) + '</span><span role="cell">' + me.cores.map(function (c) { return '<i class="ponto" style="--c:' + E(c) + '"></i>'; }).join("") + '</span><span role="cell">' + g(me.gramas) + '</span><span role="cell">' + g(me.purga) + '</span><span role="cell">' + me.camadas + '</span><span role="cell">' + tempo(me.tempo_s) + "</span></div>"; }).join("") + "</div></div>" +
			(r.trocas == 0 && r.cores.length > 1 ? '<p class="m3d-obs">Cada cor imprime na sua mesa: a impressora não troca de filamento no meio da peça e não gasta purga de troca.</p>' : "") + "</section>";
	}
	h += '<div class="m3d-duas"><section class="m3d-sec" aria-labelledby="t-sobre"><h2 id="t-sobre">Sobre o modelo</h2>' + D.paragrafos.map(function (p) { return "<p>" + E(p) + "</p>"; }).join("") +
		(D.montagem.length ? '<h3>Montagem</h3><ul class="m3d-lista">' + D.montagem.map(function (p) { return "<li>" + E(p) + "</li>"; }).join("") + "</ul>" : "") + '<p class="m3d-obs">Vender as peças impressas está incluído nos planos Maker e Negócio.</p></section>' +
		'<section class="m3d-sec" aria-labelledby="t-como"><h2 id="t-como">Como chega à sua impressora</h2><ol class="m3d-passos"><li><span><b>Toque em Imprimir</b> neste Filuna Slicer. Imprimir os modelos faz parte dos planos Maker e Negócio.</span></li>' +
		'<li><span><b>O modelo abre na Preparação</b> já com as mesas, as cores e o perfil da impressora.</span></li><li><span><b>Confira e mande imprimir.</b> O consumo entra sozinho no seu estoque de bobinas.</span></li></ol></section></div>';
	document.getElementById("pagina").innerHTML = h;
	atual = D.resumos[0];
	ligar();
	montar3d();
}

function montar3d() {   // modelos3d.js do site
	var caixa = document.getElementById("vista"), barra = document.getElementById("carga");
	fetch(D.vista).then(function (resp) {
		if (!resp.ok) throw new Error("sem vista");
		var total = +resp.headers.get("content-length") || 0, leitor = resp.body.getReader(), partes = [], lido = 0;
		function ler() {
			return leitor.read().then(function (x) {
				if (x.done) return;
				partes.push(x.value); lido += x.value.length;
				if (total && barra) barra.style.width = Math.min(100, lido / total * 100) + "%";
				return ler();
			});
		}
		return ler().then(function () {
			vista = window.criarVisualizador(caixa);
			return vista.carregar(new File(partes, "vista.3mf"));
		}).then(function () {
			placas = Array.from(new Set(vista.pecas().map(function (p) { return p.placa - 1; }))).sort(function (a, b) { return a - b; });
			if (placas.length && placas[0] !== 0) vista.mostrarPlaca(placas[0]);
			caixa.classList.add("pronta");
			document.getElementById("carregando").hidden = true;
			var dica = document.getElementById("dica"); if (dica) dica.hidden = false;
		});
	}).catch(function () { var c = document.getElementById("carregando"); if (c) c.textContent = "Não foi possível montar o modelo em 3D."; });
}

function contar(el, de, para, fmt) {
	if (calmo || de === para) { el.textContent = fmt(para); return; }
	var t0 = performance.now(), dur = 320;
	function passo(t) { var k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(de + (para - de) * e); if (k < 1) requestAnimationFrame(passo); }
	requestAnimationFrame(passo);
}
function aplicar(r) {
	var q = function (k) { return document.querySelector('[data-v="' + k + '"]'); };
	var anim = function (k, de, para, fmt) { var el = q(k); if (el) contar(el, de, para, fmt); };
	anim("tempo", atual.tempo_s, r.tempo_s, function (v) { return tempo(Math.round(v)); });
	anim("gramas", atual.gramas, r.gramas, gramasJS); anim("purga", atual.purga, r.purga, gramasJS);
	anim("preco", atual.preco, r.preco, brl); anim("custo", atual.custo_total, r.custo_total, brl); anim("lucro", atual.lucro, r.lucro, brl);
	["material", "energia", "mao_obra", "manutencao"].forEach(function (k) { anim("c_" + k, atual.custos[k], r.custos[k], brl); });
	q("trocas").textContent = r.trocas; q("ncores").textContent = r.cores.length;
	var barra = q("barra");
	if (barra) { var tot = r.preco || 1, vs = [r.custos.material, r.custos.energia, r.custos.mao_obra, r.custos.manutencao, r.lucro]; Array.prototype.forEach.call(barra.children, function (i, n) { i.style.width = (vs[n] / tot * 100) + "%"; }); }
	var bob = q("bobinas"); if (bob) bob.querySelectorAll("li").forEach(function (li, n) { var c = r.cores[n]; if (c) li.querySelector(".q").textContent = gramasJS(c.gramas); });
	var tab = q("tabela");
	if (tab) tab.querySelectorAll(".lin").forEach(function (lin, n) { var me = r.mesas[n]; if (!me) return; var c = lin.children; c[2].textContent = gramasJS(me.gramas); c[3].textContent = gramasJS(me.purga); c[4].textContent = me.camadas; c[5].textContent = tempo(me.tempo_s); });
	atual = r;
}
function msg(t, ok) { document.getElementById("msg").innerHTML = '<div class="fl-msg ' + (ok ? "ok" : "erro") + '">' + E(t) + "</div>"; window.scrollTo(0, 0); }
function ligar() {
	var mesas = document.getElementById("mesas");
	if (mesas) mesas.addEventListener("click", function (e) {
		var b = e.target.closest(".m3d-mesa"); if (!b) return;
		mesas.querySelectorAll(".m3d-mesa").forEach(function (x) { x.setAttribute("aria-selected", x === b ? "true" : "false"); });
		if (vista) vista.mostrarPlaca(placas[+b.dataset.i] != null ? placas[+b.dataset.i] : +b.dataset.i);
	});
	document.querySelectorAll(".m3d-imp input").forEach(function (inp) { inp.addEventListener("change", function () { aplicar(D.resumos[+inp.value]); }); });
	document.querySelectorAll("[data-site]").forEach(function (a) { a.onclick = function (e) { e.preventDefault(); Filuna.abrirLink("https://filuna3d.com" + a.dataset.site); }; });
	var bt = document.getElementById("btImprimir");
	bt.onclick = function () {
		if (!D.licenca) { Filuna.abrirLink(D.logado ? "https://filuna3d.com/conta/plano" : "https://filuna3d.com/#planos"); return; }
		bt.disabled = true; bt.textContent = "Abrindo na Preparação…";
		Filuna.nativo("modelo3d.imprimir", { slug: D.m.slug, titulo: D.m.titulo }).catch(function (e) { bt.disabled = false; bt.textContent = "Imprimir neste Filuna Slicer"; msg("Não foi possível abrir: " + ((e && (e.erro || e.message)) || "erro"), false); });
	};
}
Filuna.ouvir("modelo3d.aberto", function () { var bt = document.getElementById("btImprimir"); if (bt) { bt.disabled = false; bt.textContent = "Imprimir neste Filuna Slicer"; } msg("Modelo aberto na Preparação, pronto para imprimir.", true); });
Filuna.ouvir("modelo3d.erro", function (d) { var bt = document.getElementById("btImprimir"); if (bt) { bt.disabled = false; bt.textContent = "Imprimir neste Filuna Slicer"; } msg("Não foi possível abrir: " + (d.erro || "erro"), false); });
Filuna.ouvir("secao", function (d) { if (Filuna.abrirModeloPedido(d.secao)) Filuna.nativo("secao.pendente").catch(function () {}); });
Filuna.iniciar().then(function () {
	var url = "https://filuna3d.com/api/slicer/v1/modelos3d/" + slug + "/pagina";
	return (Filuna.temToken() ? Filuna.api("GET", "/modelos3d/" + slug + "/pagina") : fetch(url).then(function (r) { return r.json(); }));
}).then(function (d) { if (d.erro) throw d; D = d; render(); })
	.catch(function (e) { document.getElementById("pagina").innerHTML = FilunaVoltar.html("Voltar aos modelos 3D", { href: "modelos-3d.html" }) + '<p style="padding:24px 0 60px">' + E((e && e.erro) || "Sem conexão com o site.") + "</p>"; });
})();
</script>
</body>
</html>
