<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paramétricos</title>
<link rel="stylesheet" href="base.css">
<style>
/* modelo aprovado: FILUNA/design/visual-c/ui/modelos-parametricos.html */
.wrap{padding:30px 34px}
.wrap h1{font-size:30px;font-weight:800;margin:0}
.sub{color:var(--ink2);font-size:15px;margin-top:8px}
.chips{display:flex;gap:10px;margin:22px 0;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;height:44px;padding:0 16px;border:1px solid var(--line);border-radius:11px;font-size:14.5px;font-weight:500;background:#fff;cursor:pointer;font-family:inherit;color:var(--ink)}
.chip.on{background:#C2185B;color:#fff;border-color:#C2185B;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.m{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;font-family:inherit;padding:0;color:var(--ink);transition:border-color .15s,box-shadow .15s,transform .15s}
.m:hover{border-color:#F6C6D8;box-shadow:0 14px 30px rgba(60,50,40,.12);transform:translateY(-2px)}
.m:focus-visible{outline:3px solid #F6C6D8;outline-offset:2px}
/* foto do card: palco escuro das ferramentas, sempre 3:2, a foto preenche a área */
.thumb{position:relative;width:100%;aspect-ratio:3/2;display:flex;align-items:center;justify-content:center;color:#5A5560;background:#17161A;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s,transform .35s}
.thumb img.ok{opacity:1}
.m:hover .thumb img{transform:scale(1.04)}
.sp{position:absolute;top:10px;right:10px;font-size:11.5px;font-weight:700;color:#fff;background:#C2185B;border-radius:999px;padding:4px 10px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.sp.bloq{color:#2C2A28;background:#F1EEE9}
.b{padding:13px 16px 15px;border-top:1px solid var(--line);flex:1}
.n{font-size:15.5px;font-weight:700;line-height:1.25}
.s{font-size:12px;color:var(--ink2);margin-top:3px;font-weight:600}
.d{font-size:12.5px;line-height:1.4;color:var(--ink2);margin-top:7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.aviso{margin:14px 0;padding:12px 14px;border-radius:12px;background:#FFF8F0;color:var(--ink2)}
.vazio{padding:40px;text-align:center;color:var(--ink2);border:1px dashed var(--line);border-radius:14px}
</style>
</head>
<body>
<div class="wrap" id="conteudo">
  <div class="chips" id="tipos" style="margin:0 0 14px"></div>
  <h1 id="titulo">Modelos paramétricos</h1><div class="sub" id="subt">Personalize cada modelo com parâmetros: a peça é gerada aqui no seu computador e vai direto para a mesa da Preparação.</div>
  <div class="chips" id="c"></div>
  <div id="msg"></div>
  <div class="grid" id="g"><div class="vazio">Carregando os modelos…</div></div>
</div>
<script src="ponte.js"></script>
<script>
var E = Filuna.esc, todos = [], itens = [], cat = "Todos", tipo = "parametrico";
var TIPOS = { parametrico: ["Paramétricos", "Modelos paramétricos", "Personalize cada modelo com parâmetros: a peça é gerada aqui no seu computador e vai direto para a mesa da Preparação."],
	ferramenta: ["Ferramentas", "Ferramentas", "Ferramentas da Filuna que rodam aqui no computador (como no site): o resultado vai direto para a mesa da Preparação."] };
function escolherTipo(t) { tipo = TIPOS[t] ? t : "parametrico"; cat = "Todos"; itens = todos.filter(function (i) { return i.tipo == tipo; }); desenhar(); }
var ICONE = '<svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>';
function desenhar() {
	document.getElementById("tipos").innerHTML = Object.keys(TIPOS).map(function (t) { return '<button class="chip' + (t == tipo ? " on" : "") + '" data-tipo="' + t + '">' + TIPOS[t][0] + "</button>"; }).join("");
	document.querySelectorAll("[data-tipo]").forEach(function (b) { b.onclick = function () { escolherTipo(b.dataset.tipo); }; });
	document.getElementById("titulo").textContent = TIPOS[tipo][1]; document.getElementById("subt").textContent = TIPOS[tipo][2];
	var cats = ["Todos"];
	itens.forEach(function (i) { if (i.categoria && cats.indexOf(i.categoria) < 0) cats.push(i.categoria); });
	document.getElementById("c").innerHTML = cats.map(function (c) { return '<button class="chip' + (c == cat ? " on" : "") + '" data-c="' + E(c) + '">' + E(c) + "</button>"; }).join("");
	document.querySelectorAll("[data-c]").forEach(function (b) { b.onclick = function () { cat = b.dataset.c; desenhar(); }; });
	var l = itens.filter(function (i) { return cat == "Todos" || i.categoria == cat; });
	document.getElementById("g").innerHTML = l.length ? l.map(function (i, k) {
		return '<button class="m" data-k="' + itens.indexOf(i) + '"><div class="thumb">' + ICONE + (i.liberado ? (i.novo ? '<span class="sp">Novo</span>' : "") : '<span class="sp bloq">Plano</span>') +
			'</div><div class="b"><div class="n">' + E(i.nome) + '</div><div class="s">' + E(i.categoria || (tipo == "ferramenta" ? "Ferramenta" : "Paramétrico")) +
			" · " + E(i.versao) + "</div>" + (i.descricao ? '<div class="d">' + E(primeiraFrase(i.descricao)) + "</div>" : "") + "</div></button>";
	}).join("") : '<div class="vazio">' + (tipo == "ferramenta" ? "Nenhuma ferramenta liberada para a sua conta ainda." : "Nenhum modelo paramétrico liberado para a sua conta ainda.") + "</div>";
	document.querySelectorAll("[data-k]").forEach(function (b) { b.onclick = function () { abrir(itens[+b.dataset.k]); }; porFoto(b, itens[+b.dataset.k]); });
}
function primeiraFrase(t) { var p = String(t).split(/(?<=[.!?])\s/)[0]; return p.length > 20 ? p : String(t); }
// A foto do card vem do servidor com a conta do cliente; fica guardada enquanto a tela está aberta.
var fotos = {};
function porFoto(card, i) {
	if (!i.miniatura) return;
	if (!fotos[i.miniatura]) fotos[i.miniatura] = Filuna.imagem(i.miniatura).then(function (b) { return URL.createObjectURL(b); });
	fotos[i.miniatura].then(function (url) {
		var img = new Image(), palco = card.querySelector(".thumb");
		img.alt = ""; img.onload = function () { var ic = palco.querySelector("svg"); if (ic) ic.remove(); img.className = "ok"; };
		img.src = url; palco.insertBefore(img, palco.firstChild);
	}, function () { delete fotos[i.miniatura]; });
}
function abrir(i) {
	var m = document.getElementById("msg");
	if (!i.liberado || !i.url) { m.innerHTML = '<div class="aviso">' + E(i.mensagem || "Este modelo não está liberado no seu plano.") + "</div>"; return; }
	m.innerHTML = '<div class="aviso">Abrindo ' + E(i.nome) + "…</div>";
	Filuna.nativo("parametrico.abrir", { id: i.id, versao: i.versao, sha256: i.sha256, url: i.url, entrada: i.entrada || "index.html" })
		.catch(function (e) { m.innerHTML = '<div class="aviso">Não abriu: ' + E((e && (e.erro || e.message)) || "erro") + "</div>"; });
}
function carregar() {
	if (!Filuna.temToken()) { Filuna.telaLogin(document.getElementById("conteudo"), carregar, "Entre na sua conta Filuna para usar os paramétricos."); return; }
	Filuna.api("GET", "/recursos").then(function (r) {
		todos = r.itens || [];
		escolherTipo(tipo);
	}, function (e) { document.getElementById("g").innerHTML = '<div class="vazio">' + E(e.erro || "Sem conexão.") + "</div>"; });
}
Filuna.iniciar().then(function () { return Filuna.nativo("secao.pendente").then(function (r) { if (r.secao == "ferramentas") tipo = "ferramenta"; }).catch(function () {}); }).then(carregar);
Filuna.ouvir("secao", function (d) { Filuna.nativo("secao.pendente").catch(function () {}); escolherTipo(d.secao == "ferramentas" ? "ferramenta" : "parametrico"); });
Filuna.ouvir("conta", carregar);
Filuna.ouvir("parametrico.erro", function (d) { document.getElementById("msg").innerHTML = '<div class="aviso">Não abriu: ' + E(d.erro || "erro") + "</div>"; });
</script>
</body>
</html>
