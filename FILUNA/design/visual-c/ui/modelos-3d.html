<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.bigtabs{display:flex;gap:8px;padding:16px 22px 0}
.bt{padding:13px 0;width:210px;text-align:center;border:1px solid var(--line);border-bottom:none;border-radius:12px 12px 0 0;font-size:16px;color:var(--ink2);font-weight:500;background:#FCFAF7}
.bt.on{background:var(--magenta-deep);color:#fff;font-weight:700;border-color:var(--magenta-deep)}
.filters{display:flex;gap:12px;padding:16px 22px;border-top:1px solid var(--line)}
.flt{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border:1px solid var(--line);border-radius:11px;font-size:14.5px;font-weight:500}
.flt .ic{color:var(--magenta-deep)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:4px 22px 22px}
.m{border:1px solid var(--line);border-radius:14px;padding:8px 8px 14px;background:#fff}
.m .thumb{height:170px;background:linear-gradient(145deg,#FBE9EF,#F4D3DE);color:#C9476E}
.m .h{display:flex;align-items:center;gap:8px;margin:12px 8px 0;font-size:15.5px;font-weight:700}.m .h .hash{color:var(--magenta-deep)}.m .h .star{margin-left:auto;color:var(--magenta-deep)}
.m .d{margin:8px 8px 0;font-size:13px;color:var(--ink2);line-height:1.5;height:40px}
.meta{display:flex;margin:12px 8px 0;font-size:13px;gap:14px}.meta>div{flex:1}.meta .r{display:flex;align-items:center;gap:8px;margin-top:6px}
.meta .ic{width:17px;height:17px;color:var(--magenta-deep)}.meta .dotm{width:13px;height:13px;border-radius:50%;background:var(--magenta);flex:none}
.meta .vs{width:1px;background:var(--line);flex:none}
