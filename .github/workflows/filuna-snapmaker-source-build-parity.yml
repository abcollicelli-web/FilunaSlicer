name: Filuna Snapmaker U1 source-built portable vs official portable G-code parity (NO print, NO network to printers)
on:
  push:
    branches: [filuna/oem-portable-first-qa-20261106]
    paths:
      - "lab/snapmaker_source_build_parity.py"
      - ".github/workflows/filuna-snapmaker-source-build-parity.yml"
      - "FILUNA/fabricantes/snapmaker/module.json"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-snapmaker-source-parity
  cancel-in-progress: false
jobs:
  build-oem-portable-and-compare:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Checkout Filuna (lab scripts, fixtures, pinned U1 presets)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: filuna
      - name: Read pinned Snapmaker OEM source commit from the module manifest
        id: pin
        shell: pwsh
        run: |
          $m = Get-Content filuna/FILUNA/fabricantes/snapmaker/module.json | ConvertFrom-Json
          if ($m.source.repository -ne "https://github.com/Snapmaker/OrcaSlicer") { throw "UNEXPECTED_REPO $($m.source.repository)" }
          "commit=$($m.source.commit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "OEM_COMMIT=$($m.source.commit)"
      - name: Checkout pinned Snapmaker OEM source (full tree for a real build)
        uses: actions/checkout@v4
        with:
          repository: Snapmaker/OrcaSlicer
          ref: ${{ steps.pin.outputs.commit }}
          persist-credentials: false
          path: oem-src
      - name: Pin CMake 3.x (the 2.4.1-era deps require policy < 3.5)
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
      - uses: microsoft/setup-msbuild@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore OEM-source Windows deps cache (optional)
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: oem-src/deps/build/OrcaSlicer_dep
          key: snapmaker-oem-src-x64-msvc-deps-${{ steps.pin.outputs.commit }}
          fail-on-cache-miss: false
      - name: Build pinned OEM dependencies when cache is unavailable (inline, diagnostic)
        if: steps.deps.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: oem-src
        run: |
          if not exist deps\build mkdir deps\build
          cd deps\build
          set "DEPS=%CD%\OrcaSlicer_dep"
          cmake ../ -G "Visual Studio 17 2022" -A x64 -DDESTDIR="%DEPS%" -DCMAKE_BUILD_TYPE=Release -DDEP_DEBUG=OFF -DORCA_INCLUDE_DEBUG_INFO=OFF -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          if errorlevel 1 ( echo OEM_DEPS_CONFIGURE_FAILED & exit /b 1 )
          cmake --build . --config Release --target deps -- -m
          if errorlevel 1 ( echo OEM_DEPS_BUILD_FAILED & exit /b 1 )
      - name: Save OEM deps cache (never blocks)
        if: steps.deps.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: oem-src/deps/build/OrcaSlicer_dep
          key: snapmaker-oem-src-x64-msvc-deps-${{ steps.pin.outputs.commit }}
      - name: Configure and build the slicer from source WITHOUT the closed connect bundle
        shell: cmd
        working-directory: oem-src
        run: |
          @echo off
          set "DEPS=%CD%\deps\build\OrcaSlicer_dep"
          if not exist build mkdir build
          cd build
          REM NOTE: scripts/packaging/stage_connect_bundle.py is intentionally NOT run.
          REM That step downloads the proprietary Snapmaker/snapmaker_control binary.
          REM We build only the AGPL engine/GUI from source for a G-code parity proof.
          cmake .. -G "Visual Studio 17 2022" -A x64 -DBBL_RELEASE_TO_PUBLIC=1 -DORCA_TOOLS=ON -DCMAKE_PREFIX_PATH="%DEPS%/usr/local" -DOPENSSL_ROOT_DIR="%DEPS%/usr/local" -DCMAKE_INSTALL_PREFIX="./Snapmaker_Orca" -DCMAKE_BUILD_TYPE=Release -DWIN10SDK_PATH="%WindowsSdkDir%Include\%WindowsSDKVersion%\"
          if errorlevel 1 exit /b 1
          cmake --build . --config Release --target ALL_BUILD -- -m
          if errorlevel 1 exit /b 1
          cmake --build . --config Release --target install
          if errorlevel 1 exit /b 1
      - name: Locate the source-built portable executable
        shell: pwsh
        working-directory: oem-src
        run: |
          $exe=(Get-ChildItem -Recurse build/Snapmaker_Orca -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'orca|snapmaker' -and $_.FullName -notmatch 'uninstall|setup|update|crash|console|validator|profile' } | Select-Object -First 1)
          if (-not $exe) { $exe=(Get-ChildItem -Recurse build -Filter *.exe | Where-Object { $_.Name -match 'orca|snapmaker' -and $_.FullName -notmatch 'uninstall|setup|update|crash|console|validator|profile' } | Select-Object -First 1) }
          if (-not $exe) { Get-ChildItem -Recurse build -Filter *.exe | Select-Object FullName; throw "BUILT_EXE_NOT_FOUND" }
          "BUILT_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "BUILT_EXE=$($exe.FullName)"
      - name: Restore official Snapmaker 2.4.1 portable cache (optional)
        uses: actions/cache/restore@v4
        with:
          path: filuna/.oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Slice cube with both portables and compare normalized G-code
        shell: pwsh
        working-directory: filuna
        run: |
          git config --global core.autocrlf false
          python lab/snapmaker_source_build_parity.py --built-exe "$env:BUILT_EXE" --official-cache .oem-portable-cache --out qa-u1-source-parity
          $code=$LASTEXITCODE
          if (Test-Path qa-u1-source-parity/proof.json) { Get-Content qa-u1-source-parity/proof.json | Out-File -Append -FilePath $env:GITHUB_STEP_SUMMARY }
          if ($code -ne 0) { throw "SOURCE_BUILD_PARITY_SLICE_FAILED exit=$code" }
      - name: Save official portable cache (never blocks)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: filuna/.oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Archive proof, G-codes and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-u1-source-build-parity
          path: filuna/qa-u1-source-parity/
          retention-days: 30
          if-no-files-found: warn
