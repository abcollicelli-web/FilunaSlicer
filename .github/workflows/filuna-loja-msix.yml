name: Filuna Microsoft Store (pacote MSIX e envio)
run-name: "Store ${{ inputs.so_detalhes && 'detalhes' || inputs.so_status && 'estado' || inputs.so_listar && 'voos' || format('{0} {1}', inputs.versao, inputs.voo != '' && format('voo {0}', inputs.voo) || inputs.todos && 'todos' || 'sem voo') }}"
# Monta o pacote MSIX da Microsoft Store a partir de um build já compilado (compilação rápida ou completa) e, quando
# a conta da Store está ligada (segredos MSSTORE_*), envia para o Partner Center e manda para a certificação.
# Mesmo pacote que foi aprovado na mão: identidade AndersonBarroso.FilunaSlicer, manifesto e ícones de FILUNA/loja-msix.
# A Microsoft não aceita um envio novo enquanto outro está em certificação: dispare depois que o anterior sair.
#
#   gh workflow run filuna-loja-msix.yml --ref filuna/loja-voo -f run_id=<run do build> -f versao=2.5.90.0 -f voo=<flightId>
#   Neste ramo o envio vai para um voo de pacote (ex.: "Teste do dono") que a Store confirma existir; para todos os
#   clientes só com -f todos=true (e sem voo). Sem nenhum dos dois, nada é enviado.
#   -f so_listar=true só mostra os voos; -f so_status=true só diz o estado na Store.
#
# Cada etapa escreve uma linha "FILUNA_ESTADO {json}" (pacote montado, enviado, estado da submissão na Store). O vigia
# do servidor Filuna (/opt/filuna-loja/vigia.py) lê essas linhas, mostra em /admin/loja, avisa o dono no WhatsApp e,
# enquanto a certificação não acaba, dispara uma consulta so_status (Linux, 1 min) a cada 10 min.
#
# Segredos (Settings › Secrets and variables › Actions): MSSTORE_TENANT_ID, MSSTORE_SELLER_ID, MSSTORE_CLIENT_ID,
# MSSTORE_CLIENT_SECRET — do aplicativo do Microsoft Entra ligado ao Partner Center (função Gerente).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run da compilação com o programa (artefato *-windows-exe-*)"
        default: ""
      versao:
        description: "versão do pacote na Store, sempre maior que a anterior (ex.: 2.5.80.0)"
        default: ""
      enviar:
        description: "enviar para a Store e pedir certificação"
        type: boolean
        default: true
      voo:
        description: "id do voo de pacote (msstore flights list); obrigatório para enviar"
        default: ""
      todos:
        description: "enviar para TODOS os clientes (sem voo); só com a ordem do dono"
        type: boolean
        default: false
      so_listar:
        description: "só listar os voos de pacote da Store, sem enviar nada"
        type: boolean
        default: false
      so_status:
        description: "só dizer o estado na Store (do voo, se informado, e da versão pública), sem enviar nada"
        type: boolean
        default: false
      so_detalhes:
        description: "só mostrar as configurações da Store (visibilidade, mercados, pacotes) da versão publicada e do rascunho"
        type: boolean
        default: false
      ramo:
        description: "branch com o manifesto e os ícones (FILUNA/loja-msix)"
        default: "filuna/v1-teste-fisico"
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ (inputs.so_status || inputs.so_listar || inputs.so_detalhes) && format('filuna-loja-consulta-{0}', github.run_id) || 'filuna-loja-msix' }}
  cancel-in-progress: false
env:
  APP_ID: 9MV6C5DJ3201
  CONSULTA: ${{ inputs.so_status || inputs.so_listar || inputs.so_detalhes }}
jobs:
  msix:
    runs-on: ${{ (inputs.so_status || inputs.so_detalhes) && 'ubuntu-latest' || 'windows-2022' }}
    timeout-minutes: 90
    steps:
      - name: Conferir a versão
        if: env.CONSULTA != 'true'
        shell: pwsh
        run: |
          if ('${{ inputs.versao }}' -notmatch '^\d+\.\d+\.\d+\.0$') { throw "versão inválida: use quatro números terminando em .0 (ex.: 2.5.80.0)" }
          if ('${{ inputs.run_id }}' -notmatch '^\d+$') { throw "run_id inválido" }
      - uses: actions/checkout@v4
        if: env.CONSULTA != 'true'
        with:
          ref: ${{ inputs.ramo }}
          sparse-checkout: FILUNA/loja-msix
          persist-credentials: false
      - name: Baixar o programa compilado
        if: env.CONSULTA != 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: "*-windows-exe-*"
          path: artefato
      - name: Montar o pacote
        if: env.CONSULTA != 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem artefato -Recurse -Filter FilunaSlicer.exe | Select-Object -First 1
          if (-not $exe) { throw "FilunaSlicer.exe não está no artefato do run ${{ inputs.run_id }}" }
          $raiz = $exe.Directory.FullName
          $pacote = Join-Path $env:RUNNER_TEMP "pacote"
          New-Item -ItemType Directory -Force $pacote | Out-Null
          Copy-Item -Path (Join-Path $raiz '*') -Destination $pacote -Recurse
          Copy-Item -Path FILUNA/loja-msix/Assets -Destination (Join-Path $pacote 'Assets') -Recurse
          $m = (Get-Content FILUNA/loja-msix/AppxManifest.xml -Raw).Replace('@MSIX_VERSION@', '${{ inputs.versao }}')
          [IO.File]::WriteAllText((Join-Path $pacote 'AppxManifest.xml'), $m, (New-Object Text.UTF8Encoding($false)))
          $sdk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdk) { throw "makeappx.exe não encontrado no Windows SDK" }
          $saida = Join-Path $env:GITHUB_WORKSPACE "FilunaSlicer_${{ inputs.versao }}_x64.msix"
          & $sdk.FullName pack /d $pacote /p $saida /o /h SHA256 | Out-File makeappx.log
          if ($LASTEXITCODE -ne 0) { Get-Content makeappx.log -Tail 40; throw "makeappx falhou ($LASTEXITCODE)" }
          "MSIX=$saida" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $build = Get-Content (Join-Path $raiz 'filuna-build.json') -Raw -ErrorAction SilentlyContinue
          Write-Host ("FILUNA_ESTADO " + (@{ etapa = 'pacote'; estado = 'PacoteMontado'; versao = '${{ inputs.versao }}'; build = $build; bytes = (Get-Item $saida).Length } | ConvertTo-Json -Compress))
      - uses: actions/upload-artifact@v4
        if: env.CONSULTA != 'true'
        with:
          name: FilunaSlicer_${{ inputs.versao }}_x64_msix
          path: ${{ env.MSIX }}
          retention-days: 30
      - name: Conferir a conta da Store
        id: conta
        shell: pwsh
        env:
          T: ${{ secrets.MSSTORE_TENANT_ID }}
          S: ${{ secrets.MSSTORE_SELLER_ID }}
          C: ${{ secrets.MSSTORE_CLIENT_ID }}
          CS: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          $ok = $env:T -and $env:S -and $env:C -and $env:CS
          "ligada=$([int][bool]$ok)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if (-not $ok) { Write-Host "::notice::Conta da Store não ligada (segredos MSSTORE_*): o pacote ficou no artefato para enviar à mão no Partner Center." }
      - name: Instalar a ferramenta da Microsoft Store
        if: (inputs.enviar || inputs.so_listar) && !inputs.so_status && !inputs.so_detalhes && steps.conta.outputs.ligada == '1'
        uses: microsoft/microsoft-store-apppublisher@v1.1
      - name: Enviar para a Store e pedir certificação
        if: (inputs.enviar || inputs.so_listar) && !inputs.so_status && !inputs.so_detalhes && steps.conta.outputs.ligada == '1'
        shell: pwsh
        env:
          T: ${{ secrets.MSSTORE_TENANT_ID }}
          S: ${{ secrets.MSSTORE_SELLER_ID }}
          C: ${{ secrets.MSSTORE_CLIENT_ID }}
          CS: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          VOO: ${{ inputs.voo }}
        run: |
          msstore reconfigure --tenantId $env:T --sellerId $env:S --clientId $env:C --clientSecret $env:CS
          if ($LASTEXITCODE -ne 0) { throw "a Store recusou as credenciais (confira os segredos MSSTORE_*)" }
          # Trava: este caminho só envia para um voo de pacote que a Store confirma existir; nunca para todos.
          $lista = msstore flights list $env:APP_ID 2>&1 | Out-String
          Write-Host $lista
          if ('${{ inputs.so_listar }}' -eq 'true') { Write-Host "só listar os voos: nada enviado"; exit 0 }
          $voo = "$env:VOO".Trim()
          if ('${{ inputs.todos }}' -eq 'true') {
            # para todos os clientes: só pedido explícito (-f todos=true) e nunca junto com um voo. O msstore apaga a
            # submissão pendente (rascunho) e cria outra a partir da última publicada.
            if ($voo) { throw "peça voo OU todos, não os dois: nada enviado" }
            # Pela API REST (não pelo msstore): a submissão nova copia a publicada, e só assim dá para pôr a
            # visibilidade em Public (aparecer na busca da Store) junto com o pacote novo.
            try {
              $base = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID"
              $tok = (Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:T/oauth2/token" -Body @{ grant_type = 'client_credentials'; client_id = $env:C; client_secret = $env:CS; resource = 'https://manage.devcenter.microsoft.com' }).access_token
              $h = @{ Authorization = "Bearer $tok" }
              $app = Invoke-RestMethod -Uri $base -Headers $h
              if ($app.pendingApplicationSubmission) { throw "já há uma submissão pública pendente ($($app.pendingApplicationSubmission.id)): nada enviado" }
              Write-Host "criando a submissão..."
              $r = Invoke-WebRequest -Method Post -Uri "$base/submissions" -Headers $h -ContentType 'application/json' -Body '' -SkipHttpErrorCheck
              if ($r.StatusCode -ge 300) { throw "criar submissão: HTTP $($r.StatusCode) $($r.Content)" }
              $sub = $r.Content | ConvertFrom-Json
              Write-Host "submissão criada: $($sub.id) (visibilidade antes: $($sub.visibility))"
              $nome = Split-Path $env:MSIX -Leaf
              foreach ($p in $sub.applicationPackages) { $p.fileStatus = 'PendingDelete' }
              $sub.applicationPackages = @($sub.applicationPackages) + @([pscustomobject]@{ fileName = $nome; fileStatus = 'PendingUpload'; minimumDirectXVersion = 'None'; minimumSystemRam = 'None' })
              $sub.visibility = 'Public'
              $sub.targetPublishMode = 'Immediate'
              $corpo = $sub | ConvertTo-Json -Depth 20
              $r = Invoke-WebRequest -Method Put -Uri "$base/submissions/$($sub.id)" -Headers $h -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($corpo)) -SkipHttpErrorCheck
              if ($r.StatusCode -ge 300) { Invoke-RestMethod -Method Delete -Uri "$base/submissions/$($sub.id)" -Headers $h | Out-Null; throw "atualizar submissão: HTTP $($r.StatusCode) $($r.Content) (submissão apagada)" }
              $sub = $r.Content | ConvertFrom-Json
              Write-Host "submissão atualizada: visibilidade $($sub.visibility), pacotes $(($sub.applicationPackages | ForEach-Object { "$($_.fileName)=$($_.fileStatus)" }) -join ', ')"
              $dir = Join-Path $env:RUNNER_TEMP 'zipstore'; New-Item -ItemType Directory -Force $dir | Out-Null; Copy-Item $env:MSIX $dir
              $zip = Join-Path $env:RUNNER_TEMP 'envio.zip'; Add-Type -AssemblyName System.IO.Compression.FileSystem
              [IO.Compression.ZipFile]::CreateFromDirectory($dir, $zip, [IO.Compression.CompressionLevel]::Fastest, $false)
              # envio em blocos de 8 MB para o Azure Blob da Store (o PUT único tem limite de tamanho)
              $url = $sub.fileUploadUrl; $fs = [IO.File]::OpenRead($zip); $buf = New-Object byte[] (8MB); $ids = @(); $n = 0
              while (($lidos = $fs.Read($buf, 0, $buf.Length)) -gt 0) {
                $id = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(('{0:D6}' -f $n))); $n++
                $parte = if ($lidos -eq $buf.Length) { $buf } else { $buf[0..($lidos - 1)] }
                Invoke-RestMethod -Method Put -Uri "$url&comp=block&blockid=$([uri]::EscapeDataString($id))" -Headers @{ 'x-ms-version' = '2020-10-02' } -ContentType 'application/octet-stream' -Body ([byte[]]$parte) | Out-Null
                $ids += $id
              }
              $fs.Close()
              $lista = '<?xml version="1.0" encoding="utf-8"?><BlockList>' + (($ids | ForEach-Object { "<Latest>$_</Latest>" }) -join '') + '</BlockList>'
              Invoke-RestMethod -Method Put -Uri "$url&comp=blocklist" -Headers @{ 'x-ms-version' = '2020-10-02'; 'x-ms-blob-content-type' = 'application/zip' } -ContentType 'application/xml' -Body $lista | Out-Null
              Write-Host "pacote enviado: $n blocos, $((Get-Item $zip).Length) bytes"
              Invoke-RestMethod -Method Post -Uri "$base/submissions/$($sub.id)/commit" -Headers $h | Out-Null
              $st = Invoke-RestMethod -Uri "$base/submissions/$($sub.id)/status" -Headers $h
              Write-Host "commit pedido: $($st.status)"
              $global:LASTEXITCODE = 0
            } catch { Write-Host "erro no envio pela API: $($_.Exception.Message) $($_.ErrorDetails.Message)"; $global:LASTEXITCODE = 1 }
          } else {
            if ($voo -notmatch '^[0-9a-fA-F-]{36}$') { throw "voo ausente ou inválido: nada enviado (sem -f todos=true o envio é só para voo de pacote)" }
            # a tabela do msstore quebra o id em várias linhas: junta só a coluna FlightId e procura o id inteiro nela
            $ids = ($lista -split "`n" | ForEach-Object { $c = $_ -split '│'; if ($c.Count -gt 3) { $c[2].Trim() } }) -join ''
            if (-not $ids.Contains($voo)) { throw "o voo $voo não aparece na lista da Store: nada enviado" }
            msstore publish $env:MSIX -id $env:APP_ID -f $voo
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host ("FILUNA_ESTADO " + (@{ etapa = 'envio'; estado = 'EnvioFalhou'; voo = $voo } | ConvertTo-Json -Compress))
            throw "o envio falhou: se já há uma versão em certificação, espere ela sair e dispare de novo"
          }
          Write-Host ("FILUNA_ESTADO " + (@{ etapa = 'envio'; estado = 'Enviado'; voo = $voo } | ConvertTo-Json -Compress))
      - name: Estado na Store
        if: (inputs.so_status || (inputs.enviar && !inputs.so_listar && !inputs.so_detalhes)) && steps.conta.outputs.ligada == '1'
        shell: pwsh
        env:
          T: ${{ secrets.MSSTORE_TENANT_ID }}
          C: ${{ secrets.MSSTORE_CLIENT_ID }}
          CS: ${{ secrets.MSSTORE_CLIENT_SECRET }}
          VOO: ${{ inputs.voo }}
        run: |
          # API de envio da Store (manage.devcenter.microsoft.com): estado da submissão do voo (com voo) ou da versão
          # pública (sem voo). Uma leitura só: o registro do job só pode ser lido quando ele termina, então o vigia do
          # servidor dispara uma consulta nova (so_status) a cada 10 min enquanto a certificação não acaba.
          $base = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID"
          function Token { (Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:T/oauth2/token" -Body @{ grant_type = 'client_credentials'; client_id = $env:C; client_secret = $env:CS; resource = 'https://manage.devcenter.microsoft.com' }).access_token }
          function Ler($tok, $caminho) { Invoke-RestMethod -Uri "$base$caminho" -Headers @{ Authorization = "Bearer $tok" } }
          function Estado($tok) {
            $voo = "$env:VOO".Trim()
            if ($voo) {
              $f = Ler $tok "/flights/$voo"
              $sub = if ($f.pendingFlightSubmission) { $f.pendingFlightSubmission.id } else { $f.lastPublishedFlightSubmission.id }
              $s = Ler $tok "/flights/$voo/submissions/$sub/status"
              return @{ etapa = 'certificacao'; destino = 'voo'; voo = $voo; nome = $f.friendlyName; submissao = "$sub"; estado = "$($s.status)"; detalhes = $s.statusDetails }
            }
            $a = Ler $tok ""
            $sub = if ($a.pendingApplicationSubmission) { $a.pendingApplicationSubmission.id } else { $a.lastPublishedApplicationSubmission.id }
            $s = Ler $tok "/submissions/$sub/status"
            return @{ etapa = 'certificacao'; destino = 'todos'; submissao = "$sub"; estado = "$($s.status)"; detalhes = $s.statusDetails }
          }
          try { $e = Estado (Token) } catch { $e = @{ etapa = 'certificacao'; estado = 'ConsultaFalhou'; erro = "$($_.Exception.Message)" } }
          $e.em = (Get-Date).ToUniversalTime().ToString('o')
          Write-Host ("FILUNA_ESTADO " + ($e | ConvertTo-Json -Compress -Depth 6))
      - name: Detalhes na Store
        if: inputs.so_detalhes && steps.conta.outputs.ligada == '1'
        shell: pwsh
        env:
          T: ${{ secrets.MSSTORE_TENANT_ID }}
          C: ${{ secrets.MSSTORE_CLIENT_ID }}
          CS: ${{ secrets.MSSTORE_CLIENT_SECRET }}
        run: |
          # Só leitura: o que a Store guarda na versão publicada e no rascunho (visibilidade na busca, modo de publicação,
          # mercados, pacotes). Não muda nada.
          $base = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID"
          $tok = (Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:T/oauth2/token" -Body @{ grant_type = 'client_credentials'; client_id = $env:C; client_secret = $env:CS; resource = 'https://manage.devcenter.microsoft.com' }).access_token
          function Ler($caminho) { Invoke-RestMethod -Uri "$base$caminho" -Headers @{ Authorization = "Bearer $tok" } }
          $a = Ler ""
          Write-Host ("FILUNA_APP " + ($a | ConvertTo-Json -Compress -Depth 4))
          foreach ($qual in 'lastPublishedApplicationSubmission', 'pendingApplicationSubmission') {
            if (-not $a.$qual) { Write-Host "FILUNA_SUB $qual nenhuma"; continue }
            $s = Ler "/submissions/$($a.$qual.id)"
            $resumo = [ordered]@{ qual = $qual; id = $s.id; status = $s.status; visibility = $s.visibility; targetPublishMode = $s.targetPublishMode;
              targetPublishDate = $s.targetPublishDate; pricing = $s.pricing; allowTargetFutureDeviceFamilies = $s.allowTargetFutureDeviceFamilies;
              hasExternalInAppProducts = $s.hasExternalInAppProducts; meetAccessibilityGuidelines = $s.meetAccessibilityGuidelines;
              notesForCertification = $s.notesForCertification; fileUploadUrl = [bool]$s.fileUploadUrl;
              pacotes = @($s.applicationPackages | ForEach-Object { @{ arquivo = $_.fileName; estado = $_.fileStatus; versao = $_.version } });
              idiomas = @($s.listings.PSObject.Properties.Name); palavras = @($s.listings.PSObject.Properties | ForEach-Object { $_.Value.baseListing.keywords }) }
            Write-Host ("FILUNA_SUB " + ($resumo | ConvertTo-Json -Compress -Depth 6))
          }