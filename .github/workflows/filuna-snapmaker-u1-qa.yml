name: Filuna Snapmaker U1 official portable internal QA
on:
  push:
    branches:
      - filuna/oem-portable-first-qa-20261106
    paths:
      - "lab/snapmaker_u1_official_qa.py"
      - "fixtures/oem/snapmaker/**"
      - "fixtures/cube20.stl"
      - ".github/workflows/filuna-snapmaker-u1-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-snapmaker-u1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  official-u1:
    name: Official Snapmaker U1 v2.4.1 portable Windows A/B (no compilation)
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore already pinned OEM official portable cache
        id: restore-portables
        uses: actions/cache/restore@v4
        with:
          path: .oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Validate Python script only, never compile manufacturer software
        shell: pwsh
        run: python -m py_compile lab/snapmaker_u1_official_qa.py
      - name: Verify official U1 upstream presets, run Windows portable CLI A/B
        shell: pwsh
        run: |
          python lab/snapmaker_u1_official_qa.py --cache .oem-portable-cache --out qa-snapmaker-u1
          $code = $LASTEXITCODE
          if (Test-Path qa-snapmaker-u1/RESUMO.md) {
            Get-Content qa-snapmaker-u1/RESUMO.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      - name: Persist archive cache if absent, including a failing QA run
        if: always() && steps.restore-portables.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Preserve reproducible evidence whether PASS or FAIL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-u1-v2.4.1-official-portable-qa
          path: qa-snapmaker-u1/
          retention-days: 30
          if-no-files-found: warn
