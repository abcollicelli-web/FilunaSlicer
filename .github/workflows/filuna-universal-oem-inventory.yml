name: Filuna universal all-model all-profile OEM source audit
on:
  push:
    branches:
      - filuna/oem-portable-first-qa-20261106
    paths:
      - "FILUNA/tools/oem_universal_inventory.py"
      - "FILUNA/qa/test_oem_universal_inventory.py"
      - ".github/workflows/filuna-universal-oem-inventory.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-universal-oem-inventory
  cancel-in-progress: true
jobs:
  all-models-snapmaker-pilot:
    name: Universal catalog + official Snapmaker v2.4.1 source delta inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout Filuna QA branch (read only)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Python for universal inventory checks
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Automatic source and all-profiles regression
        run: |
          python -m py_compile FILUNA/tools/oem_universal_inventory.py FILUNA/qa/test_oem_universal_inventory.py
          python -m unittest discover -s FILUNA/qa -p test_oem_universal_inventory.py -v
      - name: Checkout EXACT pinned upstream official Snapmaker Git commit (not vendor executable)
        uses: actions/checkout@v4
        with:
          repository: Snapmaker/OrcaSlicer
          ref: bac6fd5c1e1c23ddf057cf6471ba4ed7ed621c4c
          path: vendor-upstream
          persist-credentials: false
          fetch-depth: 1
      - name: Verify official immutable commit (fail closed)
        run: |
          test "$(git -C vendor-upstream rev-parse HEAD)" = "bac6fd5c1e1c23ddf057cf6471ba4ed7ed621c4c"
          test -d vendor-upstream/resources/profiles/Snapmaker
      - name: Index source including network/auth/control and all Snapmaker models and presets
        run: |
          python FILUNA/tools/oem_universal_inventory.py \
            --brand snapmaker \
            --official "$GITHUB_WORKSPACE/vendor-upstream" \
            --base "$GITHUB_WORKSPACE" \
            --profiles "$GITHUB_WORKSPACE/vendor-upstream/resources/profiles/Snapmaker" \
            --out /tmp/filuna-snapmaker-universal \
            --copy
          cat /tmp/filuna-snapmaker-universal/SUMMARY.json
          echo 'Source and profile audit only; NO code integrated or hardware enabled.' >> "$GITHUB_STEP_SUMMARY"
          test -s /tmp/filuna-snapmaker-universal/source-manifest.json
          test -s /tmp/filuna-snapmaker-universal/all-models-all-profiles.json
      - name: Preserve source, profile manifest and review blockers (no copied OEM code)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-all-models-profiles-full-source-audit-only
          path: |
            /tmp/filuna-snapmaker-universal/source-manifest.json
            /tmp/filuna-snapmaker-universal/all-models-all-profiles.json
            /tmp/filuna-snapmaker-universal/SUMMARY.json
          retention-days: 30
          if-no-files-found: warn
