name: Filuna Snapmaker U1 vector-guard root-cause diagnostic
on:
  push:
    branches:
      - filuna/oem-portable-first-qa-20261106
    paths:
      - "lab/snapmaker_u1_guard_probe.py"
      - "lab/snapmaker_u1_inherit.py"
      - ".github/workflows/filuna-snapmaker-u1-guard-probe.yml"
      - "fixtures/oem/snapmaker/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-snapmaker-vector-guard-probe
  cancel-in-progress: false
jobs:
  diagnostic:
    name: Official unchanged control and one-field diagnostic COPY A/B
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore official SHA-pinned ZIP cache
        id: portable-cache
        uses: actions/cache/restore@v4
        with:
          path: .oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Syntax check only; never compile manufacturer slicer
        shell: pwsh
        run: python -m py_compile lab/snapmaker_u1_guard_probe.py
      - name: Enable per-user Windows Error Reporting minidumps (diagnostic only)
        shell: pwsh
        run: |
          $dumpDir = Join-Path $env:GITHUB_WORKSPACE 'qa-snapmaker-u1-guard-probe/crash-dumps'
          New-Item -ItemType Directory -Force -Path $dumpDir | Out-Null
          $werKey = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\snapmaker-orca.exe'
          New-Item -Path $werKey -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpFolder -Value $dumpDir -PropertyType ExpandString -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpType -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $werKey -Name DumpCount -Value 4 -PropertyType DWord -Force | Out-Null
          $configuredKey = Get-ItemProperty -LiteralPath $werKey -ErrorAction Stop
          if ($configuredKey.DumpType -ne 1 -or $configuredKey.DumpCount -ne 4 -or $configuredKey.DumpFolder -ne $dumpDir) { throw 'WER_LOCALDUMPS_READBACK_MISMATCH' }
          Write-Host 'WER_LOCALDUMPS_READBACK_PASS: DumpType=1 DumpCount=4 (minidump only)'
      - name: Capture source-preserving U1 process guard diagnosis
        shell: pwsh
        run: |
          python lab/snapmaker_u1_guard_probe.py --cache .oem-portable-cache --out qa-snapmaker-u1-guard-probe
          $code = $LASTEXITCODE
          if (Test-Path qa-snapmaker-u1-guard-probe/RESUMO.md) {
            Get-Content qa-snapmaker-u1-guard-probe/RESUMO.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      - name: Capture first-chance OEM access violation with Windows debugger (original A only)
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'qa-snapmaker-u1-guard-probe'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $report = Join-Path $root 'first-chance-debugger.txt'
          $kits = @(
            "${env:ProgramFiles(x86)}\\Windows Kits\\10\\Debuggers\\x64\\cdb.exe",
            "${env:ProgramFiles}\\Windows Kits\\10\\Debuggers\\x64\\cdb.exe"
          )
          $cdb = $kits | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          $log = Join-Path $root 'baseline-original-effective-A.log'
          if (-not $cdb) {
            'DEBUGGER_UNAVAILABLE: cdb.exe not installed on runner; no stack captured' | Set-Content $report
            Write-Host 'DEBUGGER_UNAVAILABLE'
          } elseif (-not (Test-Path $log)) {
            'DEBUGGER_INPUT_MISSING: original A command log unavailable' | Set-Content $report
            Write-Host 'DEBUGGER_INPUT_MISSING'
          } else {
            $line = Get-Content $log -TotalCount 1
            if (-not $line.StartsWith('COMMAND_JSON=')) { throw 'DEBUGGER_COMMAND_PROVENANCE_MISSING' }
            $argv = @(ConvertFrom-Json ($line.Substring(13)))
            $exe = [string]$argv[0]
            $cliArgs = @($argv | Select-Object -Skip 1)
            # Debug only the OEM parent; -o attaches crashpad_handler children and may consume g at their initial breakpoint.
            # After g stops on the first-chance AV, CDB executes the remaining commands.
            $command = 'sxe av; g; .echo FIRST_CHANCE_ACCESS_VIOLATION; r; kv 24; lm; q'
            $raw = & $cdb -G -c $command $exe @cliArgs 2>&1 | Out-String
            $raw = $raw -replace '(?i)[A-Z]:\\[^\s,;]+', '[REDACTED_PATH]'
            $raw = $raw -replace '(?i)(token|password|secret|authorization|access[_-]?key)\s*[:=]\s*[^\s,;]+', '$1=[REDACTED]'
            $raw | Set-Content $report -Encoding utf8
            if ($raw -match 'FIRST_CHANCE_ACCESS_VIOLATION') { Write-Host 'DEBUGGER_FIRST_CHANCE_CAPTURED' }
            else { Write-Host 'DEBUGGER_NO_FIRST_CHANCE_STACK' }
          }
      - name: Inventory WER dumps after bounded capture wait
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'qa-snapmaker-u1-guard-probe'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $werKey = 'HKCU:\Software\Microsoft\Windows\Windows Error Reporting\LocalDumps\snapmaker-orca.exe'
          $configured = (Get-ItemProperty -Path $werKey -ErrorAction SilentlyContinue).DumpFolder
          $paths = @($configured, (Join-Path $env:LOCALAPPDATA 'CrashDumps')) | Where-Object { $_ } | Select-Object -Unique
          $entries = @()
          foreach ($seconds in @(0, 3, 6, 12)) {
            if ($seconds -gt 0) { Start-Sleep -Seconds $seconds }
            $entries = @(
              foreach ($dir in $paths) {
                if (Test-Path -LiteralPath $dir) {
                  Get-ChildItem -LiteralPath $dir -Filter 'snapmaker-orca*.dmp' -File -ErrorAction SilentlyContinue |
                    ForEach-Object {
                      [pscustomobject]@{ path=$_.FullName; bytes=$_.Length; sha256=(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash }
                    }
                }
              }
            )
            if ($entries.Count -gt 0) { break }
          }
          $report = [pscustomobject]@{ configured_folder=$configured; searched_folders=$paths; dump_count=$entries.Count; dumps=$entries }
          $report | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $root 'wer-dump-inventory.json') -Encoding utf8
          Write-Host ("WER_DUMP_COUNT=" + $entries.Count)
          if ($entries.Count -eq 0) { Write-Host 'WER_NO_DUMP_CAPTURED: no native stack evidence' }
          # Keep native dumps out of the artifact; only their SHA/size/path inventory is uploaded.
      - name: Collect Windows Application Error event evidence (no OEM changes)
        if: always()
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE 'qa-snapmaker-u1-guard-probe'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $events = @()
          try {
            $events = @(Get-WinEvent -FilterHashtable @{LogName='Application'; Id=1000,1001; StartTime=(Get-Date).AddMinutes(-40)} -ErrorAction Stop |
              Where-Object { $_.Message -match 'snapmaker-orca' } |
              Select-Object -First 12 |
              ForEach-Object {
                $msg = $_.Message
                # Avoid storing absolute runner paths or usernames in the diagnostic artifact.
                $msg = $msg -replace '(?i)[A-Z]:\\[^\s,;]+', '[REDACTED_PATH]'
                [pscustomobject]@{ event_id=$_.Id; provider=$_.ProviderName; time_utc=$_.TimeCreated.ToUniversalTime().ToString('o'); message=$msg }
              })
          } catch {
            $exceptionType = $_.Exception.GetType().FullName
            $exceptionMessage = [string]$_.Exception.Message
            $exceptionMessage = $exceptionMessage -replace '(?i)[A-Z]:\\[^\\s,;]+', '[REDACTED_PATH]'
            $exceptionMessage = $exceptionMessage -replace '(?i)(token|password|secret|authorization|access[_-]?key)\\s*[:=]\\s*[^\\s,;]+', '$1=[REDACTED]'
            $exceptionMessage = $exceptionMessage.Substring(0, [Math]::Min(400, $exceptionMessage.Length))
            Write-Host ('EVENT_QUERY_UNAVAILABLE: ' + $exceptionType + ': ' + $exceptionMessage)
          }
          [pscustomobject]@{ event_count=$events.Count; events=$events } |
            ConvertTo-Json -Depth 5 |
            Set-Content -Path (Join-Path $root 'windows-application-error-events.json') -Encoding utf8
          Write-Host ('SNAPMAKER_EVENT_COUNT=' + $events.Count)
      - name: Preserve diagnostic cases and logs (never installer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-u1-vector-guard-one-field-diagnostic
          path: qa-snapmaker-u1-guard-probe/
          retention-days: 7
          if-no-files-found: warn
