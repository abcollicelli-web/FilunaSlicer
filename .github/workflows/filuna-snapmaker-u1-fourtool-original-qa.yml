name: Filuna Snapmaker U1 original four tool CLI QA (no printing)
on:
  push:
    branches: [filuna/oem-portable-first-qa-20261106]
    paths:
      - "lab/snapmaker_u1_fourtool_original_qa.py"
      - "lab/test_snapmaker_minimal_core_3mf.py"
      - ".github/workflows/filuna-snapmaker-u1-fourtool-original-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-u1-fourtool-official-${{ github.ref }}
  cancel-in-progress: true
jobs:
  four-extruder-original-v241:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pinned official portable Snapmaker Orca 2.4.1
        id: source
        uses: actions/cache/restore@v4
        with:
          path: .oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Verify syntax, generate four-extruder 3MF, slice twice with official CLI
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          python -m py_compile lab/snapmaker_u1_fourtool_original_qa.py
          python -m unittest discover -s lab -p "test_snapmaker_minimal_core_3mf.py" -v
          if ($LASTEXITCODE -ne 0) { throw "STANDARDS_3MF_FIXTURE_TOPOLOGY_FAILED" }
          python lab/snapmaker_u1_fourtool_original_qa.py --cache .oem-portable-cache --out qa-snapmaker-fourtool
          $code=$LASTEXITCODE
          if (Test-Path qa-snapmaker-fourtool/fourtool-proof.json) {
            python -c "import json; d=json.load(open('qa-snapmaker-fourtool/fourtool-proof.json')); print('OEM_FOUR_TOOL_STATUS',d['status'])"
          }
          if ($code -ne 0) {
            throw "OEM_FOUR_TOOL_PROFILE_OR_ORIGINAL_CLI_NOT_PROVEN exit=$code"
          }
      - name: Save official portable cache only if needed
        if: always() && steps.source.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Persist 4-tool configuration, official G-code and safety report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-u1-original-241-fourtool-exact-gcodes
          path: qa-snapmaker-fourtool/
          retention-days: 30
          if-no-files-found: warn
      - name: Explicit gates remain pending
        if: always()
        shell: bash
        run: |
          echo "Only source-original OEM CLI 4-extruder laboratory. No Filuna native G-code comparison, authorized live Klipper macro proof, device upload ACK or physical print." >> "$GITHUB_STEP_SUMMARY"
