name: Filuna Snapmaker U1 one-preset-path differential
on:
  push:
    branches:
      - filuna/oem-portable-first-qa-20261106
    paths:
      - "lab/snapmaker_u1_profile_path_sensitivity_qa.py"
      - ".github/workflows/filuna-snapmaker-u1-profile-path.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-u1-profile-path-differential
  cancel-in-progress: true
jobs:
  exact-inputs:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate diagnostic Python imports only (no OEM compilation)
        shell: pwsh
        run: |
          python -m py_compile lab/snapmaker_u1_profile_path_sensitivity_qa.py
          python -m py_compile lab/snapmaker_runtime_nozzle_guard_qa.py
      - name: Restore exact original Snapmaker portable ZIP
        uses: actions/cache/restore@v4
        with:
          path: .oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Compare byte-identical OEM presets at distinct profile paths
        shell: pwsh
        run: |
          python lab/snapmaker_u1_profile_path_sensitivity_qa.py --cache .oem-portable-cache --out qa-snapmaker-u1-profile-path
          $code = $LASTEXITCODE
          if (Test-Path qa-snapmaker-u1-profile-path/RESUMO.md) {
            Get-Content qa-snapmaker-u1-profile-path/RESUMO.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $code
      - name: Save separate original generated G-code, exact input SHA and true diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-u1-exact-profile-path-differential
          path: qa-snapmaker-u1-profile-path/
          if-no-files-found: warn
          retention-days: 30
