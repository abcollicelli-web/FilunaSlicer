name: Filuna Windows build

# Build manual do Filuna para Windows x64, reutilizando os workflows do upstream
# (build_check_cache.yml -> build_deps.yml -> build_orca.yml) sem modificá-los.
# Sem assinatura: os secrets do upstream não existem no fork, e os passos que
# dependem deles são ignorados/condicionados a github.repository == OrcaSlicer/OrcaSlicer.
# Artefatos do upstream: OrcaSlicer_Windows_<ver>_portable e OrcaSlicer_Windows_<ver> (instalador).
# O job filuna_artifacts republica os mesmos arquivos como Filuna_Windows_* (sem editar build_orca.yml).

on:
  # workflow_dispatch só funciona via API quando o arquivo existe na branch padrão (main,
  # que não tocamos). Por isso também dispara por push em filuna/main ao mudar este
  # arquivo ou FILUNA/BUILD_TRIGGER.
  push:
    branches: [ 'filuna/main', 'filuna/rebrand-*' ]
    paths:
      - '.github/workflows/filuna-windows.yml'
      - 'FILUNA/BUILD_TRIGGER'
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: 'Somente dependências'
        type: boolean
        default: false

concurrency:
  group: filuna-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_windows_x64:
    name: Filuna Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: ${{ inputs.build-deps-only || false }}
      force-build: true
    secrets: inherit

  filuna_artifacts:
    name: Artefatos Filuna
    needs: build_windows_x64
    if: ${{ !inputs.build-deps-only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: OrcaSlicer_Windows_*
          path: dl
      - name: Renomear para Filuna
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p out/portable out/installer
          for d in dl/OrcaSlicer_Windows_*; do
            case "$d" in
              *MSIX*)
                echo "Ignorando artefato MSIX (sem .exe): $d"
                continue
                ;;
              *_portable)
                cp -r "$d"/. out/portable/
                ;;
              *)
                exes=("$d"/*.exe)
                if (( ${#exes[@]} == 0 )); then
                  echo "Sem .exe em $d; ignorando"
                  continue
                fi
                for f in "${exes[@]}"; do
                  cp "$f" "out/installer/$(basename "$f" | sed 's/^OrcaSlicer_/Filuna_/')"
                done
                ;;
            esac
          done
          find out -maxdepth 3 -print
      - uses: actions/upload-artifact@v4
        with:
          name: Filuna_Windows_x64_portable
          path: out/portable
      - uses: actions/upload-artifact@v4
        with:
          name: Filuna_Windows_x64_installer
          path: out/installer
