name: Filuna native C++ OEM G-code safety gate QA
on:
  push:
    branches: [filuna/oem-portable-first-qa-20261106]
    paths:
      - "src/slic3r/Utils/FilunaGCodeSafety.hpp"
      - "src/slic3r/Utils/PrintHost.cpp"
      - "src/slic3r/Utils/PrintHost.hpp"
      - "lab/test_snapmaker_native_gcode_safety.cpp"
      - "lab/test_snapmaker_native_send_gate_source.py"
      - ".github/workflows/filuna-native-gcode-safety-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-cpp17-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile native C++17 safety core with strict warnings
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra -Wpedantic -Werror \
            -o /tmp/filuna-native-safety lab/test_snapmaker_native_gcode_safety.cpp
          /tmp/filuna-native-safety
          python3 -m unittest discover -s lab -p "test_snapmaker_native_send_gate_source.py" -v
      - uses: actions/download-artifact@v4
        with:
          name: filuna-snapmaker-u1-40-original-cli-reproducibility
          repository: abcollicelli-web/FilunaSlicer
          run-id: 42321783683
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .oem-snapmaker-241
      - uses: actions/download-artifact@v4
        with:
          name: filuna-portable-first-five-official-eight-brands
          repository: abcollicelli-web/FilunaSlicer
          run-id: 42312894880
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .oem-bambu
      - uses: actions/download-artifact@v4
        with:
          name: filuna-creality-7.3.1-official-portable-qa
          repository: abcollicelli-web/FilunaSlicer
          run-id: 42310133259
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .oem-creality
      - name: Obtain git-blob-pinned original U1 2-color G-code
        run: |
          set -euo pipefail
          mkdir -p .oem-snapmaker-2color
          curl -fL --retry 3 --max-time 45 \
            "https://raw.githubusercontent.com/DesignMaster-Solutions/u1-dryrun/38ab8c7/examples/sign-orca-2.4.1-linux.gcode.gz" \
            -o .oem-snapmaker-2color/original.gz
          [ "$(git hash-object .oem-snapmaker-2color/original.gz)" = \
            "ee6943bcf5ed255736218fc4942b05217d8f607c" ]
          gzip -dc .oem-snapmaker-2color/original.gz > .oem-snapmaker-2color/original.gcode
      - name: Native binary vs original OEM regression cases
        run: |
          set -euo pipefail
          mkdir -p qa-native
          python - <<'PY'
          import hashlib
          from pathlib import Path
          cases={
            ".oem-snapmaker-241/stress-00/plate_1.gcode":
                "18486931ede41c194209af31c1ef6894f451d47779e66aaf6c124d209e2c7d42",
            ".oem-snapmaker-2color/original.gcode":
                "05f227dd12598bd99626dd60a29e3ecdc2a97ae65db803d6e4f9520587254f48",
            ".oem-bambu/bambu/run-A/plate_1.gcode":
                "ac7731e7653bd9a46531217307d745a1f1996d20bb14e065a50bf691d7db96d5",
            ".oem-creality/run-A/plate_1.gcode":
                "3ed1de4e20a61f35c45b68a7cd21cdaa454200d1eeb449b3373b76e9a76142a3",
          }
          for p,sha in cases.items():
            assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==sha,(p,"ORIGINAL_MISMATCH")
          print("FOUR_OEM_GCODES_SHA256_VERIFIED")
          PY
          /tmp/filuna-native-safety .oem-snapmaker-241/stress-00/plate_1.gcode \
            | tee qa-native/snapmaker-mono.log
          set +e
          /tmp/filuna-native-safety .oem-snapmaker-2color/original.gcode \
            > qa-native/snapmaker-2color.log
          rc=$?
          set -e
          cat qa-native/snapmaker-2color.log
          [ "$rc" -eq 2 ] || { echo "NATIVE_TWO_COLOR_MUST_BLOCK"; exit 1; }
          grep -q 'NATIVE_COLLISION line=38911 layer=14' qa-native/snapmaker-2color.log \
            || { echo "NATIVE_MUST_FIND_PROVEN_OEM_FINAL_PURGE_LINE"; exit 1; }
          /tmp/filuna-native-safety .oem-bambu/bambu/run-A/plate_1.gcode GEOMETRY_ONLY \
            | tee qa-native/bambu-a1.log
          /tmp/filuna-native-safety .oem-creality/run-A/plate_1.gcode GEOMETRY_ONLY \
            | tee qa-native/creality.log
          for f in snapmaker-mono bambu-a1 creality; do
            grep -q 'NATIVE_STATUS=PASS ERRORS=0' "qa-native/$f.log" ||
              { echo "NATIVE_FALSE_POSITIVE_$f"; exit 1; }
          done
          echo "NATIVE_CPP_OEM_GCODE_REGRESSION_PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-native-cpp17-snapmaker-gcode-safety-evidence
          path: qa-native/
          if-no-files-found: warn
