name: Filuna Snapmaker U1 spaced-time official G-code repeatability
on:
  push:
    branches:
      - filuna/oem-portable-first-qa-20261106
    paths:
      - "lab/snapmaker_u1_temporal_ab_qa.py"
      - "lab/test_snapmaker_u1_temporal_ab_qa.py"
      - ".github/workflows/filuna-snapmaker-u1-temporal-ab.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-snapmaker-u1-temporal-ab
  cancel-in-progress: true
jobs:
  gcode-a-b:
    name: Original Snapmaker 2.4.1 portable with isolated runtime guard, 2.5-second gap
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Negative and positive regression for exact header-only difference
        shell: pwsh
        run: |
          python -m py_compile lab/snapmaker_u1_temporal_ab_qa.py lab/test_snapmaker_u1_temporal_ab_qa.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s lab -p test_snapmaker_u1_temporal_ab_qa.py -v
          exit $LASTEXITCODE
      - name: Restore pinned Snapmaker official ZIP cache
        uses: actions/cache/restore@v4
        with:
          path: .oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Two original CLI invocations in separate seconds with identical OEM model inputs
        shell: pwsh
        run: |
          python lab/snapmaker_u1_temporal_ab_qa.py --cache .oem-portable-cache --out qa-snapmaker-u1-temporal-ab
          $rc = $LASTEXITCODE
          if (Test-Path qa-snapmaker-u1-temporal-ab/RESUMO.md) {
            Get-Content qa-snapmaker-u1-temporal-ab/RESUMO.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $rc
      - name: Preserve real unmodified generated G-codes, raw hashes and precise header-only diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-u1-temporal-header-only-A-B
          path: qa-snapmaker-u1-temporal-ab/
          retention-days: 30
          if-no-files-found: warn
