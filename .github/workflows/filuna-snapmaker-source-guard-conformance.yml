name: Filuna Snapmaker source-level OEM crash guard conformance
on:
  push:
    branches:
      - filuna/oem-portable-first-qa-20261106
    paths:
      - "FILUNA/fabricantes/snapmaker/patches/0001-guard-nozzle-diameter-process-load.patch"
      - ".github/workflows/filuna-snapmaker-source-guard-conformance.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-snapmaker-source-guard-only
  cancel-in-progress: true
jobs:
  patch-audit:
    name: Verify one-function OEM patch against exact official upstream v2.4.1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pinned full manufacturer source (audit only, no build)
        uses: actions/checkout@v4
        with:
          repository: Snapmaker/OrcaSlicer
          ref: bac6fd5c1e1c23ddf057cf6471ba4ed7ed621c4c
          path: original-snapmaker
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact vendor commit
        run: test "$(git -C original-snapmaker rev-parse HEAD)" = "bac6fd5c1e1c23ddf057cf6471ba4ed7ed621c4c"
      - name: Verify source patch applies and touches only intended C++ method
        run: |
          set -euo pipefail
          cp FILUNA/fabricantes/snapmaker/patches/0001-guard-nozzle-diameter-process-load.patch /tmp/filuna-guard.patch
          pushd original-snapmaker
          git apply --check /tmp/filuna-guard.patch
          git apply /tmp/filuna-guard.patch
          test "$(git diff --name-only)" = "src/libslic3r/PrintConfig.cpp"
          python3 - <<'PY'
          from pathlib import Path
          text=Path("src/libslic3r/PrintConfig.cpp").read_text(encoding="utf-8")
          marker='if (this->has("wipe_tower_filament"))'
          i=text.index(marker)
          block=text[i:i+1300]
          assert 'const auto* nozzles = this->opt<ConfigOptionFloats>("nozzle_diameter")' in block
          assert 'if (nozzles && nozzles->size() > 0)' in block
          assert 'this->option("wipe_tower_filament")->setInt(0)' in block
          print("SNAPMAKER_SOURCE_PATCH_TEST PASS source guard present, no other file modified")
          PY
          git diff --check
          git diff -- src/libslic3r/PrintConfig.cpp > ../snapmaker-source-guard.patchreview.diff
          git apply -R /tmp/filuna-guard.patch
          test -z "$(git status --porcelain)"
          popd
          sha256sum snapmaker-source-guard.patchreview.diff > snapmaker-source-guard-review.sha256
          echo "Only source-level conformance proven: NOT COMPILED, NOT Filuna native parity." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve source-only patch validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-source-only-nozzle-null-guard-conformance
          path: |
            snapmaker-source-guard.patchreview.diff
            snapmaker-source-guard-review.sha256
          if-no-files-found: warn
          retention-days: 30
