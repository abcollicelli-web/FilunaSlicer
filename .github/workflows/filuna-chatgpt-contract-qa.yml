name: Filuna ChatGPT — contracts (isolated)
on:
  push:
    branches:
      - filuna/chatgpt-plugin-library-only-20261119
    paths:
      - integrations/chatgpt/**
      - .github/workflows/filuna-chatgpt-contract-qa.yml
  pull_request:
    paths:
      - integrations/chatgpt/**
      - .github/workflows/filuna-chatgpt-contract-qa.yml

permissions:
  contents: read

jobs:
  test-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/chatgpt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract test dependency only
        run: python -m pip install 'jsonschema>=4.23,<5'
      - name: Compile plugin modules
        run: python -m compileall -q filuna_gateway tests
      - name: Test policy, auth scopes and no-file guarantees
        run: python -m unittest discover -s tests -v
