name: Filuna Snapmaker U1 wipe-tower source causal isolation
on:
  push:
    branches:
      - filuna/oem-portable-first-qa-20261106
    paths:
      - "lab/snapmaker_u1_wipe_tower_probe.py"
      - ".github/workflows/filuna-snapmaker-u1-wipe-tower-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-snapmaker-u1-wipe-tower-causal
  cancel-in-progress: true
jobs:
  root-cause:
    name: Official immutable CLI versus minimal profile and one-key changes
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and source integrity preflight
        shell: pwsh
        run: python -m py_compile lab/snapmaker_u1_wipe_tower_probe.py
      - name: Restore official 2.4.1 original portable cache
        uses: actions/cache/restore@v4
        with:
          path: .oem-portable-cache
          key: filuna-portable-upstream-windows-20261106-v1
      - name: Reproduce source-level null-access preconditions on original binary
        shell: pwsh
        run: |
          python lab/snapmaker_u1_wipe_tower_probe.py --cache .oem-portable-cache --out qa-snapmaker-u1-wipe-tower-root-cause
          $rc = $LASTEXITCODE
          if (Test-Path qa-snapmaker-u1-wipe-tower-root-cause/RESUMO.md) {
            Get-Content qa-snapmaker-u1-wipe-tower-root-cause/RESUMO.md | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $rc
      - name: Preserve source hashes, untouched control, and diagnostic G-code artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-snapmaker-u1-wipe-tower-source-differential
          path: qa-snapmaker-u1-wipe-tower-root-cause/
          retention-days: 30
          if-no-files-found: warn
