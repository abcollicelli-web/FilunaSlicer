name: Filuna Anycubic original vendor Debian isolated QA
on:
  push:
    branches:
      - filuna/oem-portable-first-qa-20261106
    paths:
      - "lab/anycubic_vendor_deb_qa.py"
      - "lab/test_anycubic_vendor_deb_qa.py"
      - ".github/workflows/filuna-anycubic-original-deb-qa.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: filuna-anycubic-original-deb-qa
  cancel-in-progress: true
jobs:
  provenance:
    name: Vendor APT SHA + isolated Debian extraction and model profile inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fail-closed source and identity regression tests
        run: |
          python -m py_compile lab/anycubic_vendor_deb_qa.py lab/test_anycubic_vendor_deb_qa.py
          python -m unittest discover -s lab -p 'test_anycubic_vendor_deb_qa.py' -v
      - name: Original package cache
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: .anycubic-vendor-cache
          key: anycubic-vendor-2.0.06-153422098-20261107
      - name: Verify Anycubic CDN + package hash, inventory Kobra models
        run: |
          python lab/anycubic_vendor_deb_qa.py --cache .anycubic-vendor-cache --out qa-anycubic-original-deb
          code=$?
          if test -e qa-anycubic-original-deb/RESUMO.md; then
            cat qa-anycubic-original-deb/RESUMO.md >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Save vendor cache even on failure (manifest SHA checked every run)
        if: always() && steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .anycubic-vendor-cache
          key: anycubic-vendor-2.0.06-153422098-20261107
      - name: Preserve report/logs on all outcomes (not the installer bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filuna-anycubic-original-deb-provenance-kobra-inventory
          path: qa-anycubic-original-deb/
          retention-days: 30
          if-no-files-found: warn
